    titel: "PDFuchs Reader 1.2.1: stabiler beim Öffnen aus anderen Apps"
    text: >-
      PDFuchs Reader 1.2.1 behebt einen seltenen Absturz beim Öffnen von PDFs aus anderen
      Apps. E-Books öffnen robuster – beschädigte Dateien zeigen jetzt eine Meldung, statt
