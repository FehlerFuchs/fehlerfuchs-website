      Einreichen eigener Ideen und eine Seite, die offen zeigt, was FehlerFuchs
      gerade an Ausstattung braucht. Alte Adressen leiten weiter; Lesezeichen
      bleiben gültig.

  - id: snapfuchs-play-veroeffentlichung
    typ: store
    produkt: snapfuchs
    # Datum ergibt sich aus platforms[android].since und wird von dort geholt.
    titel: SnapFuchs ist im Play Store
