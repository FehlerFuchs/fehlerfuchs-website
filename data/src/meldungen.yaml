# Aktuelles — Meldungen
# =====================
#
# Geprüft gegen data/schema/meldung.schema.json.
#
# Der Grundsatz dieser Datei ist der wichtigste am ganzen Modell:
#
#     Eine Meldung wiederholt KEINE Tatsache, die schon beim Produkt steht.
#
# Version, Datum, Download-Adresse, Store-Link und Produktname kommen aus
# data/src/products/*.yaml. Hier steht nur, was der Feed zusätzlich braucht:
# eine Überschrift und ein paar Sätze in normaler Sprache.
#
# Warum so streng: Genau hier ist die Website schon einmal auseinandergelaufen.
# Auf der Startseite stand „Beta pausiert", während die Beta lief — weil die
# Aussage an zwei Stellen gepflegt werden musste und eine davon vergessen wurde.
# Wenn das Datum nur einmal existiert, kann es nicht mehr widersprüchlich sein.
#
# Reihenfolge in dieser Datei ist egal; sortiert wird beim Erzeugen nach Datum.
# Neue Einträge trotzdem bitte oben anfügen — dann liest sich die Datei wie der Feed.
#
# Prüfregeln, die auf diese Datei angewendet werden (tools/build_data.py):
#   • jeder Release eines Produkts braucht eine Meldung          → Warnung
#   • produkt und version müssen im Modell existieren            → Fehler
#   • datum darf einem Release/„since" nicht widersprechen       → Fehler
#   • eine Versionsnummer im Titel muss zur Version passen       → Fehler
#   • ziel.url darf nicht wiederholen, was automatisch entsteht  → Warnung
#   • ids sind eindeutig und ändern sich nie                     → Fehler

meldungen:

  - id: snapfuchs-1-2-0
    typ: veroeffentlichung
    produkt: snapfuchs
    datum: "2026-08-17"
    titel: "SnapFuchs 1.2.0: Name vergeben, Ablage selbst bestimmt"
    text: >-
      Zwei kleine Handgriffe, die im Alltag viel ausmachen — und beide kostenlos:
      Ein Dokument bekommt jetzt schon beim Scannen seinen Namen, der dann auch der
      Dateiname beim Teilen ist. Und wer möchte, legt einen eigenen Ordner auf dem
      Gerät fest, in den jeder Export zusätzlich wandert. Der Ordner wird einmal
      ausgewählt; eine Speicher-Berechtigung braucht SnapFuchs dafür nicht.

  # GewerbePro 1.0.0: Übergang aus der offenen Beta in die Vollversion (17.08.2026,
  # signiert). 'version: 1.0.0' bindet die Meldung an den releases-Eintrag – Datum,
  # Version und Download kommen von dort und stehen bewusst NICHT im Text.
  - id: gewerbepro-1-0-0-launch
    typ: veroeffentlichung
    produkt: gewerbepro
    version: "1.0.0"
    titel: "GewerbePro 1.0.0 ist da"
    text: >-
      Aus der offenen Beta wird die Vollversion: GewerbePro ist runderneuert. Ein neues
      Cockpit-Dashboard bündelt Kennzahlen, offene Rechnungen und anstehende Termine; dazu
      kamen ein Dokumenteneingang mit Belegbuchung, geführte Touren und eine
      übersichtlichere Oberfläche. Die kostenlose Gewerbe-Edition läuft sofort; die
      Pro-Funktionen – E-Rechnung nach EN 16931, Mahnwesen, PDFuchs und die
      Companion-App – schaltet eine Lizenz frei. Bestehende Beta-Lizenzen bleiben gültig.
      Alles bleibt lokal auf dem eigenen Rechner, ohne Cloud und ohne Konto.

  # OrgaFuchs ist am 08.08.2026 im Play Store veröffentlicht (nach zwei Ablehnungen).
  # typ 'store' ohne datum/wege: Datum kommt aus platforms[android].since, der
  # Play-Link aus storeId. Ersetzt die frühere „in Prüfung"-Meldung (überholt).
  - id: orgafuchs-play-veroeffentlichung
    typ: store
    produkt: orgafuchs
    titel: OrgaFuchs ist im Play Store
    text: >-
      Der lokale Familien- und Schichtplaner ist da – kostenlos, werbefrei und ohne
      Konto. Nach den finalen Tests und der Sicherheitshärtung ist einiges dazugekommen:
      ein Ende-zu-Ende-verschlüsselter Live-Sync über ein gehärtetes Relais (OFSP/1,
      Kopplung per QR-Code) mit sicherem Gerätewechsel und Notfall-Wiederherstellung;
      optimierte Kalenderansichten mit Startbildschirm-Widgets für Tag, Woche und Monat;
      klarere Benachrichtigungen mit Gerätenamen; wiederkehrende Termine; dazu Datenschutz
      und „Was ist neu" direkt in der App. Alle Daten bleiben auf dem Gerät.

  # OrgaFuchs 1.6.1 (Changelog). 'version: 1.6.1' bindet die Meldung an den
  # releases-Eintrag – Datum (14.08.) leitet sich daraus ab. Von Matthias zur
  # Veröffentlichung freigegeben (14.08.). Löst die 1.5.0-Meldung ab. Nachrichten
  # laufen E2E über den eigenen Relay (nicht Google/FCM) – kein FCM-Bezug nötig.
  - id: orgafuchs-1-6-1
    typ: update
    produkt: orgafuchs
    version: "1.6.1"
    titel: "OrgaFuchs 1.6.1: Nachrichten an alle – mit Postfach"
    text: >-
      Neu in OrgaFuchs 1.6.1: „Nachricht an alle" – schick der ganzen Familie in
      Sekunden eine kurze Nachricht. Sie landet bei allen im Postfach und als
      Benachrichtigung, Ende-zu-Ende über deinen eigenen Relay verteilt, nicht über
      fremde Server; Ungelesenes bleibt markiert, bis du es liest. Außerdem sind
      Sonn-/Feiertage und Ferien im Kalender jetzt farblich hervorgehoben (Tag,
      Woche, Monat), die Geräteliste zeigt „zuletzt aktiv", und der Hintergrund-
      Empfang läuft auf Android 14/15 stabiler. Dazu viele kleinere Verbesserungen.

  # HaushaltsManager: erste öffentliche Veröffentlichung. 'version: 1.0.0' bindet
  # die Meldung an den releases-Eintrag (Datum 12.08.).
  - id: haushaltsmanager-1-0-0-launch
    typ: veroeffentlichung
    produkt: haushaltsmanager
    version: "1.0.0"
    titel: "Neu: FehlerFuchs HaushaltsManager für Windows"
    text: >-
      Der HaushaltsManager ist da – ein lokales Windows-Programm für den ganzen
      Haushalt: Zählerstände für Strom, Gas und Wasser, Verträge mit
      Kündigungsfristen, ein vollständiges Haushaltsbuch, Auswertungen und
      PDF-Berichte. Alle Daten bleiben auf deinem Gerät – kein Konto, kein Tracking.
      Frei herunterladen und mit Testphase ausprobieren; die Vollversion gibt es als
      Einmalkauf (20 €, 5 Arbeitsplätze) über Digistore24.

  # Statusmeldung „warum es länger nichts Neues gab" (ChefBüro-Auftrag 2,
  # 01.08.2026). Kein Changelog, keine Versionsnummern; Fakten aus dem
  # Gesamt-Logbuch. Signatur mit Matzes Website-Ausnahme zur Namensregel.
  - id: pflege-statt-neues
    typ: hinweis
    datum: "2026-08-01"
    titel: Kurz erklärt – warum es zuletzt ruhiger war
    text: >-
      In den letzten Wochen ist hier bewusst wenig Neues erschienen. Die Zeit ist
      stattdessen in die bestehenden Produkte geflossen – geprüft, nachgebessert und
      abgesichert, damit verlässlich bleibt, was schon da ist. Gearbeitet haben wir
      zuletzt vor allem an OrgaFuchs, SnapFuchs, MobileReport und GewerbePro:
      Beschreibungen geschärft, Sicherheit und Datenschutz nachgezogen und den
      Update-Weg repariert. Neue Ankündigungen kommen wieder, sobald das Nächste
      wirklich fertig ist. — Matthias (Matze) von FehlerFuchs

  # Die zwei OrgaFuchs-Play-Ablehnungsmeldungen (18.07. + 24.07.) am 05.08.2026
  # aus dem Feed entfernt: Der ganze Weg steht bereits als Zeitleiste (umwege)
  # auf der Produktseite – der Feed soll Produkt-Fakten nicht doppeln
  # (Grundsatz dieser Datei). Zudem war OrgaFuchs aus Feed/Download genommen,
  # womit „Windows bleibt verfügbar" der älteren Meldung überholt war.

  - id: gewerbepro-companion-in-arbeit
    typ: hinweis
    produkt: gewerbepro-companion
    datum: "2026-07-24"
    titel: GewerbePro bekommt einen mobilen Begleiter
    text: >-
      In Arbeit: eine Android-App, die unterwegs Kunden, Auftrags-Entwürfe,
      Fahrten und Quittungen erfasst und als Paket an GewerbePro auf dem PC
      übergibt – offline und ohne Konto. Bisher läuft nur ein Testbau; einen
