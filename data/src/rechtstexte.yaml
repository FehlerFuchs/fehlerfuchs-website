      satz_12_3_2: >-
        Dem Nutzer ist zuvor ein angemessener Zeitraum zum Export seiner Daten einzuräumen, damit
        der Zugriff auf aufbewahrungspflichtige Unterlagen nicht gefährdet wird.
      # Ziffer 9.5 - Wortlaut freigegeben von Matthias am 26.09.2026, 10:08 („9.5 ja" im ChefBüro-Chat),
      # Entwurf [FF_00], nicht anwaltlich geprüft (Matthias bekannt). Wort für Wort (B10/P10).
      # Anlass: Nebenbefund [FF_29] 09:46 (8.1 und 9.2 ungeklärt nebeneinander).
      ziffer_9_5: >-
