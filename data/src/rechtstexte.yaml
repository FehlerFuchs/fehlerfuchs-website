# Rechtstexte je Produkt — Datenmodell für /rechtstexte/ (EULA)
# =============================================================
#
# Grundlage: HAUSORDNUNG ANHANG A, A-11. Kern A-11.3 + Verbraucher A-11.5 stehen
# als Vorlagentext in astro/src/pages/rechtstexte.astro — hier nur die
# produktabhängigen Werte.
#
# 🔴 A-11.7: veröffentlichter Text trägt nur `Stand: TT.MM.JJJJ`. Ein Produkt geht
# erst live, wenn vollstaendig=true, ausstehend leer, stand gesetzt (Gate).
# 🔴 A-11.2: Käufergruppe endgültig Verbraucher ([14] am Digistore-Konto, 02.09.).
# 🔴 A-11.8: Verkauf über Merchant of Record (Digistore24/Google Play) → Abschnitt 14
#   ist nur ein Verweis auf dessen Widerrufsbelehrung (merchant_of_record: true).
# 🔴 Feld 15 VSBG: Hausfestlegung Matthias 02.09. — "nicht bereit und nicht verpflichtet".
#
# Feldwerte von den Projekten/ChefBüro geliefert (mit Codebeleg), 1:1 übernommen.
# Feld 11 'drittanbieter_pfad_11' trägt das VOLLE Prädikat ("... einsehbar" / "... enthalten").
# 3.3: 'erweiterung_3_3' hängt an den Gerätewechsel-Satz des Kerns an.

