            - "1.2 Die Software wird in den Editionen SnapFuchs (kostenlos) und SnapFuchs Pro bereitgestellt. Der jeweilige Funktionsumfang ergibt sich aus der Produktbeschreibung. Die kostenpflichtigen Pro-Funktionen (u. a. PDFs ohne Wasserzeichen, durchsuchbare PDFs, Tabellenexport nach Excel/CSV, digitale Unterschrift, PDF-Werkzeuge) werden durch einen einmaligen In-App-Kauf über Google Play freigeschaltet."
