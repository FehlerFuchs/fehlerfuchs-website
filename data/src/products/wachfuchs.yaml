slug: wachfuchs
name: WachFuchs
fullName: FehlerFuchs WachFuchs
kind: produkt
tagline: >-
  Lern-App für die Feuerwehr-Ausbildung: üben in kleinen Lektionen mit
  Wiederholung nach Lernstand, Prüfungsmodus und einer nachprüfbaren
  Fundstelle zu jeder Antwort.
description: >-
  WachFuchs zerlegt den Stoff der Feuerwehr-Ausbildung entlang der FwDV-2-
  Lernabschnitte in kleine, geführte Lektionen: Wiederholung nach Lernstand
  (Leitner), Prüfungsmodus mit Gewichtung nach Ausbildungsstunden, Fortschritt
  und ein Rückwärtsplaner zum Prüfungstermin. Unter jeder Antwort steht ihre
  Herkunft – Quelle, Fundstelle, Ausgabestand und Abrufdatum – und wie
  verbindlich sie ist. Inhalte stammen ausschließlich aus eigenen Formulierungen
  und amtlichen Werken. Offline nutzbar, kein Konto, keine Werbung, keine
  Datenerhebung. Kein Ersatz für Ausbildung, Dienstvorschrift oder Prüfung.
audience: [ehrenamt, vereine]
accent: "#B0201E"   # von EinsatzFuchs übernommen (fehlerfuchs_kern, Entscheidung 02.08.2026)

# Pool-Kachel (in Entwicklung) – Freigabe Matze 17.08.2026. Keine Detailseite,
