# Wird eigenständig verkauft und erscheint deshalb trotzdem in der
# Produktübersicht – auch wenn es fachlich eine Ausbaustufe ist.
standalone: true
tagline: "Die Firmen-Stufe der Foto-Meldeapp MobileReport – mit eigenem Branding, Lizenz je Arbeitsplatz und zwei Bezugswegen."
description: >-
  Fotodokumentation und Berichte für Unternehmen: Meldungen zu Geräten, Anlagen und
  Baustellen unterwegs erfassen – Beschreibung, Fotos, Ort und Zeitpunkt – und daraus ein
  sauberes PDF samt vorbereiteter E-Mail machen. Fügt sich nahtlos in größere
  Firmenumgebungen ein, in denen Meldungen ohnehin per E-Mail laufen: als Mängelmelder oder
  Störmelde-Bericht sofort einsatzbereit, mit sehr einfacher Einrichtung – kein Server,
  keine Cloud, kein Konto. Die Firmen-Stufe ergänzt eigenes Branding, Lizenz je Arbeitsplatz
  und zwei Bezugswege (Direkt-Download oder Managed Google Play).
audience: [unternehmen]
# Firmenversion → förmliche Anrede (Sie); steuert Template-Texte wie den
# Handlungswege-Titel. Consumer-Produkte ohne dieses Feld bleiben beim „du".
