# Eigener Slug laut _SLUG-EIGENTUEMER.md (aufgenommen 19.07.2026), Eigentümer
# 31_Up2Date. Die Einschreibung fragt, ob Up2Date eine eigene Seite
# bekommt oder nur auf anderen Seiten erwähnt wird – da es einen eigenen Slug
# trägt und gepflegt werden soll, bekommt es eine eigene, mit dem klaren
# Vermerk, dass erst das Grundgerüst steht.

tagline: >-
  Ein kleiner Helfer im Infobereich, der installierte FehlerFuchs-Programme
  im Blick behält und auf neue Fassungen hinweist.
description: >-
  Up2Date ist die zentrale Stelle für alle FehlerFuchs-Programme auf einem
  Windows-Rechner. Es läuft im Infobereich, erkennt installierte
  FehlerFuchs-Programme, vergleicht deren Fassung mit der Versionsliste auf
  fehlerfuchs.eu und zeigt an, wo ein Update bereitliegt – das funktioniert im
  aktuellen Entwicklungsstand bereits. Was noch fehlt, ist der eigentliche
  Update-Download samt Start des Installers. Der Abgleich braucht einen
  Netzzugriff – den Abruf einer statischen Datei, kein Konto und kein Dienst.
  Es ist kein allgemeiner Updater, sondern ausschließlich für
  FehlerFuchs-Programme gedacht.
audience: [privat, selbststaendige, unternehmen]

# Akzent für hellen Grund – Up2Dates EIGENE blaue Identität (V2, 20.07.2026),
# nicht mehr das Dachmarken-Orange. Wert aus der Produkteinschreibung
# (designierter Up2Date-Akzent „auf hellem Grund“). #2A5DA8 kommt auf Kontrast
# 6,5 gegen Weiß und rund 6 gegen den Seitengrund. Nachgerechnet, nicht geschätzt.
accent: "#2A5DA8"

# Werte 1:1 aus dem Quelltext (theme.dart / FfColors). Up2Date übernimmt den
# warmen Dark-Mode-Grund der Dachmarke, hat aber einen EIGENEN blauen Akzent
# (V2, 20.07.2026: FfColors.accentDark auf dunklem Grund). 'rand' fehlt bewusst:
# Der Kartenrand entsteht in der App aus einer teildeckenden Cremefläche.
theme:
  modus: dunkel
  hintergrund: "#1A0F08"
  flaeche: "#241612"
  text: "#FFF7ED"
  textLeise: "#C9B7A6"
  akzent: "#5981BB"
  quelle: 31_Up2Date/05_App/up2date/lib/theme.dart

# Up2Date hat eine EIGENE blaue Identität (V2, 20.07.2026): die blaue
