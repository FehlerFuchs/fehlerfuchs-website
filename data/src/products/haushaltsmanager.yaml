seoTitel: "HaushaltsManager – Zählerstände, Verträge & Haushaltsbuch für Windows"
seoBeschreibung: "Lokales Windows-Programm für den Haushalt: Zählerstände (Strom/Gas/Wasser), Verträge mit Kündigungsfristen, Haushaltsbuch, Auswertungen, PDF-Berichte – ohne Konto, ohne Tracking."
