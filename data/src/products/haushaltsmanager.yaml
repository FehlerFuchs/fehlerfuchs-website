tagline: >-
  Lokales Windows-Werkzeug für den ganzen Haushalt: Zählerstände, Verträge mit
  Kündigungsfristen, Haushaltsbuch, Auswertungen. Alle Daten bleiben auf deinem
  Gerät – kein Konto, kein Tracking.
description: >-
  HaushaltsManager bündelt die Haushaltsverwaltung auf dem eigenen Rechner:
  Zählerstände für Strom, Gas und Wasser mit Verbrauchsverlauf, Verträge samt
  Kündigungsfristen, ein vollständiges Haushaltsbuch sowie Vorhaben und
  Projekte. Auswertungen mit Diagrammen und Von-bis-Filter machen Entwicklungen
  sichtbar; Solar- und Speicherdaten lassen sich einbeziehen. Aus den Daten
  entstehen Vertrags- und Kündigungsschreiben sowie Monats- und Jahresberichte
  als PDF, dazu JSON-Export und Backup. Die Daten liegen lokal – kein Konto,
  kein Tracking, keine Werbung; optionale Außenverbindungen nur auf Wunsch.
audience: [privat, selbststaendige]
