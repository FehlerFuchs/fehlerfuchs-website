features:
  - group: Erfassen und verwalten
    items:
      - name: Zählerstände für Strom, Gas und Wasser erfassen und Verbrauch nachverfolgen
        values: { standard: ja }
      - name: Verträge verwalten inkl. Kündigungsfristen
        values: { standard: ja }
      - name: Vollständiges Haushaltsbuch (Einnahmen und Ausgaben)
        values: { standard: ja }
      - name: Vorhaben und Projekte planen
        values: { standard: ja }
      - name: Optionale anonyme Beispieldaten zum Ausprobieren
        values: { standard: ja }

  - group: Auswerten
    items:
      - name: Auswertungen mit Linien- und Balkendiagrammen und Von-bis-Filter
        values: { standard: ja }
      - name: Solar und Speicher einbeziehen (Solarertrag und Speicherdaten)
        values: { standard: ja }

  - group: Ausgeben
    items:
      - name: Vertrags- und Kündigungsschreiben als PDF erzeugen
        values: { standard: ja }
      - name: Monats- und Jahresberichte als PDF
        values: { standard: ja }
      - name: JSON-Export und Datenbank-Sicherung (Backup)
        values: { standard: ja }

  - group: Energie & Solar anbinden (optional, standardmäßig aus)
    items:
      - name: Solaranlage über ENPAL (InfluxDB) einbinden
        values: { standard: ja }
        note: Reine Verbindung im eigenen Heimnetz – die Daten verlassen das lokale Netz nicht.
      - name: Stromzähler über PowerFox/poweropti auslesen
        values: { standard: ja }
        note: Der poweropti-Lesekopf am Zähler, per PowerFox-Cloud-API 2.0 oder direkt lokal; mit den eigenen Zugangsdaten, das Passwort bleibt im Windows-Anmeldespeicher.
      - name: Wetterdaten über Open-Meteo (wetterbereinigte Auswertung)
        values: { standard: ja }
        note: Sendet nur die gewählten Koordinaten, ohne Schlüssel oder Konto.
      - name: Weitere Anbieter/Datenquellen auf Wunsch – über Updates
        values: { standard: geplant }
        note: Sag mir, welcher Anbieter (z. B. Wechselrichter, Speicher, Energieportal) und auf welche Art – ich prüfe die Anbindung und liefere sie per Update nach. PowerFox/poweropti und ENPAL sind Marken der jeweiligen Anbieter.

