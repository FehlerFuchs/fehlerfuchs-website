slug: pdfuchsreader
name: PDFuchs Reader
fullName: FehlerFuchs PDFuchs Reader
# SEO (2026-08-09)
seoTitel: "PDFuchs Reader – PDF- & E-Book-Reader (EPUB) für Android, werbefrei"
seoBeschreibung: "Kostenloser, werbefreier PDF- & E-Book-Reader für Android: PDF und EPUB lesen, Lesezeichen, Volltextsuche, teilen, drucken – ohne Konto, alles lokal auf dem Gerät."
tags: ["PDF-Reader", "E-Book-Reader", "EPUB", "PDF-Viewer", "Android", "werbefrei", "kostenlos", "ohne Konto"]
kind: produkt
tagline: Der kostenlose, werbefreie PDF- & E-Book-Reader für Android – PDFs und EPUBs lesen, mit Lesezeichen, Suche und Seitenbearbeitung.
description: >-
  PDF- und E-Book-Reader für Android, der ohne Konto und ohne Werbung auskommt: PDFs lesen,
  durchsuchen, teilen, drucken und Seiten bearbeiten – und EPUB-E-Books mit anpassbarem
  Textfluss, Schriftgröße, Lesethema und Lesezeichen. Alles passiert lokal auf dem Gerät.
  Der mobile Zwilling der PDFuchs-Familie.
audience: [privat, selbststaendige, unternehmen]
accent: "#9F1239"
status: verfuegbar

platforms:
  - os: android
    status: verfuegbar
    distribution: play-store
    storeId: eu.fehlerfuchs.pdfuchsreader
    since: "2026-07-17"
  # Windows-Teil, zugeliefert von 26_PDFuchs (Hinweis vom 19.07.2026,
  # eingearbeitet 24.07.2026). Der Sonderfall aus _SLUG-EIGENTUEMER.md: EIN
  # Slug, der Stand je Plattform getrennt. Unter Windows wird der Reader nicht
  # einzeln verteilt, sondern als PDFuchsReader.exe mit dem PDFuchs-Paket
  # installiert – deshalb 'distribution: keiner' und kein eigener Downloadweg.
  # Eine Vorabfassung (v0.1.0_dev) ist gebaut, installiert und geprüft, aber
  # nicht veröffentlicht.
  - os: windows
    status: entwicklung
    distribution: keiner
    requirements: Windows 10/11 (64-bit)

privacy: [inhalte-lokal, keine-cloud, kein-konto, kein-tracking, werbefrei, offline-faehig]

editions:
  - id: standard
    name: PDFuchs Reader
    public: true
    summary: Voller Funktionsumfang, dauerhaft kostenlos und werbefrei.
    price: { model: kostenlos }

releases: []

# Funktionsübersicht. Übernommen aus den Abschnitten „Funktionen" und
# „Was (noch) nicht dabei ist" auf apps/pdfuchsreader.html.
#
# Die letzte Gruppe ist Absicht: Was eine App bewusst NICHT tut, gehört auf die
# Seite. Wer OCR sucht, soll das hier erfahren und nicht erst nach dem Herunterladen.
features:
  - group: Lesen
    items:
      - name: PDFs flüssig anzeigen, scrollen und zoomen
        values: { standard: ja }
        note: Auf Grundlage der bewährten Render-Engine PDFium.
      - name: Dunkelmodus
        values: { standard: ja }
      - name: Volltextsuche mit hervorgehobenen Treffern
        values: { standard: ja }
      - name: Miniaturübersicht und schneller Seitensprung
        values: { standard: ja }
      - name: Lesezeichen im PDF setzen und die Stelle wiederfinden
        values: { standard: ja }

  - group: E-Books (EPUB)
    items:
      - name: EPUB-Dateien öffnen – der Text fließt in die Bildschirmbreite
        values: { standard: ja }
        note: Reflow – der Text bricht passend zur Breite um, kein starres Seitenbild.
      - name: Schriftgröße und Lesethema (hell, sepia, dunkel) frei wählbar
        values: { standard: ja }
      - name: Inhaltsverzeichnis führt direkt zum Kapitel
        values: { standard: ja }
      - name: Lesezeichen merken sich die Stelle – je Buch
        values: { standard: ja }

  - group: Weitergeben
    items:
      - name: Dokument teilen
        values: { standard: ja }
      - name: Über den Android-Druckdialog ausdrucken
        values: { standard: ja }
      - name: PDFs aus anderen Apps direkt öffnen („Öffnen mit")
        values: { standard: ja }
      - name: Verlauf zuletzt geöffneter Dokumente
        values: { standard: ja }

  - group: Bearbeiten
    items:
      - name: Seiten drehen, löschen und neu ordnen
        values: { standard: ja }
      - name: Als Kopie speichern – das Original bleibt unverändert
        values: { standard: ja }
        note: Verlustfrei; die Ausgangsdatei wird nie überschrieben.

  - group: Bewusst nicht dabei
    items:
      - name: Texterkennung (OCR) aus Bildern
        values: { standard: nein }
        note: Weggelassen, damit der Reader schnell und schlank bleibt.
      - name: Formularfelder ausfüllen und unterschreiben
        values: { standard: geplant }
      - name: Voller PDF-Funktionsumfang
        values: { standard: nein }
        note: Bleibt der PDFuchs-Suite für Windows vorbehalten.
      - name: Werbung, Konto oder Tracking
        values: { standard: nein }

