slug: coppicemail
name: CoppiceMail
fullName: FehlerFuchs CoppiceMail
kind: produkt
tagline: Das lokale, datensparsame E-Mail-Programm für Belege und Büropost – der Weg Mail, Anhang, Beleg, Archiv so kurz wie möglich.
description: >-
  E-Mail-Programm mit Belegfokus: Nachricht öffnen, Anhang erkennen, als Beleg ablegen,
  archivieren – ohne Umwege. CoppiceMail wurde als reine
  Flutter/Dart-App neu aufgebaut; Version 1.0.1 ist funktional fertig und
  durchläuft vor der Freigabe die Sicherheits- und Stabilitätshärtung.
audience: [selbststaendige, unternehmen]
accent: "#0F5132"
status: entwicklung
# Sichtbarkeits-Ausnahme (Matthias, 01.08.2026): 1.0.1 ist nahezu fertig →
# Seite bleibt sichtbar wie OrgaFuchs (kein öffentlicher Download bis zur
# Freigabe) → nicht in den Ideen-/Pool.
vorabSichtbar: true

platforms:
  - os: windows
    status: entwicklung
    distribution: keiner
    hinweis:
      wenn: entwicklung
      text: >-
        1.0.1 als technischer Release-Kandidat gebaut; Sicherheits- und
        Stabilitätshärtung läuft. Noch kein öffentlicher Download.

# An den realen 1.0-Datenfluss angepasst (05.08.2026, Datenschutz-Steckbrief v2:
# lokal_only:false – ein E-Mail-Programm spricht mit den IMAP/SMTP-Servern des
# Nutzers). 'nur-lokal' und 'keine-cloud' gestrichen; es bleiben die belegten
# Zusagen aus dem Steckbrief (kein Konto bei FehlerFuchs, kein Tracking, werbefrei).
privacy: [kein-konto, kein-tracking, werbefrei]

editions: []
releases: []

# Bild-Wortmarke. Ist sie gesetzt, ist SIE der sichtbare Titel und die
# Überschrift steht nur für Screenreader da – sonst stünde der Name doppelt.
media:
  lockup:
    src: /img/lockups/coppicemail.svg
    alt: CoppiceMail – von FehlerFuchs
    width: 1649
    height: 360
  # Noch keine Bildschirmfotos. Statt einer leeren Stelle setzt die Seite
  # Platzhalter aus dem Motivsatz ein und sagt offen, dass es welche sind.
  # Sobald echte Bilder da sind, ersetzt "screenshots:" diese Zeile.
  platzhalter: 4
# Warum es gerade so steht – in eigenen Worten.
#
# Der Satz hängt unter 'wenn' am Status. Ändert sich der Status, passt er nicht
# mehr, wird nicht angezeigt und die Prüfung meldet ihn – so kann aus einer
# warmen Erklärung keine veraltete Ausrede werden. Bis zum 24.07.2026 stand
# CoppiceMail auf „pausiert" mit einem „aufgeschoben ist nicht aufgehoben".
# Jetzt wird wieder gebaut, deshalb der neue Text und der neue Status.
statusGrund:
  wenn: entwicklung
  text: >-
    Fertig gebaut, aber bewusst noch nicht öffentlich: CoppiceMail wurde von
    Grund auf neu als reine Flutter/Dart-App aufgebaut, Version 1.0.1 ist
    funktional fertig. Jetzt läuft die Sicherheits-, Datenschutz- und
    Doku-Härtung vor der Freigabe – lieber sorgfältig als schnell.

# Farben der Produktseite, 1:1 aus dem Quelltext der App übernommen.
# Was dort nicht steht, steht auch hier nicht – dann greift der Standard.
# Alle Kontraste rechnet das Prüfskript, sie sind nicht geschätzt.
theme:
  modus: hell
  hintergrund: "#FBF7F2"  # bg
  flaeche: "#FFFFFF"      # surface
  rand: "#E7DACC"         # line
  text: "#1A140F"         # ink
  textLeise: "#6B5B50"    # muted
  akzent: "#0F5132"       # primary – Tanne
  quelle: FehlerFuchs_CoppiceMail/app/ui/theme.py

links:
  # Die ALTE Adresse dieses Produkts, von vor dem 20.07.2026. Sie steht hier
  # aus genau einem Grund: Aus ihr entsteht die Weiterleitung, damit fremde
  # Links und Lesezeichen nicht ins Leere laufen
  # (astro/tools/weiterleitungen.mjs).
  #
  # Sie ist NICHT die Adresse der Produktseite. Die heisst /produkte/<slug>/
  # und leitet sich aus dem Slug ab - deshalb hiess das Feld frueher 'page'
  # und wurde am 21.07.2026 umbenannt: Der alte Name legte nahe, hier stehe,
  # wo das Produkt heute zu finden ist. Eine Pruefung schloss daraus, SnapFuchs
  # habe keine eigene Seite, obwohl es sie seit einem Tag hatte.
  #
  # Fehlt das Feld, gab es vorher keine eigene Seite - dann ist auch nichts
  # weiterzuleiten.
  alt_html: /apps/coppicemail.html
  contact: /kontakt.html?app=CoppiceMail&topic=interesse

notes: >-
  1.0.1 als Release-Kandidat gebaut, in Härtung; noch kein öffentlicher Download.
  Regel (CoppiceMail 28.07.2026): Status, Download und Datenschutz nur GEMEINSAM in
  einem Release-Schritt freischalten. OFFEN für WEB vor dem Release: Datenschutz-
  Steckbrief v2 (realer 1.0-Datenfluss, lokal_only:false) über den Einreichordner
  nachziehen und die privacy-Merkmale (aktuell noch inkl. 'nur-lokal') entsprechend
  korrigieren. Bis dahin bewusst unverändert.
