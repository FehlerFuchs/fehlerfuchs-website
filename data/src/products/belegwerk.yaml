# obwohl noch nicht 'verfuegbar'. Kein öffentlicher Download bis zur Freigabe.
vorabSichtbar: true

platforms:
  - os: windows
    status: entwicklung
    requirements: Windows 10/11, 64-Bit
    since: "2026-07-27"
    distribution: keiner
    hinweis:
      wenn: entwicklung
      text: >-
        Release Candidate, noch kein öffentlicher Download; digitale Signierung
        und freigegebener Alltagstest stehen vor der Finalversion aus.

