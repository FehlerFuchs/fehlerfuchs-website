slug: belegwerk
name: BelegWerk
fullName: FehlerFuchs BelegWerk
# SEO (2026-08-09)
seoTitel: "BelegWerk – lokale Belegverwaltung für Windows (mit Paperless-ngx)"
seoBeschreibung: "Belege und PDFs lokal verwalten: Eingangskorb, visuelle Prüfung, ASN und Ablage zwischen Scanner, Paperless-ngx und Dateiablage – auf dem eigenen Windows-PC, ohne Cloud."
tags: ["Belegverwaltung", "Dokumentenverwaltung", "Paperless-ngx", "Scanner", "Windows", "ohne Cloud"]
kind: produkt
tagline: >-
  Belege lokal prüfen, aufbereiten und kontrolliert an Paperless und die
  eigene Dateiablage übergeben.
description: >-
  BelegWerk ist eine lokal-first Windows-Anwendung zwischen Scanner,
  Paperless-ngx und der eigenen Dateiablage. Neue PDFs erscheinen in einem
  kompakten Eingangskorb, können visuell geprüft, mit ASN versehen und mit
  Paperless-Metadaten ergänzt werden. Paperless-Übernahme und zusätzliche
  Dateiablage sind getrennte, nachvollziehbare Ziele mit eigenem Status und
  eigener Wiederholung. Etiketten, mehrere frei konfigurierbare PDF-Stempel
  und der Dokumentdruck sind direkt integriert; Originale bleiben unverändert.
audience: [privat, selbststaendige, unternehmen]
accent: "#C2410C"   # Farbe der App
# Kein Bild-Lockup vorhanden – der Titel steht als Text und trägt
# die Markenfarben, damit er trotzdem nach FehlerFuchs aussieht.
wordmark:
  - { text: "FehlerFuchs ", color: "#7C3F16", weight: normal }
  - { text: "Beleg", color: "#7C3F16", weight: bold }
  - { text: "Werk", color: "#B45309", weight: bold }

