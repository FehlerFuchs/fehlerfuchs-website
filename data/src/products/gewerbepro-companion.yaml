# Ausbaustufe von GewerbePro (Windows). Die Companion-App ist die mobile
# Ergänzung – eigene Plattform, eigene Merkmale, deshalb ein eigener Slug mit
# 'parent'. Eigentümer laut _SLUG-EIGENTUEMER.md: 29-1_GewerbePro Companion.
parent: gewerbepro

tagline: >-
  Mobiler Erfassungs-Begleiter zu GewerbePro: Kunden, Auftrags-Entwürfe,
  Fahrten und Quittungen unterwegs aufnehmen – offline und ohne Konto.
# Fakten 26.09.2026 gemessen von [FF_29] (G1–G7) und [FF_29-1] (C1–C4), Befund 5/11 Webseiten-Sichtung.
description: >-
  Die Companion-App ist die Android-Ergänzung zu GewerbePro. Sie erfasst unterwegs
  Kunden, Auftrags-Entwürfe mit Positionen, Fahrten, Aufgaben, Termine und Quittungen
  und arbeitet nach der einmaligen Aktivierung offline. Gerechnet wird nichts auf dem Handy: Die App
  sammelt Rohdaten und übergibt sie verschlüsselt an GewerbePro auf dem PC –
  automatisch über das USB-Kabel oder als Datei –, und GewerbePro macht daraus
  Angebote, Aufträge und Belege. Für Quittungen vor Ort übernimmt sie das
  Firmen-Branding aus GewerbePro und erzeugt einen unterschriebenen Beleg als PDF.
audience: [selbststaendige, unternehmen]

