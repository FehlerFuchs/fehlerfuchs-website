slug: mobilereport
name: MobileReport
fullName: FehlerFuchs MobileReport
# SEO (2026-08-09): deutsche Begriffe (Namenskollision "MobileReport ApS");
# Guardrail – kein absolutes "kein Google/kein Tracking" (Play Billing).
seoTitel: "MobileReport – Fotodokumentation & Berichte als PDF, lokal"
seoBeschreibung: "Meldungen und Fotos zu Geräten und Anlagen unterwegs erfassen und als sauberes PDF per Mail versenden – lokal auf dem Gerät, ohne Cloud, ohne Konto."
tags: ["Fotodokumentation", "Berichte", "PDF", "Mängel", "Melde-App", "Android", "lokal"]
kind: produkt
tagline: Das kleine, lokale Melde-Logbuch für Geräte – schnell erfasst, sauber als PDF, direkt per Mail vorbereitet.
description: >-
  Meldungen zu Geräten und Anlagen unterwegs erfassen: Beschreibung, Fotos, Ort und
  Zeitpunkt, daraus ein sauberes PDF und eine vorbereitete E-Mail. Alles bleibt auf dem
  Gerät – kein Konto, keine Cloud, keine Werbung.
audience: [selbststaendige, unternehmen, vereine]
accent: "#C2410C"   # Farbe der App
status: verfuegbar

platforms:
  - os: android
    status: verfuegbar
    # Veröffentlicht im Play Store am 09.07.2026 (Meldung mobilereport-free-play);
    # nachgetragen nach Sichtung 29.09., Befund 4 (ENTSCHEIDUNG A, #3787).
    since: "2026-07-09"
    distribution: play-store
    storeId: eu.fehlerfuchs.mobilereport
    # Präzisierung nach MobileReport-Prüfbericht F-001 (30.07.2026): Seit dem
    # In-App-Kauf meldet sich Googles Play-Billing-Bibliothek beim App-Start
    # selbst (Telemetrie an Google). FehlerFuchs selbst trackt nicht – deshalb
    # das flache Merkmal 'kein-tracking' entfernt und hier der ehrliche Satz.
    hinweis:
      wenn: verfuegbar
      text: >-
        FehlerFuchs trackt nicht; über Google Play Billing entsteht Google-Telemetrie.

# 'nur-lokal' am 21.07.2026 gestrichen, ersetzt durch 'inhalte-lokal'.
#
# 'nur-lokal' ist die staerkste Zusage im Vokabular: sendet gar nichts ohne
# Zutun. Seit dem Einbau des In-App-Kaufs stimmt sie nicht mehr — Googles
# Abrechnungsbibliothek meldet sich beim App-Start selbst. Das MobileReport-
# Projekt hat es am gebauten Release nachgewiesen und 'lokal_only' im
# Steckbrief bereits auf false gesetzt.
#
# 'inhalte-lokal' bleibt richtig und ist die Aussage, auf die es ankommt:
# Meldungen, Fotos und PDFs verlassen das Geraet nur, wenn der Nutzer es
# ausloest.
#
# 'kein-tracking' am 30.07.2026 gestrichen (Pruefbericht F-001): Als flaches
# Merkmal ist es nicht mehr haltbar, seit Googles Play-Billing-Bibliothek beim
# App-Start Telemetrie an Google sendet. FehlerFuchs trackt weiterhin nicht –
# das steht jetzt praezise als Plattform-Hinweis (android) statt als Haekchen.
privacy: [inhalte-lokal, keine-cloud, kein-konto, werbefrei, offline-faehig]

editions:
  - id: free
    name: MobileReport Free
    public: true
    summary: Grundfunktionen zum Erfassen und Ausgeben als PDF.
    price: { model: kostenlos }
  - id: pro
    name: MobileReport Pro
    public: true
    emphasis: true
    summary: >-
      Voller Funktionsumfang, freigeschaltet per einmaligem In-App-Kauf.
      Pro gab es anfangs als eigene App; sie ist im Einzelkauf innerhalb von
      MobileReport aufgegangen und wird nicht mehr getrennt weitergebaut.
    price: { model: iap, amount: 5.00, currency: EUR, vatIncluded: true, recurring: false }

# Merkmalsmatrix. Übernommen aus der Vergleichstabelle auf apps/mobilereport.html –
# also aus dem, was heute schon veröffentlicht ist, nicht neu erdacht.
#
# Die dritte Spalte ist kein Tippfehler: 'mobilereport-enterprise' ist ein eigenes
# Produkt (parent + standalone), aus Käufersicht aber schlicht die dritte Stufe
# derselben App. Ihn für den Vergleich auf eine andere Seite zu schicken, hieße den
# Vergleich zu zerreißen, den er gerade anstellt. Die Prüfung lässt Spalten von
# eigenständigen Ausbaustufen deshalb ausdrücklich zu.
features:
  - group: Grundlage
    items:
      - name: Erfassen, Fotos, PDF, E-Mail-Entwurf und Logbuch
        values: { free: ja, pro: ja, mobilereport-enterprise: ja }
      - name: Vollständig lokal und werbefrei
        values: { free: ja, pro: ja, mobilereport-enterprise: ja }
      # 1.5.0 (26.09.2026), Wortlaut aus der Produkteinschreibung von [FF_20] (stand 26.09.).
      - name: Passende Empfänger vorgeschlagen – nach Gebäude, sonst nach Bereich, jeweils passend zur Kategorie
        values: { free: ja, pro: ja, mobilereport-enterprise: ja }
        note: Seit 1.5.0. Wofür ein Empfänger zuständig ist, wird bei ihm festgelegt.

  - group: Vorgaben für das Team
    items:
      - name: Feste Bereiche, Kategorien und Pflichtfelder
        values: { free: nein, pro: ja, mobilereport-enterprise: ja }
      - name: Admin-Bereich mit Master-Passwort (geschütztes Berichtsformat)
        values: { free: nein, pro: ja, mobilereport-enterprise: ja }
        note: Seit 1.5.0 lässt sich dort auch die vorgeschlagene Empfänger-Auswahl sperren.
      # Berichtigt 26.09.2026: Seit 1.4.0 lassen sich auch Orte aus Excel/CSV einlesen
      # (die alte Notiz „nicht per CSV" war seitdem falsch), seit 1.5.0 mit Zuständigkeit.
      - name: Orte und Empfänger aus Excel oder CSV einlesen, Empfänger mit Zuständigkeit (Spalten „Kategorie“ und „Gebäude“)
        values: { free: nein, pro: ja, mobilereport-enterprise: ja }
        note: Zuständigkeits-Spalten seit 1.5.0.

  - group: Logbuch
    items:
      - name: Filter und Suche im Logbuch
        values: { free: teilweise, pro: ja, mobilereport-enterprise: ja }
        note: Kostenlos gibt es die Grundsuche; die erweiterten Filter sind ab Pro dabei.
      - name: Eigene Zählweise und Muster für Dateinamen
        values: { free: teilweise, pro: ja, mobilereport-enterprise: ja }
        note: Kostenlos gilt die feste Standardzählung.

  - group: Erscheinungsbild
    items:
      - name: Branding und Farbschema
        values:
          free: nein
          pro: "Firmenlogo · 15 Vorlagen"
          mobilereport-enterprise: "frei wählbar: Logo, Farben, Name"
      - name: App unter eigenem Namen und Symbol
        values: { free: nein, pro: nein, mobilereport-enterprise: "nur Custom-App" }

  - group: Verteilung und Freischaltung
    items:
      - name: Bezugsweg
        values:
          free: "Google Play · kostenlos"
          pro: "In-App-Kauf in der App"
          mobilereport-enterprise: "Direkt-Download oder Managed Google Play"
      - name: Freischaltung
        values:
          free: nein
          pro: "einmaliger Kauf, geräteübergreifend"
          mobilereport-enterprise: "Lizenzschlüssel je Arbeitsplatz"
      - name: Anbindung an eigene Systeme
        values: { free: nein, pro: nein, mobilereport-enterprise: "nur Custom-App" }

# Play-Store-Apps haben bei uns keine Release-Einträge: Version, Datum und Größe
# verwaltet der Store. Eine zweite Angabe hier wäre sofort veraltet.
releases: []

# Bild-Wortmarke. Ist sie gesetzt, ist SIE der sichtbare Titel und die
# Überschrift steht nur für Screenreader da – sonst stünde der Name doppelt.
media:
  lockup:
    src: /img/lockups/mobilereport.svg
    alt: MobileReport – von FehlerFuchs
    width: 1739
    height: 365
  # App-Bildschirme von MobileReport 1.5.1 (55), Free. Lieferung [FF_01] vom 13.11.2026
  # (Freigabe Matthias „A: Alle 12 freigeben“, LogBuch #9794; Bestellung #9784), 620 Pixel
  # breit, Status- und Navigationsleiste abgeschnitten, sonst unverändert (SHA-256 gegen
  # _SHA256.txt der Marke gemessen). Es sind nackte Bildschirmabzüge ohne Überschrift; die
  # Alternativtexte beschreiben, was auf dem Bildschirm zu sehen ist. Es gibt keine Pro-Motive:
  # [FF_20] hat 1.5.1 nur als Free aufgenommen. Bisherige Bilder 1.4.0 (Orte anlegen, Admin-Bereich)
  # entfallen; ersetzte Dateien liegen in 00_Steuerung\90_Archiv\Ersetzte_Webbilder_2026-11-13.
  screenshots:
    - src: /img/screenshots/mobilereport/handy-01-start.png
      alt: "Startbildschirm von MobileReport Free mit „Neue Meldung“, „Logbuch“, Einstellungen, Hinweise und Datenschutz, Support und Kontakt, Impressum und Nutzungsbedingungen."
      width: 620
      height: 1133
      geraet: handy
      titel: "Startseite mit Neue Meldung und Logbuch"
    - src: /img/screenshots/mobilereport/handy-02-neue-meldung.png
      alt: "Formular „Neue Meldung“: Bereich „Werkstatt“ gewählt, darunter die Raumliste mit zwei Orten, unten der Knopf „PDF erstellen“."
      width: 620
      height: 1133
      geraet: handy
      titel: "Neue Meldung: erst den Bereich, dann den Raum"
    - src: /img/screenshots/mobilereport/handy-03-pdf-bericht.png
      alt: "PDF-Vorschau einer Meldung mit Kopfzeile, Angaben zu Ort und Person, Meldeart „Beschädigung“ und Beschreibung, unten der Knopf „E-Mail vorbereiten“."
      width: 620
      height: 1133
      geraet: handy
      titel: "PDF-Bericht mit Vorschau"
    - src: /img/screenshots/mobilereport/handy-04-logbuch.png
      alt: "Logbuch mit fünf auf dem Gerät erstellten Meldungen und einem Suchfeld; zwei Einträge tragen einen grünen Haken für „Als versendet markiert“."
      width: 620
      height: 1133
      geraet: handy
      titel: "Logbuch der Meldungen auf dem Gerät"
    - src: /img/screenshots/mobilereport/handy-05-meldung-detail.png
      alt: "Eine gespeicherte Meldung im Detail mit Betreff, Datum, Ort, meldender Person, Beschreibung und einem Foto, unten der Knopf „PDF & E-Mail öffnen“."
      width: 620
      height: 1133
      geraet: handy
      titel: "Eine gespeicherte Meldung mit Foto"
# Farben der Produktseite, 1:1 aus dem Quelltext der App übernommen.
# Was dort nicht steht, steht auch hier nicht – dann greift der Standard.
# Alle Kontraste rechnet das Prüfskript, sie sind nicht geschätzt.
theme:
  modus: hell
  hintergrund: "#FFF7ED"  # cream
  flaeche: "#FFFFFF"      # white
  text: "#2B160B"         # darkBrown
  akzent: "#C2410C"       # action
  quelle: 20_MobileReport/FehlerFuchsMR/lib/core/constants/app_colors.dart

links:
  # Die ALTE Adresse dieses Produkts, von vor dem 20.07.2026. Sie steht hier
  # aus genau einem Grund: Aus ihr entsteht die Weiterleitung, damit fremde
  # Links und Lesezeichen nicht ins Leere laufen
  # (astro/tools/weiterleitungen.mjs).
  #
  # Sie ist NICHT die Adresse der Produktseite. Die heisst /produkte/<slug>/
  # und leitet sich aus dem Slug ab - deshalb hiess das Feld frueher 'page'
  # und wurde am 21.07.2026 umbenannt: Der alte Name legte nahe, hier stehe,
  # wo das Produkt heute zu finden ist. Eine Pruefung schloss daraus, SnapFuchs
  # habe keine eigene Seite, obwohl es sie seit einem Tag hatte.
  #
  # Fehlt das Feld, gab es vorher keine eigene Seite - dann ist auch nichts
  # weiterzuleiten.
  alt_html: /apps/mobilereport.html
  contact: /kontakt.html?app=MobileReport&topic=interesse
