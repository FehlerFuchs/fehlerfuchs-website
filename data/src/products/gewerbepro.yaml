faq:
  - question: Was kostet das Programm?
    answer: >-
      Die Basisversion FehlerFuchs Gewerbe ist kostenlos. GewerbePro kostet zum
      Einführungspreis 89,00 € statt regulär 129,00 € – einmalig, kein Abo und keine
      Folgekosten. Eine Lizenz gilt für das Windows-Programm und die Companion-App
      zusammen und deckt 3 Arbeitsplätze ab (zum Beispiel zwei PCs und ein Handy). Der
      Kauf läuft über die sichere Kasse Digistore24, mit 30 Tagen Rückgaberecht.
      Gegenüber Abo-Programmen, die oft 100 bis 360 € im Jahr kosten, zahlst du einmal –
      und die Ausgabe ist als Betriebsausgabe absetzbar.
  - question: Was ist die „Vather"-Version?
    answer: >-
      Die interne Entwicklerversion: alle Funktionen freigeschaltet und voll editierbar.
      Sie dient Entwicklung und Test und wird nicht öffentlich verteilt. Öffentlich
      erscheinen nur Gewerbe und GewerbePro.
  - question: Wo liegen meine Daten?
    answer: >-
      Im Programmordner auf deinem PC – Datenbank, Sicherungen und PDFs. Nichts wird in
      eine Cloud übertragen.
  - question: Ersetzt es die Steuerberatung?
    answer: >-
      Nein. Es unterstützt, strukturiert und dokumentiert. Steuerliche, rechtliche oder
      fachliche Entscheidungen bleiben bei dir beziehungsweise deiner Beratung.
  - question: Wie funktioniert die E-Rechnung?
    answer: >-
      E-Rechnung ist in GewerbePro enthalten: Aus den Rechnungsdaten erzeugst du
      ZUGFeRD oder XRechnung nach EN 16931, prüfst sie mit dem KoSIT-Validator, versendest
      sie und legst sie beim Auftrag ab. Eingehende E-Rechnungen werden erkannt und
      geprüft. Auf Rechnung und Mahnung lässt sich ein GiroCode drucken.
  - question: Warum ein modularer Installer?
    answer: >-
      Nicht jeder braucht OCR, E-Rechnungsvalidatoren, Paperless oder erweiterte
      PDF-Werkzeuge. Das Ziel ist ein Installer, der Grundgerüst und Erweiterungen trennt:
      alles verfügbar, aber nur das installiert, was du wirklich nutzen willst.
  - question: Synchronisiert der Kalender direkt mit Outlook oder Google?
    answer: >-
      Der stabile Weg ist derzeit der lokale ICS-Export. Das funktioniert mit Outlook,
      Apple Kalender, Google Kalender und vielen anderen – ohne Cloud-Zwang und ohne
      Kontoanmeldung bei FehlerFuchs.
  - question: Ist das noch Beta – und was wird aus meiner Test-Lizenz?
    answer: >-
      Nein. Mit Version 1.0.0 ist GewerbePro aus der offenen Beta heraus und regulär
      veröffentlicht. Die kostenlose Gewerbe-Edition läuft sofort. Wer in der Beta bereits
      eine (Test-)Lizenz erhalten hat, behält sie – diese Lizenzen bleiben gültig. Neue
      Beta-Test-Lizenzen werden nicht mehr ausgegeben; die Pro-Funktionen schaltest du
      künftig mit einer gekauften Lizenz frei.
  - question: Gibt es das auch für Android?
    answer: >-
      Ja, als Companion-App „GewerbePro Mobil". Sie gehört zur Pro-Edition und wird nicht
      separat verkauft: Freischaltung mit demselben Lizenzschlüssel, wobei die App einen
      der drei Arbeitsplätze belegt. Der Datenabgleich mit dem PC läuft per USB. Vor Ort
      nutzbar sind Auftragsentwürfe, Kunden, Katalog, Kalender, Aufgaben und Quittungsblock.
  - question: Wie bekomme ich GewerbePro Mobil auf mein Handy?
    answer: >-
      Über Google Play – der Download dort ist kostenlos. Freigeschaltet wird die App mit
      deinem GewerbePro-Lizenzschlüssel; sie belegt dann einen der drei Arbeitsplätze
      deiner Lizenz. Ohne Lizenzcode startet die App nicht – es ist also keine gratis
      Zusatz-App, sondern der mobile Arm deiner Vollversion.
  - question: Welche Systemvoraussetzungen hat GewerbePro?
    answer: >-
      Windows 10 oder 11 (64-bit). Die Installation läuft im Benutzerprofil und braucht
      keine Administratorrechte. Zusätzliche Software ist nicht nötig: Die erforderliche
      Visual-C++-Runtime ist im Installer enthalten (auf frischem Windows getestet). Für
      den Betrieb ist kein Internet nötig – Updates prüft das Programm nur, wenn du es
      möchtest. Der Installer ist rund 120 MB groß; deine Daten liegen lokal im Programm-
      beziehungsweise Nutzerordner. Das Programm ist digital signiert (Herausgeber
      FehlerFuchs); bei einem neuen Download kann Windows SmartScreen anfangs trotzdem
      warnen, bis sich die Bekanntheit aufgebaut hat.

