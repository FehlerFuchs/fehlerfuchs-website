  Kunden, Angebote, Aufträge, Rechnungen, E-Rechnung nach EN 16931 (ZUGFeRD/XRechnung),
  Mahnwesen, Belege und Dokumenteneingang, EÜR-Vorbereitung, Kalender und
  Companion-App. Komplett lokal auf dem eigenen Rechner – ohne Cloud-Zwang, ohne Konto,
  ohne Telemetrie.
