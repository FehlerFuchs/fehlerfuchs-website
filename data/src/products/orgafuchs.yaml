# SEO (2026-08-09): Windows 1.4.3 + Android seit 08.08. verfügbar.
seoTitel: "OrgaFuchs – Familien- & Schichtplaner, offline für Windows & Android"
seoBeschreibung: "Familien- und Schichtplaner für Dienste, Termine und Notizen: Monatskalender, PDF-Export, Sync übers eigene Heimnetz – für Windows & Android, ohne Cloud, ohne Konto."
tags: ["Schichtplaner", "Familienplaner", "Dienstplan", "Kalender", "Windows", "Android", "offline", "ohne Cloud"]
kind: produkt
tagline: Der lokale Familien- und Team-Planer für Schicht- und Dienstpläne – offline, mit eigenem Sync ohne Cloud.
description: >-
  Plant Dienste, Schichten, Termine und Notizen für die ganze Familie oder ein kleines
  Team: Monatskalender, Schnelleintrag, PDF-Export als Monat, Jahr oder Blanko-Vorlage.
  Alle Daten bleiben auf den eigenen Geräten; die Synchronisation läuft über das eigene
  Heimnetz oder einen selbst gehosteten Relay – ohne Google, ohne Cloud, ohne Konto.
audience: [privat, vereine, unternehmen]
accent: "#B4652A"   # Farbe der App
# Android ist seit 08.08.2026 regulär im Google Play Store, der Windows-Download
# seit 08.08.2026 als GitHub-Release 'orgafuchs-v1.4.3' (löst die frühere 1.0.0
# ab). Beide Plattformen 'verfuegbar' → Gesamtstatus 'verfuegbar'.
# 'vorabSichtbar' ist mit 'verfuegbar' überflüssig und daher entfernt.
status: verfuegbar

platforms:
    # Kein 'since' hier: Das Windows-Datum liefert der releases-Eintrag (date
    # 2026-08-08). Zusätzlich würde 'since' die Datumsableitung der Store-Meldung
    # brechen – die verlangt genau EINE Plattform mit 'since' (das ist android).
  - os: windows
    status: verfuegbar
    requirements: Windows 10/11 (64-bit)
    distribution: github-release
  - os: android
    # Zweimal von der Play-Prüfsoftware abgelehnt (18.07. + 24.07., siehe umwege),
    # dann durch: seit 08.08.2026 regulär im Google Play Store. 'since' ist das
    # Veröffentlichungsdatum und steuert Datum bzw. Meldung in der Zeitleiste.
    status: verfuegbar
    since: "2026-08-08"
    distribution: play-store
    storeId: eu.fehlerfuchs.orgafuchs

# Zwei Umwege, die keine sind: Es ging nie etwas zurück in die Entwicklung. Die
# App liegt weiter beim Store, das Programm blieb unverändert. 'von' und 'nach'
# sind deshalb bei beiden derselbe Schritt – zwei Schleifen. Sie kosten nur
# Zeit, und genau das soll man sehen: Der Weg wird zweimal ein zweites Mal
# gegangen, ohne dass sich am Programm etwas geändert hätte.
#
# Beide Male dieselbe Ursache und dieselbe Lehre: Eine Prüfmaschine deutet eine
# harmlose Funktion als etwas, das sie nicht ist – erst den Gruppen-Sync als
# Bezahlschranke, dann die Ferien-Anzeige als Behördenauskunft. Repariert wurde
# jeweils nicht die App, sondern das Missverständnis: einmal gab es nichts zu
# ändern, einmal reichte eine geschärfte Beschreibung.
umwege:
  - datum: "2026-07-18"
    os: android
    von: pruefung
    nach: pruefung
    grund: Automatisch abgelehnt, kein Mensch beteiligt
    text: >-
      Die Prüfsoftware hat die Einstellungsseite für den Gruppen-Sync als
      Bezahlschranke oder nicht deklarierten Login gewertet. Beides ist sie
      nicht: Dort trägt man eine Relay-Adresse und ein selbst gewähltes
      Gruppen-Passwort ein, um die eigenen Geräte zu verbinden. Kein Konto,
      keine Anmeldung, keine Zahlung. Am Programm wurde nichts geändert – es
      gab nichts zu ändern. Ärgerlich ist nicht die Prüfung, sondern dass eine
      unsichere Maschine durchentscheidet, statt einen Menschen hinzuzuziehen.
      Ein Blick hätte gereicht; so kostet es sieben bis vierzehn Tage.

  - datum: "2026-07-24"
    os: android
    von: pruefung
    nach: pruefung
    grund: Zweite Ablehnung – diesmal wegen der Ferien-Anzeige
    text: >-
      Die zweite Runde, ein anderer Vorwurf: „Missleading Claims". Weil die App
      Feiertage und Schulferien je Bundesland anzeigt, hat die Prüfung
      geschlossen, hier gebe jemand behördliche Auskünfte – eine Behörden-App
      ohne Quellenangabe. Tatsächlich sind es Kalenderdaten für die
      Familienplanung, wie sie jede Kalender-App führt. Ich habe die
      Store-Beschreibung geschärft: eine Quelle für die Daten genannt und
      klargestellt, dass OrgaFuchs keine Behörde ist und keine vertritt. Am
      24. Juli erneut eingereicht, am Programm wieder nichts geändert.

privacy: [inhalte-lokal, keine-cloud, kein-konto, kein-tracking, werbefrei, kein-google, eigener-sync, offline-faehig]

