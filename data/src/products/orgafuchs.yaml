# Sichtbarer Quellen- und Behörden-Hinweis (Pflicht). Weil OrgaFuchs Feiertage
# und Schulferien je Bundesland anzeigt, hat Google den ersten Store-Eintrag am
# 20.07.2026 wegen fehlender Quelle als „Misleading Claims" zurückgewiesen.
# Seither müssen Quelle und Disclaimer – wie im Store – auch auf der
# Produktseite sichtbar stehen. Wortlaut aus RELEASE-TEXTE_OrgaFuchs.md, gleich
# gehalten mit dem Play-Pendant STORE_TEXTE.md.
quellen:
  titel: Quellen und Behörden-Hinweis
  eintraege:
    - name: "Ferientermine: Ferienregelung der Kultusministerkonferenz (KMK)"
      url: https://www.kmk.org/service/ferien.html
    - name: "Offene Daten: OpenHolidays"
      url: https://www.openholidaysapi.org
  hinweis: >-
    OrgaFuchs ist eine private App von FehlerFuchs und steht in keiner Verbindung
    zu einer Behörde, einem Ministerium oder einer staatlichen Stelle. Die App
    repräsentiert keine Regierungseinrichtung und bietet keine amtlichen Dienste an.

notes: >-
  Offen: Play-Store-Freigabe für Android. Ebenfalls offen ist der von der App erwartete
  Endpunkt data/schulferien/DE-XX.json auf fehlerfuchs.eu – bis dahin greift der
  eingebaute Datenbestand.
