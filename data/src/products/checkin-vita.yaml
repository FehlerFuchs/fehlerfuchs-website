notes: >-
  Der Name wird zusammengeschrieben: CheckInVita. Die Wortmarke setzt „CheckIn“
  in Kupferbraun und „Vita“ in Sage. Auf der Produktseite sollte der Hinweis
  „kein Medizinprodukt“ sichtbar bleiben – er steht auch in der App an mehreren
  Stellen. Der Dienst-Bezug zum Lizenzserver besteht ausschließlich wegen des
  Support-/Kontaktformulars, nicht wegen einer Lizenzprüfung. Die App ist
  kostenlos (Entscheidung Matthias 07.10.2026, Logbuch #5065); eine Lizenzprüfung ist im
  aktuellen Quellstand nicht implementiert.
