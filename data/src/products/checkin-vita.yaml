# CheckInVita: Produktdatei der Webseite, übernommen aus der Produkteinschreibung von [FF_23] (Stand 11.10.2026)
# nach Entscheidung Matthias 11.10.2026 (Produktseite sichtbar, mit den vorhandenen Store-Bildern).
# ---- Kennung ---------------------------------------------------------------
slug: checkin-vita
name: CheckInVita
fullName: FehlerFuchs CheckInVita
seoTitel: "CheckInVita – persönliches Gesundheitstagebuch, lokal und ohne Cloud"
seoBeschreibung: "Gesundheitswerte wie Blutdruck, Gewicht oder Schlaf selbst erfassen und im Verlauf sehen, aufbereitet für den Praxisbesuch – lokal auf dem Gerät, ohne Cloud."
tags: ["Gesundheitstagebuch", "Symptomtagebuch", "Blutdruck", "Verlauf", "lokal", "ohne Cloud"]
kind: produkt

# ---- Was es ist ------------------------------------------------------------
tagline: >-
  Gesundheits-Tagebuch für eigene Werte, Medikamente und Arzttermine –
  ohne Konto, ohne Cloud.

description: >-
  CheckInVita ist ein persönliches Tagebuch für alles rund um die eigene Gesundheit:
  Gewicht, Blutdruck, Puls, Blutzucker, Schlaf, Schritte, Notizen und Fotos. Es zeigt
  die Werte als Verlauf, verwaltet Medikamente samt Einnahmeplan und erinnert an
  Injektionen und Rezeptbestellungen. Für die Praxis erzeugt es eine
  Werte-Zusammenfassung als PDF und bereitet Mailvorlagen vor – gesendet wird nur, was man
  selbst abschickt. Kein Nutzerkonto, keine Auswertung durch Dritte, keine Bewertung
  der Werte. CheckInVita ist kein Medizinprodukt und ersetzt keine ärztliche Beratung,
  Diagnose oder Therapie.

audience: [privat]
accent: "#5B8A72"

# ---- Stand -----------------------------------------------------------------
status: verfuegbar

platforms:
  - os: android
    status: verfuegbar
    requirements: Android 7.0 oder neuer (minSdk 24)
    distribution: play-store
    storeId: eu.fehlerfuchs.checkinvita
    since: "2026-10-11"
  - os: windows
    status: entwicklung
    requirements: Windows 10/11 (64-bit)
    distribution: keiner
    hinweis:
      wenn: entwicklung
      text: >-
        Eine Windows-Fassung ist in Entwicklung. Sie ist noch nicht veröffentlicht, es gibt
        keinen Installer und keinen Download.

privacy: [inhalte-lokal, keine-cloud, kein-konto, kein-tracking, werbefrei, offline-faehig]

# ---- Ausbaustufen und Preise ----------------------------------------------
editions:
  - id: standard
    name: CheckInVita
    public: true
    summary: Voller Funktionsumfang, kostenlos.
    price:
      model: kostenlos

# ---- Funktionen ------------------------------------------------------------
features:
  - group: Erfassen
    items:
      - name: Tagebuch-Einträge mit Gewicht, Blutdruck, Puls, Blutzucker, HbA1c, SpO2, Temperatur, Atemfrequenz, Schritten und Schlaf
        values: { standard: ja }
        note: Alle Felder sind freiwillig; nur das Datum ist fest.
      - name: Notizen und Nebenwirkungen je Eintrag
        values: { standard: ja }
      - name: Fortschrittsfotos in vier Ansichten
        values: { standard: ja }
      - name: Rauchverhalten dokumentieren
        values: { standard: ja }
      - name: Automatische Übernahme von Messgeräten oder aus Health Connect
        values: { standard: nein }
        note: Werte werden ausschließlich selbst eingetragen.

  - group: Verstehen
    items:
      - name: Verlaufsdiagramme je Kennzahl mit Zeitraum-Auswahl
        values: { standard: ja }
      - name: Kombinierte Herz-Ansicht aus Systole, Diastole, Mitteldruck und Puls
        values: { standard: ja }
      - name: Wertebereich jedes Diagramms selbst festlegen
        values: { standard: ja }
        note: Ohne eigene Angabe skaliert die Achse automatisch.
      - name: Wochenvergleich und BMI-Berechnung
        values: { standard: ja }
      - name: Bewertung oder Warnung bei Grenzwerten
        values: { standard: nein }
        note: Bewusst nicht – die App stellt nur dar.

  - group: Medikamente
    items:
      - name: Medikamentenliste mit Dosierung und Darreichungsform
        values: { standard: ja }
      - name: Einnahmeplan nach Tageszeit, Wochentag oder Intervall
        values: { standard: ja }
      - name: Injektionstherapie mit Protokoll
        values: { standard: ja }
      - name: Erinnerungen an Injektion und Rezeptbestellung
        values: { standard: ja }
        note: Uhrzeit, „Einen Tag vorher“ und Ausschalter sind einstellbar; die Mitteilung nennt keinen Präparatnamen. Bisher nur in der Android-Fassung.
      - name: Reichweitenrechnung aus Packungsgröße und Verbrauch
        values: { standard: ja }

  - group: Mit der Praxis kommunizieren
    items:
      - name: Behandler-Adressbuch und Kostenübernahmen
        values: { standard: ja }
      - name: Vorbereitete Mailvorlagen für Rezeptanfragen und Rückfragen
        values: { standard: ja }
        note: Öffnet die eigene Mail-App; abgeschickt wird nur, was du selbst sendest.
      - name: Werte-Zusammenfassung als PDF zum Mitnehmen
        values: { standard: ja }
      - name: Privater Medikamenten-Plan als PDF
        values: { standard: ja }
        note: Ausdrücklich als privat gekennzeichnet, kein amtlicher Medikationsplan.

  - group: Eigene Daten
    items:
      - name: Export als CSV und Excel-kompatible Tabelle
        values: { standard: ja }
      - name: Vollständige Sicherung und Wiederherstellung
        values: { standard: ja }
      - name: App-Sperre beim Öffnen
        values: { standard: ja }
      - name: Konto oder Registrierung nötig
        values: { standard: nein }
      - name: Werbung
        values: { standard: nein }

