# Warum es gerade so steht – in eigenen Worten. Hängt unter 'wenn' am Status;
# wird die Arbeit aufgenommen, passt der Satz nicht mehr und die Prüfung meldet
# ihn. So wird aus der Erklärung keine veraltete Ausrede.
statusGrund:
  wenn: idee
  text: >-
    Erst das Fundament, dann der Code. Bei einer App für die Feuerwehr sitzt
    jede Rechnerformel und jeder Merksatz an einer benannten Quelle – und viele
    Nachschlagewerke und Karten hängen an Lizenzen, die geklärt sein müssen,
    bevor etwas gebaut wird. Genau das läuft gerade. Marke, Umfang und Technik
    stehen; die Umsetzung beginnt, sobald die Rechtefragen beantwortet sind.

