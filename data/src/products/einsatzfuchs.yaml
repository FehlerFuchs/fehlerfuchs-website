# Eigener Slug, Eigentümer 33_EinsatzFuchs (in _SLUG-EIGENTUEMER.md
# eingetragen von ChefBüro, 24.07.2026). Einschreibung zusammengestellt aus
# Konzept, MVP-Schnitt v0.1, Technik-Entscheidung und Marke V2.
#
# BEWUSST EINE KONZEPTSEITE. Die App gibt es noch nicht – es steht noch keine
# Zeile Code, es läuft die Klärung von Umfang, Technik und vor allem der
# Inhalts-Lizenzen (Nachschlagewerke, Karten). Die Seite zeigt das offen:
# Status 'idee', alle Merkmale unter 'geplant', kein Download, keine
# Bildschirmfotos. Was schon da ist – die Marke –, wird genutzt.

tagline: >-
  Kostenlose, werbefreie Offline-App für die Freiwillige Feuerwehr:
  Einsatzrechner, Merksätze und Nachschlagewerke in einer App statt fünf.
description: >-
  EinsatzFuchs ist eine geplante, nicht-kommerzielle Android-App für Angehörige
  der Freiwilligen Feuerwehr. Sie soll Einsatzwerkzeuge (Rechner und
  Checklisten), Nachschlagewerke, eine Lagekarte und Lernmodule in einer
  einzigen, offline nutzbaren App bündeln – statt fünf verschiedene Apps zu
  öffnen. Kein Abo, keine Werbung, keine Datenerhebung, kein Konto. Das Projekt
  steht in der Konzeptphase: Umfang, Technik und Marke sind festgelegt, die
  Umsetzung hat noch nicht begonnen. Ausdrücklich kein Alarmierungssystem und
  kein Cloud-Dienst; alle Ausgaben sind Orientierungshilfen ohne Gewähr.
# 'ehrenamt' am 25.07.2026 neu ins audience-Vokabular aufgenommen – die
# Freiwillige Feuerwehr ist ehrenamtlich, nicht Verein und nicht Gewerbe.
audience: [ehrenamt, privat]

# Ein persönliches Wort, ganz oben auf der Seite. Bewusst in Ich-Form und
# deutlich abgesetzt vom übrigen, sachlichen Text: EinsatzFuchs ist kein
# Firmenprodukt, sondern Matzes ehrenamtlicher Beitrag. Das darf man sehen.
vorwort:
  von: Matze
  titel: Warum es EinsatzFuchs gibt
  # Eigenes Portrait statt des allgemeinen Marken-Bilds: Matze in Uniform.
  # Bei einer Feuerwehr-App erzählt das die Geschichte des Vorworts sofort.
  bild:
    src: /img/matze-feuerwehr-sw.jpg
    alt: Matze in Feuerwehruniform
    fokus: 50% 22%
  absaetze:
    - >-
      Ich bin bei der Feuerwehr, seit ich zehn bin – heute als Gruppenführer
      und Ausbilder. Wie so viele im Ehrenamt habe ich zuletzt weniger Zeit für
      den aktiven Dienst, als ich gern hätte. EinsatzFuchs ist meine Art, trotzdem
      etwas beizutragen: mit dem, was ich kann.
    - >-
      Die App entsteht privat und in Eigenregie, in meiner Freizeit und ohne
      kommerzielle Absicht. Kein Abo, keine Werbung, keine Datenerhebung – und
      das bleibt so. Ich baue sie für die Kameradinnen und Kameraden, die im
      Einsatz schnell an die richtige Formel oder den richtigen Merksatz kommen
      wollen, ohne fünf Apps zu durchsuchen.
    - >-
      Sie ist noch nicht fertig – nicht einmal angefangen im Code. Erst kläre
      ich die Quellen und Lizenzen, damit jede Zahl stimmt und jede Karte
      genutzt werden darf. Lieber sorgfältig als schnell: Im Einsatz muss man
      sich darauf verlassen können.
    - >-
      Ein erster Baustein steht schon: Das EinsatzleiterWiki stellt mir seine
      frei lizenzierten Inhalte zur Verfügung – ein großes Geschenk für ein
      Projekt wie dieses. Dafür bin ich sehr dankbar.

