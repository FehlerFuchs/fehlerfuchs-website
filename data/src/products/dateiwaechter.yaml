slug: dateiwaechter
name: DateiWächter
fullName: FehlerFuchs DateiWächter
kind: produkt
tagline: >-
  Windows-Tray-Tool: überwacht Ordner und verschiebt abgelegte Dateien mit
  Prüfsumme sicher ans Ziel – plus ein Aufräum-Modul mit Vorschau und
  Bestätigung. Kostenlos, kein Konto, kein Tracking.
description: >-
  Leg die Datei ab – um den Rest kümmert sich der Fuchs. DateiWächter beobachtet
  beliebig viele Ordner und bringt alles, was dort landet, sicher ans Ziel:
  zweite Platte, Netzlaufwerk, NAS. Sicher heißt wirklich sicher – erst
  kopieren, dann eine SHA256-Prüfsumme über Quelle und Ziel, und das Original
  nur löschen, wenn beide identisch sind; ist das Ziel offline, bleibt die Datei
  liegen. Das Aufräum-Modul räumt benutzer-level auf (Temp, Papierkorb, Caches)
  – erst Vorschau, dann Löschen nur nach Bestätigung, nie Systempfade. In
  Entwicklung – noch kein öffentlicher Download.
audience: [privat, selbststaendige, unternehmen]
accent: "#C2410C"   # Platzhalter: FehlerFuchs-Hausfarbe, bis die App-Farbe geliefert wird

