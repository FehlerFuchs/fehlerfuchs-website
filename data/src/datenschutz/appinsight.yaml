slug: appinsight
name: FehlerFuchs AppInsight
stand: "2026-09-24"
geprueft_von: 22_AppInsight
fassung: "1.0.0 (noch nicht veröffentlicht)"

# Die App besitzt keine Berechtigung für Internetzugriff und kann daher von
# sich aus nichts senden oder abrufen.
lokal_only: true

auf_dem_geraet:
  - was: Anzeige-Einstellung (Hell, Dunkel oder Systemvorgabe)
    wo: App-Einstellungen auf dem Gerät
    beleg: lib/core/state/providers.dart (ThemeModeController, Schlüssel „themeMode“)
  - was: Liste der Apps, denen du den Internetzugang gesperrt hast (Paketnamen)
    wo: App-Einstellungen auf dem Gerät
    beleg: lib/core/state/providers.dart (BlockedAppsController, Schlüssel „blockedApps“)
  - was: Merker, ob die Ersteinrichtung abgeschlossen ist
    wo: App-Einstellungen auf dem Gerät
    beleg: lib/core/state/providers.dart (OnboardingController, Schlüssel „onboardingDone“)
  - was: Erzeugte Berichte (PDF oder HTML) über die installierten Apps
    wo: temporärer Ablageort der App, nur im Moment des Teilens
    beleg: lib/core/report/report_service.dart (getTemporaryDirectory, _shareBytes, _shareTextFile)
  - was: Ergebnisse der App-Analyse (Liste, Berechtigungen, Bewertungen)
    wo: nur im Arbeitsspeicher, wird nicht dauerhaft gespeichert
    beleg: lib/core/state/providers.dart (appsProvider); lib/core/platform/app_scanner.dart
  # Neu seit A8, 24.09.2026. Vorher stand oben "nur im Arbeitsspeicher" für
  # ALLE Analyseergebnisse - das stimmt seit dem Hintergrund-Scan nicht mehr.
  - was: Ergebnisse der Paketuntersuchung je App (Sicherheitssignale, Netzwerk-Regeln,
      im Code erkannte Tracker-Bibliotheken, Server-Adressen im Code)
    wo: Zwischenspeicher (Cache) der App, eine Datei je App; per „Cache leeren“
      löschbar, Android darf ihn räumen, Einträge deinstallierter Apps werden
      beim nächsten Durchlauf entfernt; nicht in der Datensicherung
    beleg: android/app/src/main/kotlin/.../HintergrundAnalyse.kt (cacheDir/analyse,
      raeumeAuf); AndroidManifest.xml (allowBackup="false")
  - was: Diagnosedatei für eine Support-Nachricht (App-Version, Plattform,
      Zahl analysierter und gesperrter Apps, Einstellungen - keine Paketnamen)
    wo: temporärer Ordner der App, nur im Moment des Sendens, beim App-Start
      aufgeräumt
    beleg: lib/core/support/diagnose_anhang.dart; lib/features/transparency/about_page.dart

berechtigungen:
  - name: Alle installierten Apps sehen
    wofuer: Kernzweck der App - die installierten Apps auflisten und ihre
      Berechtigungen, Bestandteile und Tracker-Hinweise auswerten
    pflicht: true
    beleg: android/app/src/main/AndroidManifest.xml (QUERY_ALL_PACKAGES)
  - name: Nutzungsdaten (Sonderzugriff, den du selbst in den Android-Einstellungen erteilst)
    wofuer: Größe, Cache, Nutzungszeiten und Datenverbrauch je App anzeigen
    pflicht: false
    beleg: android/app/src/main/AndroidManifest.xml (PACKAGE_USAGE_STATS);
      MainActivity.kt (hasUsageAccess, getStorageAndUsage, getNetworkUsage)
  - name: Dienst, der im Vordergrund weiterläuft
    wofuer: Betrieb der App-Internetsperre, solange mindestens eine App gesperrt ist
    pflicht: false
    beleg: android/app/src/main/AndroidManifest.xml (FOREGROUND_SERVICE,
      FOREGROUND_SERVICE_SPECIAL_USE); BlockerVpnService.kt
  - name: Benachrichtigungen
    wofuer: von Android vorgeschriebener Hinweis, solange die Internetsperre läuft
    pflicht: false
    beleg: android/app/src/main/AndroidManifest.xml (POST_NOTIFICATIONS)
  - name: Geräteinterne Netzwerksperre einrichten
    wofuer: technische Voraussetzung für die App-Internetsperre; du bestätigst
      sie einmalig in einem Android-Dialog
    pflicht: false
    beleg: android/app/src/main/AndroidManifest.xml (service .BlockerVpnService,
      BIND_VPN_SERVICE)

# Die App baut selbst keine Netzwerkverbindungen auf. Aufgeführt sind
# Übergaben an andere Apps, die der Nutzer selbst auslöst.
uebertragungen:
  - wohin: vom Nutzer gewählte Ziel-App (Android-Teilen-Menü)
    was: der erzeugte Bericht mit Namen und Berechtigungen der auf dem Gerät
      installierten Apps
    wann: nur wenn der Nutzer einen Bericht teilt
    freiwillig: true
    beleg: lib/core/report/report_service.dart (Share.shareXFiles)
  - wohin: vom Nutzer gewählte Mail-App (Support-Nachricht an support@fehlerfuchs.eu)
    was: der vom Nutzer geschriebene Text und - abwählbar - die Diagnosedatei
    wann: nur wenn der Nutzer unter Info eine Support-Nachricht schreibt; gesendet
      wird von der Mail-App, erst nach Bestätigung des Nutzers dort
    freiwillig: true
    beleg: MainActivity.kt (openMail, ACTION_SEND/ACTION_SENDTO);
      lib/features/transparency/about_page.dart
  - wohin: Google Play Store
    was: nur der Paketname der aufgerufenen App
    wann: nur bei „Im Store ansehen“, „Bedenken melden“ oder „Im Store bewerten“
    freiwillig: true
    beleg: MainActivity.kt (openAppStore); lib/features/apps/app_detail_page.dart

# Keine fremden Dienste eingebunden: keine Analyse-, Werbe- oder Absturzdienste,
# keine Bezahlabwicklung, keine Schriften oder Inhalte aus dem Netz.
fremde_dienste: []

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false
daten_an_dritte_verkauft: false

loeschung: >-
  Alle Daten liegen auf dem Gerät: die App-Einstellungen und - nur während des
  Teilens - eine vorübergehende Berichtsdatei. Beim Deinstallieren verschwindet
  alles. Berichte, die du selbst weitergegeben oder abgespeichert hast, liegen
  dort, wohin du sie gelegt hast, und müssen dort gelöscht werden.

besonderheiten: >-
  AppInsight liest Angaben über andere Apps: Name, angeforderte Berechtigungen,
  Bestandteile, Signatur und Installationsquelle sowie - wenn du die Nutzungsdaten
  freigibst - Speicher-, Nutzungs- und Datenverbrauchswerte. Seit dem 24.09.2026
  untersucht es außerdem das Installationspaket (APK) jeder App, das Android für
  jede App lesbar macht: Netzwerk-Regeln, Namen der Programmbausteine (Tracker-
  Erkennung) und Server-Adressen im Code. Das Paket wird nur gelesen, nichts daraus
  ausgeführt. Daten anderer Apps liest es nicht; Android schottet Apps
  gegeneinander ab. Die gesamte Auswertung
  findet auf dem Gerät statt. Die optionale Internetsperre arbeitet mit einer
  geräteinternen Sperre, die den Datenverkehr der gesperrten Apps verwirft: Es
  gibt keine Weiterleitung über einen Server und keine Aufzeichnung des
  Datenverkehrs. Die Ampel-Einordnung ist eine Einschätzung nach festen Regeln,
  kein Urteil über eine App.

vorhandener_text: >-
  Datenschutzerklärung im Volltext, offline in der App unter Info →
  Datenschutzerklärung (lib/features/transparency/rechtstexte.dart, Stand
  24.09.2026), dazu „Warum braucht AppInsight Berechtigungen?“ unter Info und
  Einstellungen (lib/features/transparency/about_page.dart). Webfassung:
  https://fehlerfuchs.eu/datenschutz/#app-appinsight

offene_fragen: >-
  1) Erledigt am 22.09.2026: Die Kontaktfunktion ist keine Zwischenablage mehr,
  sondern eine Übergabe an die Mail-App des Nutzers (siehe Übertragungen). Die
  App selbst sendet weiterhin nichts. Ein Versand über einen eigenen Server ist
  nicht gebaut; käme er, wäre dieser Steckbrief zu erneuern.
  2) Die App ist noch nicht veröffentlicht (Stand 1.0.0). Alle Angaben
  beziehen sich auf den heutigen Entwicklungsstand, nicht auf eine Store-Fassung.
