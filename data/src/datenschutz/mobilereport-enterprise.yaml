  gegenüber 1.5.0+54 (26.09.2026, Commit 61cb618f; davor 1.4.0+53, 23.09.2026,
  Commit c6faf2b3). Die früher hier genannte
  1.0.3+7 wurde nie ausgeliefert und ging in 1.4.0 auf.

offene_fragen: >-
  (1) Unbekannt, ob der Lizenzdienst serverseitig IP-Adressen oder Zeitpunkte
