slug: wachfuchs
name: WachFuchs
stand: "2026-09-25"
geprueft_von: 34_WachFuchs
fassung: "Entwicklungsphase – App-Gerüst steht (flutter create 03.08.2026, gemeinsamer Kern fehlerfuchs_kern eingebunden), noch kein Store-Eintrag. Angaben aus Architektur-Konzept (Entwurf 1, Abschnitt 7), ergänzt um die Entscheidungen vom 02.–04.08.2026 (Vertriebsmodell, Korrekturkanal, Prüfvermerke)"

# App vorhanden, aber ohne Konto und ohne personenbezogene Daten.
# Internet nur für Inhalts-Abruf und den freiwilligen Melde-Knopf.
lokal_only: false

# Was auf dem Gerät liegt (alles ohne Personenbezug):
auf_dem_geraet:
- was: Lernstand (Leitner-Fächer je Frage)
  wo: lokal, verlässt das Gerät nicht
- was: Inhaltspakete (SQLite mit Fragen/Antworten/Fundstellen)
  wo: heruntergeladen, lokal gespeichert
- was: Zufällige Installations-ID (lokal erzeugt, kein Personenbezug)
  wo: nur für Rate-Limit/Melde-Bezug
- was: Merker, welche Fragen gemeldet wurden
  wo: lokal, für den Bearbeitet-Hinweis

# Nur Internet; bewusst KEINE Kamera/Kontakte/Standort/Speicher-Vollzugriff.
berechtigungen:
- name: Internet
  wofuer: Inhaltspakete abrufen und (freiwillig) Meldungen senden

# Verbindungen nach draußen:
uebertragungen:
- wohin: FehlerFuchs Relaisserver
  was: Katalog/Inhaltspakete abrufen (nur lesen, signiert, kein Personenbezug)
- wohin: FehlerFuchs Relaisserver
  was: 'Korrekturkanal: regelmäßiger Abruf einer kleinen signierten Datei ''korrekturen.json'' vom Relaisserver
    (reiner GET, keine Kennung, keine Nutzerdaten, keine Parameter) – sperrt oder ersetzt einzelne fehlerhafte
    Fragen, ohne dass die App neu ausgeliefert werden muss (Konzept 6.3). Die technische Abruftaktung
    ist eine Architektureigenschaft und keine Servicezusage.'
- wohin: FehlerFuchs Relaisserver (Meldungs-Endpunkt)
  was: 'Meldung über ''Frage melden'': paketId, frageId, inhaltsVersion, appVersion, Grund, optionaler
    Text (max. 500 Zeichen), gewählte Antwort, zufällige Installations-ID – kein Name, keine E-Mail, kein
    Standort, kein Lernstand'
  freiwillig: true
- wohin: Google Play Billing
  was: Kaufabwicklung (läuft über Google, nicht über eigene Server)

# Eingebundene Fremddienste:
fremde_dienste:
  - "Google Play Billing (Kaufabwicklung) – Google verarbeitet die Kaufdaten; WachFuchs erhält keine Google-Konto-Kennung"
  - "FehlerFuchs Relaisserver (eigen, IONOS-VPS Deutschland) – Auslieferung signierter Pakete + Meldungs-Endpunkt; Zugriffs-Logs ohne volle IP, kurze Aufbewahrung"
  # Ausdrücklich NICHT: Analytics, Crash-Reporting mit Kennung, Werbe-ID, Tracking-SDKs.

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false
daten_an_dritte_verkauft: false

loeschung: >-
  Es gibt kein Nutzerkonto und keine serverseitig gespeicherten Nutzerdaten. Alle lokalen
  Daten (Lernstand, Pakete, Installations-ID) werden mit der Deinstallation der App entfernt.
  Freiwillige Meldungen enthalten keinen Personenbezug; serverseitig werden sie ohne volle
  IP und nur kurz aufbewahrt. Wer seinen Lernstand sichern will, exportiert eine lokale Datei.

besonderheiten: >-
  Kostenpflichtige Lern-App für die Feuerwehr-Ausbildung. Grundsatz: was nicht erhoben
  wird, kann nicht verloren gehen – kein Konto, kein Login, kein Analytics, keine Werbe-ID.
  Lernstand bleibt auf dem Gerät; der Server ist Komfort, keine Voraussetzung (offline-first).
  Inhaltspakete sind Ed25519-signiert; die App lädt keinen ausführbaren Code nach.
  Jede Aussage trägt ihre Fundstelle mit Ausgabestand und Abrufdatum sowie einen sichtbaren
  Prüfvermerk (durch KI geprüft / durch Autor / durch die Community geprüft) – das sind
  Angaben zum Inhalt, keine Nutzerdaten.

vorhandener_text: ""

offene_fragen: >-
  1) Serverseitige Aufbewahrungsfristen des Meldungs-Endpunkts final festzurren.
  2) Vor der ersten bezahlten Version einmal anwaltlich prüfen (Konzept 3/11).
  3) Zugriffs-Logs des Korrekturkanals: durch den häufigen Abruf entstehen mehr Logzeilen
  als beim täglichen Katalogabruf – Kürzung der IP und kurze Aufbewahrung gelten
  unverändert, die Fristen gehören zu Punkt 1.
  4) Community-Prüfvermerk: sobald Nutzer Bestätigungen abgeben können, ist zu klären,
  ob dabei über die zufällige Installations-ID hinaus etwas erhoben wird – Ziel ist nein.
  Erledigt am 02.08.2026: Vertriebsmodell dem Grunde nach entschieden (Kauf über Google Play
  Billing, freier Einstiegsblock) – betrifft nur Play-Kauf-/Widerrufsangaben, nicht die
  Datenerhebung. Der Zuschnitt der Kaufobjekte wurde am 03.08.2026 auf Blöcke umgestellt.
