slug: snapfuchs
name: SnapFuchs
stand: "2026-10-08"
geprueft_von: 30_SnapFuchs
fassung: "1.2.3 (versionCode 12)"

# Beim App-Start fragt die Pro-Freischaltung automatisch den Kaufstatus bei
# Google Play ab (restorePurchases). Nutzerinhalte (Scans, PDFs, erkannter
# Text) verlassen das Geraet dabei NICHT.
lokal_only: false

auf_dem_geraet:
  # 2026-10-08 (Fassung 1.2.3, F-022, Entscheidung Matthias (a)-(e) je A):
  # Fertige PDFs liegen nicht mehr im App-Speicher, sondern im vom Nutzer
  # bestaetigten Geraeteordner (SAF, KEINE Speicher-Berechtigung). Die fruehere
  # optionale Standardablage (seit 1.2.0, zusaetzliche Kopie) entfaellt.
  # Wortlaut bestaetigt von Matthias („A: alle 5 Stellen“, 08.10.2026).
  - was: Fertige PDFs (auch in selbst angelegten Unterordnern)
    wo: in dem Ordner auf dem Gerät, den du einmal über die Android-Ordnerauswahl (SAF) bestätigst; vorgeschlagen wird „Dokumente › SnapFuchs“; sichtbar in der Dateien-App und nach einer Deinstallation weiterhin vorhanden
    beleg: lib/core/storage/dokument_speicher.dart (SafAblage), lib/core/storage/geraete_ordner.dart, android/app/src/main/kotlin/eu/fehlerfuchs/snapfuchs/GeraeteOrdner.kt
  - was: Unfertiger Scan (Absturzschutz)
    wo: im App-Speicher, bis du bei „Behalten?“ antwortest oder den Scan verwirfst; danach wird er gelöscht
    beleg: lib/core/storage/entwurf_speicher.dart, lib/features/scan/scan_controller.dart (abgeschlossen)
  - was: Einstellungen (Wasserzeichen-Stil und -Position, Kaufstatus)
    wo: Geräteeinstellungen der App
    beleg: lib/models/watermark_config.dart, lib/utils/pro_check.dart
  - was: App-eigener Fehlerlog (technische Fehlermeldungen, überdauert Neustart)
    wo: lokale Datei im App-Verzeichnis
    beleg: lib/core/diagnose/fehlerlog.dart
  - was: Temporäre Dateien für OCR, Export und Teilen
    wo: App-Cache, werden nach Gebrauch gelöscht bzw. vom System aufgeräumt
    beleg: lib/core/ocr/tesseract_service.dart, lib/core/pdf/pdf_export.dart
  - was: Für die PDF-Werkzeuge ausgewählte fremde PDF-Dateien
    wo: Kopie im App-Cache
    beleg: android/app/src/main/kotlin/eu/fehlerfuchs/snapfuchs/MainActivity.kt

# 2026-08-05 (Audit F-005): App-Backup ausdruecklich DEAKTIVIERT. Weder
# Cloud-Backup (Android 12+) noch Geraet-zu-Geraet-Transfer nehmen App-Daten
# mit; damit verlassen Scans, Einstellungen und Diagnosedaten das Geraet auch
# ueber diesen Weg nicht.
backup_ausgeschlossen:
  wo: android:allowBackup="false", fullBackupContent="false", dataExtractionRules
  beleg: android/app/src/main/AndroidManifest.xml, android/app/src/main/res/xml/data_extraction_rules.xml

berechtigungen:
  - name: Kamera
    wofuer: Dokumente scannen, QR-Codes und Barcodes lesen
    pflicht: true
    beleg: CAMERA in android/app/src/main/AndroidManifest.xml
  - name: Internet
    wofuer: Feedback absenden, Verweise im Browser öffnen, Kaufabwicklung über Google Play
    pflicht: false
    beleg: INTERNET in android/app/src/main/AndroidManifest.xml
  - name: In-App-Abrechnung
    wofuer: einmaliger Kauf der Pro-Fassung
    pflicht: false
    beleg: com.android.vending.BILLING, vom Paket in_app_purchase ergaenzt, im gemergten Release-Manifest enthalten
  # 2026-07-31 (Audit F-025): WRITE_EXTERNAL_STORAGE ENTFERNT. Das Speichern in
  # App-interne Verzeichnisse braucht keine Berechtigung; die Legacy-
  # Schreibberechtigung war ungenutzt und ist per tools:node="remove" gestrichen.
  # 2026-10-08 (Fassung 1.2.3): Speicherort der fertigen PDFs ueber das Storage
  # Access Framework; weiterhin KEINE Speicher-Berechtigung (aapt2-Vergleich:
  # Rechte gleich 1.2.2).
  - name: Ordnerzugriff (Storage Access Framework)
    wofuer: fertige PDFs in den von dir gewählten Ordner schreiben und die Liste „Letzte Dokumente“ aus diesem Ordner lesen; keine Speicher-Berechtigung nötig, der Zugriff gilt nur für genau den vom Nutzer gewählten Ordner (persistierbare URI-Freigabe) und ist jederzeit widerrufbar (ohne gewählten Ordner kannst du Scans nur teilen)
    pflicht: false
    beleg: ACTION_OPEN_DOCUMENT_TREE + takePersistableUriPermission in android/app/src/main/kotlin/eu/fehlerfuchs/snapfuchs/MainActivity.kt; DocumentsContract in GeraeteOrdner.kt
  - name: Netzwerkstatus
    wofuer: wird von der App nicht abgefragt; stammt aus eingebundenen Bausteinen
    pflicht: false
    beleg: ACCESS_NETWORK_STATE, gemergtes Release-Manifest Zeile 71
  - name: Mikrofon
    wofuer: wird nicht angefordert. Die Kamera wird ohne Tonaufnahme geöffnet; es wird nie Audio aufgezeichnet
    pflicht: false
    beleg: RECORD_AUDIO per tools:node="remove" entfernt in android/app/src/main/AndroidManifest.xml; enableAudio false in lib/features/scan/scan_screen.dart
  - name: Zugriff auf Fotos und Videos
    wofuer: wird nicht angefordert. Bilder wählt man über den Android-Fotoauswahl-Dialog aus, der ohne diese Berechtigung auskommt
    pflicht: false
    beleg: READ_MEDIA_IMAGES und READ_MEDIA_VIDEO per tools:node="remove" entfernt in android/app/src/main/AndroidManifest.xml; useAndroidPhotoPicker in lib/main.dart

uebertragungen:
  - wohin: Google Play (Abrechnung)
    was: Abfrage bzw. Übermittlung des Kaufstatus für die Pro-Fassung
    wann: automatisch beim App-Start (Wiederherstellung) und beim Kauf
    freiwillig: false
    beleg: lib/utils/pro_check.dart
  - wohin: license.fehlerfuchs.eu
    was: Nachrichtentext, freiwillig Name und E-Mail-Adresse, App-Name sowie optional angehängte Bilder. Nur wenn der Nutzer den Haken „Diagnosedaten mitsenden“ setzt, kommen zusätzlich App-Version, Android-Version, Gerätemodell und Edition mit sowie eine Diagnosedatei mit Technikdaten und dem App-eigenen Fehlerlog
    wann: nur wenn der Nutzer das Feedback-Formular aktiv absendet
    freiwillig: true
    beleg: lib/core/kontakt/kontakt_service.dart, lib/features/info/feedback_screen.dart
  - wohin: fehlerfuchs.eu
    was: Aufruf der Website (Impressum, Kontakt, weitere Apps, Unterstützen) im externen Browser
    wann: nur wenn der Nutzer den jeweiligen Verweis antippt
    freiwillig: true
    beleg: lib/features/info/impressum_screen.dart, lib/features/home/home_screen.dart
  - wohin: vom Nutzer gescannte Adresse (QR-Code)
    was: Aufruf der im Code enthaltenen Adresse im externen Browser
    wann: nur nach Antippen von „Öffnen“ im Ergebnisdialog
    freiwillig: true
    beleg: lib/features/code/code_scan_screen.dart
  - wohin: Mail-App des Geräts
    was: vorbereitete Support-Mail als Rückfallweg, wenn das Formular nicht durchkommt
    wann: nur nach Bestätigung durch den Nutzer
    freiwillig: true
    beleg: lib/features/info/feedback_screen.dart

fremde_dienste:
  - name: Google Play Billing (Paket in_app_purchase)
    wofuer: einmaliger In-App-Kauf der Pro-Fassung und dessen Wiederherstellung
    wann: beim App-Start (Statusabfrage) und beim Kauf
  - name: Kontakt-Weiterleitung auf dem FehlerFuchs-Lizenzserver (EU, IONOS)
    wofuer: nimmt das Feedback entgegen und leitet es per E-Mail weiter
    wann: nur beim aktiven Absenden des Formulars

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false
daten_an_dritte_verkauft: false

loeschung: >-
  Alle Inhalte liegen auf dem Gerät. Deine fertigen PDFs liegen in dem Ordner,
  den du gewählt hast; du kannst sie in der App oder in der Dateien-App
  löschen. Sie bleiben auch nach einer Deinstallation erhalten, bis du sie
  selbst löschst. Alles Übrige (Einstellungen, Fehlerlog, Cache) verschwindet
  mit der Deinstallation. Per Feedback gesendete Nachrichten liegen im
  Support-Postfach und werden auf Anfrage gelöscht.

besonderheiten: >-
  Texterkennung, Tabellenerkennung, das Lesen von QR-Codes und Barcodes sowie
  alle PDF-Werkzeuge laufen vollständig auf dem Gerät und bauen dafür keine
  Verbindung nach außen auf. Es gibt kein Konto und keine Registrierung.
  Bilder aus der Galerie werden über den Android-Fotoauswahl-Dialog
  ausgewählt; deshalb fordert die App keine Berechtigung für Fotos oder
  Videos an. In der kostenlosen Fassung tragen die erzeugten PDFs ein
  Wasserzeichen, das nach dem einmaligen Kauf entfällt. Der Kaufstatus wird
  auf dem Gerät gespeichert und zusätzlich bei Google Play abgefragt.
  Fertige PDFs liegen in einem Ordner auf dem Gerät, den du einmal über die
  Android-Ordnerauswahl (SAF) bestätigst; das braucht keine
  Speicher-Berechtigung. Nach dem Scannen fragt die App „Behalten?“: „Ja“
  speichert das PDF im Ordner, „Nein“ teilt es nur, danach wird nichts
  aufbewahrt. Ein noch nicht fertiger Scan bleibt als Absturzschutz in der
  App, bis du die Frage beantwortest oder ihn verwirfst; dann wird er
  gelöscht. Die Liste „Letzte Dokumente“ zeigt den Inhalt dieses Ordners. PDFs
  aus früheren Fassungen, die noch im App-Speicher liegen, werden nur mit
  deiner Zustimmung einmal in den Ordner verschoben; jede Datei wird vor dem
  Löschen in der App auf Gleichheit geprüft. Dabei verlässt nichts das Gerät.
  Der beim Scannen vergebene Dokumentname bleibt
  nur im Arbeitsspeicher und bestimmt lediglich den Dateinamen beim Export.

vorhandener_text: >-
  Seit Fassung 1.2.1 steht die veröffentlichte Datenschutzerklärung von
  fehlerfuchs.eu (allgemeiner Teil und Abschnitt SnapFuchs) offline in der App
  unter Menü › Rechtstexte › Datenschutz, wortgleich gebündelt
  (assets/rechtstexte/datenschutz_snapfuchs.md). Zusätzlich ein kurzer
  Datenschutz-Abschnitt unter Einstellungen
  (lib/features/settings/settings_screen.dart); das Impressum verweist auf die
  Website.

offene_fragen: >-
  1) ACCESS_NETWORK_STATE steht nur wegen eingebundener Bausteine im Manifest;
  im eigenen Code wird der Netzwerkstatus nirgends abgefragt. Die Berechtigung
  bleibt vorerst drin, weil die Kaufabwicklung sie voraussetzen dürfte; sie
  ist nicht sensibel und wird dem Nutzer nicht angezeigt.
  2) Ob und wie lange der Kontakt-Server IP-Adressen protokolliert, hängt vom
  Server ab und ist aus dem App-Code nicht feststellbar.
