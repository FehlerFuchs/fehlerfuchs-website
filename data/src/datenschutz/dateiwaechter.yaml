  kein Code. Vor der ersten Veröffentlichung ist er am gebauten Programm gegenzuprüfen
  (Regel „Nur Tatsachen, keine Absichten“). 3) Die genaue Feldliste der Diagnosedatei steht im
  Konzept §7 und ist beim Bau gegen die tatsächliche Implementierung abzugleichen.
