slug: dateiwaechter          # entschieden 08.08.2026; in _SLUG-EIGENTUEMER.md eingetragen (11.08.2026)
name: DateiWächter
stand: "2026-08-11"
geprueft_von: 35_DateiWächter
fassung: >-
  App gebaut und ausgeliefert (v0.5.4). Angaben am tatsächlichen Code geprüft. Windows-Desktop-Tool,
  überwiegend lokal; seit v0.4 zusätzlich eine optionale, ausdrücklich zu koppelnde Handy-Verbindung
  zum verschlüsselten Dateitransfer (siehe uebertragungen/besonderheiten).

lokal_only: false   # Außenverbindungen: Versionsprüfung, Support (beide abschaltbar/nutzerinitiiert)
                    # sowie optional die Handy-Verbindung (Kopplung nötig, Empfang standardmäßig aus)

auf_dem_geraet:
  - "JSON-Konfiguration der Wächter-Regeln (Quell-/Zielordner, Optionen) – lokal, %APPDATA%\\FehlerFuchs\\DateiWaechter\\"
  - "Lokale Protokolldateien (verschobene/übersprungene Dateien, Fehler) – lokal, Aufbewahrung 30 Tage, dann automatisch entfernt"
  - "Handy-Kopplung: DWTP/1-Identität dieses PCs (privater Ed25519-Schlüssel + Paar-Geheimnis) – lokal, DPAPI-verschlüsselt (Windows-Benutzerbindung), nie im Klartext (dwtp-identitaet.bin)"
  - "Handy-Eingang: vom gekoppelten Handy empfangene Dateien – lokal im vom Nutzer gewählten Ordner (Vorgabe im Benutzerprofil)"
  - "Handy-Übertragungsverlauf: nur Metadaten (Dateiname, Größe, Zeit, Richtung, Ergebnis), lokal, letzte 200 Einträge (handy-verlauf.json)"

berechtigungen:
  - "Lesen/Schreiben in den vom Nutzer AUSGEWÄHLTEN Quell- und Zielordnern (lokal und Netzlaufwerk/SMB, z. B. NAS)"
  - "Löschen im Aufräum-Modul – nur benutzer-level, Whitelist, NUR nach Analyse und ausdrücklicher Bestätigung; nie System-/Nutzerdokumente/Projektdaten"
  - "Per-user Autostart-Eintrag (HKCU\\...\\Run, non-admin), damit der Wächter mit Windows startet"
  - "Handy-Verbindung (optional, nur nach Kopplung): ausgehende Verbindung zum Vermittlungsdienst; bei aktivem Direktweg zusätzlich ein lokaler TCP-Listener im eigenen Netz (LAN/USB-Tethering), non-admin"
  - "USB-Erkennung: rein lesende Abfrage angeschlossener Mobilgeräte (WMI, Windows Portable Devices), nur zur Anzeige; kein Datenzugriff aufs Handy"
  # Ausdrücklich NICHT: Kamera/Mikro/Standort/Kontakte; keine Administratorrechte; kein Zugriff
  # jenseits der vom Nutzer gewählten Ordner und der Aufräum-Whitelist.

uebertragungen:
  - zweck: "Versionsprüfung (Update-Hinweis)"
    ziel: "https://fehlerfuchs.eu/updates/dateiwaechter/latest.json"
    daten: >-
      Reiner lesender HTTP-Abruf einer statischen Datei. Es werden keine Nutzerdaten gesendet;
      IP-Adresse und Zeitpunkt fallen wie bei jedem Web-Abruf technisch an.
    haeufigkeit: "beim Start, danach höchstens einmal täglich"
    abschaltbar: true
    beleg: "Konzept v1.0 §8.1 – Einstellung „Nach Updates suchen“; ist der Haken aus, entfällt die Anfrage vollständig"
  - zweck: "Support- und Kontaktformular"
    ziel: "https://license.fehlerfuchs.eu/v1/contact"
    daten: >-
      Nur was der Nutzer eingibt: Nachricht (Pflicht), Name und E-Mail (optional), optionale
      Anhänge sowie – nur wenn der Nutzer das Häkchen setzt – eine vorher einsehbare
      Diagnosedatei mit nicht personenbezogenen Technikdaten (App-/Windows-/.NET-Version,
      Anzahl Regeln, Zählerstände, Fehlerlog-Auszug). Pfade, Dateinamen und Benutzername
      werden vor Anzeige und Versand bereinigt.
    haeufigkeit: "nur wenn der Nutzer „Senden“ drückt – nie automatisch, nie im Hintergrund"
    abschaltbar: "entfällt (rein nutzerinitiiert)"
    beleg: "Konzept v1.0 §7; Hausstandard KONZEPT_Support-Anbindung_Apps.md"
  - zweck: "Handy-Verbindung – verschlüsselter Dateitransfer zwischen gekoppeltem Handy und PC"
    ziel: "wss://dateiwaechter.relais.fehlerfuchs.eu/ws (inhaltsblinder Vermittlungsdienst) bzw. bei aktivem Direktweg direkt im lokalen Netz/über USB-Tethering, ohne Vermittlungsdienst"
    daten: >-
      Nur die Dateien, die der Nutzer ausdrücklich sendet/empfängt, plus die zugehörigen
      Protokoll-Metadaten (Dateiname, Größe, Prüfsumme). Übertragung ist Ende-zu-Ende
      verschlüsselt (AES-256-GCM, Ed25519-signiert); der Vermittlungsdienst ist inhaltsblind
      (sieht nur verschlüsselte Datenblöcke, keine Klartext-Inhalte). Kopplung erforderlich
      (QR + sechsstelliger Bestätigungscode); ohne Kopplung passiert nichts.
    haeufigkeit: "nur bei aktivem Empfang (standardmäßig AUS) bzw. wenn der Nutzer Dateien sendet – nie ohne Kopplung"
    abschaltbar: true
    beleg: "Spezifikation dateiwaechter-transfer-v1 (DWTP/1); Empfang Opt-in; Direktweg Opt-in; App v0.5.4"

fremde_dienste: []
  # Keine. Keine Cloud-Speicherung, keine Telemetrie, keine Analytics, keine Werbenetzwerke.
  # Der Vermittlungsdienst (Relaisserver, eigener FehlerFuchs-Dienst) ist inhaltsblind und speichert nichts dauerhaft.

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false      # keine automatischen; nur der nutzerinitiierte Support-Versand
daten_an_dritte_verkauft: false

loeschung: >-
  Es werden keine personenbezogenen Daten erhoben oder gespeichert. Konfiguration und
  Protokolldateien liegen lokal; der Deinstaller fragt, ob sie mit entfernt werden sollen
  (Vorgabe: behalten). Protokolle werden ohnehin nach 30 Tagen automatisch gelöscht. Die
  verschobenen Dateien sind die eigenen Dateien des Nutzers und bleiben beim Nutzer
  (nur lokal bzw. auf das eigene Netzlaufwerk verschoben).

besonderheiten: >-
  Kernversprechen: „Deine Dateien verlassen deinen Rechner nicht.“ Der Wächter verschiebt
  VERIFIZIERT (Copy → SHA256 Quelle==Ziel → erst dann Quelle löschen); bei Abweichung oder
  nicht erreichbarem Ziel bleibt die Quelle erhalten. Gelöscht wird bevorzugt in den
  Papierkorb. Das Aufräum-Modul löscht ausschließlich benutzer-level Kandidaten
  (Temp/Papierkorb/Caches) nach Analyse und Bestätigung, Whitelist-basiert, niemals
  Systempfade und niemals Nutzerdokumente. Keine Telemetrie – bewusst entschieden am
  08.08.2026. Die pauschale Aussage „keine Cloud, keine Telemetrie“ wird auf der Produktseite
  bewusst präzisiert, weil die abschaltbare Versionsprüfung eine Verbindung darstellt.
  Präzisierung zur Handy-Verbindung (seit v0.4): „Deine Dateien verlassen deinen Rechner nicht“
  gilt für den Wächter-/Aufräum-Betrieb; die Handy-Verbindung überträgt Dateien nur, wenn der
  Nutzer sie ausdrücklich koppelt und sendet/empfängt – dann Ende-zu-Ende verschlüsselt über einen
  inhaltsblinden Vermittlungsdienst oder direkt im lokalen Netz. Empfang und Direktweg sind Opt-in.

vorhandener_text: ""

offene_fragen: >-
  1) Feinabgleich der genauen Feldliste der Support-Diagnosedatei (Konzept §7) gegen die
  Implementierung ist erledigt; bei künftigen Änderungen hier nachziehen. 2) Der Handy-seitige
  Gegenpart (35-1_DateiWächterMobil, Slug „dateiwaechter-mobil“) führt einen eigenen
  Steckbrief; dort ist zusätzlich Google Play Billing (Pro-Einmalkauf) zu berücksichtigen –
  betrifft den PC-Steckbrief NICHT (auf dem PC kein Kauf, keine Lizenzprüfung).
