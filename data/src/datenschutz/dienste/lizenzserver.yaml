slug: lizenzserver
name: FehlerFuchs Lizenzserver
stand: "2026-10-03"
geprueft_von: 11_Lizenzserver
fassung: "Adapter-Stand 20.07.2026 (kein Versionsschema); Admin-API 1.0; mit Löschlauf, Wunscherfüller und Löschantrag (live seit 01.10.2026; Weg „nur E-Mail“ und Frist für Ereignis-Kennungen seit 03.10.2026)"

# Kein Endnutzer-Programm, sondern ein Server-Dienst. Daten verlassen das Gerät
# des Nutzers zwangsläufig, sobald eine App den Dienst anspricht.
lokal_only: false

# Was der DIENST dauerhaft auf dem Server speichert (Feldname laut Vorlage
# beibehalten; "Gerät" ist hier der Server).
auf_dem_geraet:
  - was: Lizenzdaten (Lizenzschlüssel, Lizenz-Kennung, Platzanzahl, Status, Laufzeit/Ablauf)
    wo: Lizenzdatenbank auf dem Server
    beleg: adapter/app/keygen_client.py, docker-compose.yml (Dienste keygen, postgres)
  - was: E-Mail-Adresse des Käufers und Bestellnummer, als Angaben zur Lizenz
    wo: Lizenzdatenbank auf dem Server
    beleg: adapter/app/main.py, Funktion digistore_license (metadata)
  - was: Geräte-/Aktivierungsdaten je belegtem Platz (Gerätekennung, Gerätename, Plattform, Zeitpunkte)
    wo: Lizenzdatenbank auf dem Server
    beleg: adapter/app/main.py, Funktion activate; adapter/app/keygen_client.py, activate_machine
  - was: vollständige Aufrufe des Zahlungsanbieters (enthalten Bestell- und Käuferangaben, u. a. E-Mail)
    wo: Datenbank auf dem Server; Löschung nach 90 Tagen
    beleg: Tabelle provider_requests; adapter/app/db.py, record_request und cleanup
  - was: Ereignis-Kennungen zum Schutz vor doppelter Verarbeitung (Bestellnummer, Ereignisart, Vorgangsnummer)
    wo: Datenbank auf dem Server; Löschung nach 90 Tagen, beim Löschantrag zur Lizenz sofort
    beleg: Tabelle provider_events; adapter/app/db.py, record_event, cleanup und dsgvo_interne_daten_loeschen
  - was: Beta-Tester-Registrierungen (Name, E-Mail, Kundenbereich, Freitext-Beschreibung, Einwilligung, Lizenzbezug, IP-Adresse, Zeitpunkt)
    wo: Datenbank auf dem Server; IP-Adresse nach 7 Tagen entfernt, übrige Angaben nach 90 Tagen gelöscht bzw. die E-Mail durch eine gesalzene Einweg-Kennung ersetzt (pseudonym, nicht anonym)
    beleg: Tabelle tester_registrations; adapter/app/db.py, record_tester und cleanup; adapter/app/main.py, tester_gewerbepro
  - was: intern beobachtete Lizenzschlüssel samt Melde-Adresse (Hinweis bei Freischaltung)
    wo: Datenbank auf dem Server
    beleg: Tabelle watched_keys; adapter/app/db.py, add_watch
  - was: Zustand des Tagesberichts (Zeitpunkt des letzten Laufs, Zähler)
    wo: Datenbank auf dem Server
    beleg: Tabelle report_state; adapter/app/db.py, set_last_run
  - was: Einsendungen aus dem Wunscherfüller (Titel, Wunschtext, Thema, ggf. betroffenes Produkt, Anzeigename; nur bei gewünschter Antwort zusätzlich Name und E-Mail-Adresse)
    wo: Datenbank auf dem Server; Löschung nach 90 Tagen. Es wird keine IP-Adresse gespeichert
    beleg: Tabelle wuensche; adapter/app/db.py, record_wunsch und cleanup; adapter/app/main.py, wunsch_einreichen
  - was: Teilnahme an der SnapFuchs-Aktion (selbst gewählter Anzeigename, E-Mail-Adresse, Zeitpunkt, der zugeteilte Gutscheincode)
    wo: Datenbank auf dem Server; nach 90 Tagen werden Anzeigename und E-Mail gelöscht — der Code bleibt nur noch als „vergeben“ vermerkt, ohne Bezug zu einer Person. Es wird keine IP-Adresse gespeichert
    beleg: Tabelle aktion_codes; adapter/app/db.py, aktion_code_vergeben und cleanup; adapter/app/main.py, aktion_code_anfordern
  - was: IP-Adressen als kurzlebige Zählwerte gegen Missbrauch (Kontaktformular, Wunscherfüller, Aktion, Tester-Registrierung, Löschantrag)
    wo: Zwischenspeicher auf dem Server, automatische Löschung nach 1 Stunde bzw. 24 Stunden
    beleg: Redis; adapter/app/mailer.py, rate_ok und tester_rate_ok; adapter/app/dsgvo.py, _rate_ok
  - was: offener Löschantrag (hinterlegte E-Mail-Adresse, Kennung der betroffenen Lizenz, zufällige Antragskennung; beim Weg „nur E-Mail“ die eingegebene Adresse, die Liste der gefundenen Daten und ggf. die Kennung einer Beta-Tester-Lizenz) — der eingegebene Lizenzschlüssel wird nie gespeichert
    wo: Zwischenspeicher auf dem Server, nie in der Datenbank; automatische Löschung nach 48 Stunden, beim Ersatzweg ohne Schlüssel (zusätzlich Bestellnummer) nach höchstens 30 Tagen
    beleg: Redis; adapter/app/dsgvo.py, _link_senden, _ersatz_vormerken und _antrag_nur_email
  - was: Protokoll der Löschanträge (nur Datum, Ergebnis und eine zufällige Antragskennung — keine E-Mail, kein Name, keine IP-Adresse, kein Schlüssel)
    wo: Datenbank auf dem Server; Löschung nach 3 Jahren
    beleg: Tabelle dsgvo_protokoll; adapter/app/db.py, dsgvo_protokoll und cleanup
  - was: nach einem Löschantrag gesperrte Lizenz (Lizenzschlüssel, Bestellnummer, Status „gesperrt“, ohne E-Mail-Adresse und ohne Namen) samt Vormerkung (Lizenz-Kennung, Produkt, Bestellnummer, Sperrfrist)
    wo: Lizenzdatenbank und Datenbank auf dem Server; gesperrt bis 31.12. des dritten Jahres nach dem Jahr der Löschung, danach automatisch gelöscht
    beleg: Tabellen dsgvo_sperren und dsgvo_lizenzen; adapter/app/dsgvo.py, _vollziehen und faellige_lizenzen_loeschen; adapter/app/cleanup.py

# Berechtigungen: entfällt — Server-Dienst, kein Manifest, keine Geräteberechtigungen.

# JEDE Verbindung. Eingehend = jemand ruft den Dienst auf; ausgehend = der Dienst ruft.
uebertragungen:
  - wohin: license.fehlerfuchs.eu (eingehend, von den FehlerFuchs-Apps)
    was: Lizenzschlüssel, Gerätekennung, optional Gerätename und Plattform
    wann: beim Freischalten, Prüfen und Abmelden einer Lizenz
    freiwillig: false
    beleg: adapter/app/main.py, Endpunkte /v1/activate, /v1/validate, /v1/deactivate
  - wohin: license.fehlerfuchs.eu (eingehend, vom Zahlungsanbieter)
    was: Bestell- und Käuferangaben des Kaufvorgangs (u. a. Bestellnummer, E-Mail, Produkt/Variante)
    wann: beim Kauf und bei Lebenszyklus-Ereignissen (z. B. Rückerstattung)
    freiwillig: false
    beleg: adapter/app/main.py, Endpunkte /v1/providers/digistore24/license und /ipn
  - wohin: license.fehlerfuchs.eu (eingehend, von der Website und aus den FehlerFuchs-Apps)
    was: Kontakt-/Supportanfragen (Name, E-Mail, Betreff, Nachricht, optionale Anhänge)
    wann: wenn ein Kontakt- oder Supportformular abgeschickt wird — auf der Website oder in einer App
    freiwillig: true
    beleg: adapter/app/main.py, Endpunkt /v1/contact; Aufrufer gemessen am 26.09.2026 per git grep - Website (Anfrageformular.astro) und die Kontakt-/Supportdienste von MobileReport, SnapFuchs, OrgaFuchs, PDFuchs, PDFuchs Reader, BelegWerk, CheckInVita, Up2Date und DateiWächter
  - wohin: license.fehlerfuchs.eu (eingehend, von der Website)
    was: Beta-Tester-Registrierung (GewerbePro) — seit 17.08.2026 geschlossen, der Endpunkt nimmt keine Angaben mehr an
    wann: —
    freiwillig: true
    beleg: adapter/app/main.py, Endpunkt /v1/providers/tester/gewerbepro; adapter/app/config.py, gewerbepro_tester_open = False
  - wohin: license.fehlerfuchs.eu (eingehend, von der Website)
    was: Einsendungen aus dem Wunscherfüller (Titel, Wunschtext, Thema, ggf. Produkt, Anzeigename; auf Wunsch Name und E-Mail für die Antwort)
    wann: wenn das Wunsch-Formular abgeschickt wird
    freiwillig: true
    beleg: adapter/app/main.py, Endpunkt /v1/wuensche
  - wohin: license.fehlerfuchs.eu (eingehend, von der Website)
    was: Teilnahme an der SnapFuchs-Aktion (Anzeigename, E-Mail-Adresse, angeklickte Antwort). Der Gutscheincode selbst wird ausschließlich per E-Mail zugestellt und nie an den Browser zurückgegeben
    wann: wenn das Aktionsformular abgeschickt wird
    freiwillig: true
    beleg: adapter/app/main.py, Endpunkt /v1/aktion/snapfuchs
  - wohin: license.fehlerfuchs.eu (eingehend, von der Website)
    was: Löschantrag — E-Mail-Adresse und Lizenzschlüssel (der Schlüssel dient nur dem Zuordnen und wird nie gespeichert, protokolliert oder gemailt); ohne Schlüssel ersatzweise E-Mail-Adresse und Bestellnummer; beim Weg „nur E-Mail“ allein die E-Mail-Adresse
    wann: wenn das Löschformular abgeschickt wird; die Bestätigung erfolgt über einen Link an die beim Kauf hinterlegte Adresse, beim Weg „nur E-Mail“ an genau die eingegebene Adresse
    freiwillig: true
    beleg: adapter/app/dsgvo.py, Endpunkte /v1/dsgvo/loeschantrag, /v1/dsgvo/bestaetigen, /v1/dsgvo/freigabe
  - wohin: Website (ausgehend, öffentlich abrufbar)
    was: ausschließlich das Eingangsdatum noch nicht bearbeiteter Wunsch-Einsendungen — kein Titel, kein Text, kein Anzeigename
    wann: beim Aufruf der Wunscherfüller-Seite
    freiwillig: false
    beleg: adapter/app/main.py, Endpunkt /v1/wuensche (Abfrage); adapter/app/db.py, offene_wuensche
  - wohin: Website (ausgehend, öffentlich abrufbar)
    was: ausschließlich der Stand der Aktion (angekündigte und noch freie Codes, ggf. Enddatum) — keine Angaben zu Personen
    wann: beim Aufruf der Aktionsseite
    freiwillig: false
    beleg: adapter/app/main.py, Endpunkt /v1/aktion/snapfuchs/stand; 10_WEBSEITE astro/src/pages/aktion/[id].astro (standHolen)
  - wohin: E-Mail-Versand über den Postfachanbieter (SMTP)
    was: Inhalt und Empfänger der versendeten Nachrichten (Lizenz-/Willkommensmails, Kontakt-/Supportanfragen inkl. Anhänge, Wunsch-Einsendungen, interne Statusberichte, Bestätigungslink und Löschbestätigung an die hinterlegte bzw. beim Weg „nur E-Mail“ an die eingegebene Adresse, Meldungen zum Löschantrag an den Betreiber ohne E-Mail-Adresse)
    wann: bei jedem Mailversand des Dienstes
    freiwillig: false
    beleg: adapter/app/mailer.py (aiosmtplib), adapter/requirements.txt
  - wohin: keine weiteren ausgehenden Verbindungen
    was: keine Update-Prüfung, keine Statistik, keine Schriften/Skripte aus fremden Netzen
    wann: —
    freiwillig: false
    beleg: adapter/requirements.txt; die Lizenzsoftware (Keygen CE) läuft im selben Compose-Netz auf demselben Server (docker-compose.yml)

# Fremde Stellen, die selbst Daten sehen.
fremde_dienste:
  - name: Digistore24 (Zahlungsabwicklung, Merchant of Record)
    wofuer: Verkauf der Lizenzen; übermittelt Bestell- und Käuferangaben an den Lizenzserver
    wann: beim Kauf und bei Lebenszyklus-Ereignissen
  - name: Postfach-/SMTP-Anbieter (IONOS)
    wofuer: Versand aller E-Mails des Dienstes
    wann: bei jedem Mailversand
  # Intern, nicht zur Veröffentlichung: Tarif IONOS VPS Linux M+, Host license.fehlerfuchs.eu,
  # der Server wird von FehlerFuchs selbst betrieben. Stand des AVV siehe offene_fragen (1).
  - name: IONOS SE (Hosting, virtueller Server) — Elgendorfer Straße 57, 56410 Montabaur, Deutschland
    wofuer: Betrieb des Servers, auf dem alle genannten Daten liegen; Standort Deutschland (EWR), keine Drittlandübermittlung
    wann: dauerhaft
  - name: Keygen CE — KEIN fremder Dienst
    wofuer: Lizenzverwaltung; selbst betriebene Software auf dem eigenen Server, es gehen keine Daten an den Hersteller
    wann: —

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false
daten_an_dritte_verkauft: false

loeschung: >-
  Ein täglicher Aufräumlauf setzt feste Fristen um. Die Roh-Aufrufe des
  Zahlungsanbieters werden nach 90 Tagen endgültig gelöscht, ebenso die Ereignis-Kennungen
  (Bestellnummer, Ereignisart, Vorgangsnummer). Bei Tester-Registrierungen
  wird die IP-Adresse bereits nach 7 Tagen entfernt; nach 90 Tagen werden Name,
  Kundenbereich, Freitext und der Bezug zur Lizenz gelöscht und die E-Mail-Adresse durch
  eine gesalzene Einweg-Kennung ersetzt. Das Salz ist ein Zufallsgeheimnis, das
  ausschließlich auf dem Server liegt; ohne dieses Geheimnis ist die Kennung nicht
  zurückrechenbar. Es handelt sich damit um eine Pseudonymisierung, nicht um eine
  Anonymisierung — die Sperre gegen doppelte Gratislizenzen funktioniert weiter.
  Einsendungen aus dem Wunscherfüller werden nach 90 Tagen gelöscht; bei der Teilnahme
  an Aktionen werden Anzeigename und E-Mail-Adresse 90 Tage nach der Vergabe entfernt,
  der Code bleibt nur noch als „vergeben“ vermerkt. Die
  Zählschlüssel mit IP-Adressen im Zwischenspeicher löschen sich selbst nach längstens
  24 Stunden. Die Betriebsprotokolle des Servers sind auf höchstens drei Dateien à 10 MB
  je Dienst begrenzt und werden danach überschrieben; sie enthalten keine
  Besucher-IP-Adressen (geprüft am laufenden System). Lizenzdaten und Geräte-/Aktivierungseinträge bleiben
  bestehen, solange die Lizenz gilt — sonst würde das Produkt nicht mehr funktionieren;
  sie lassen sich jederzeit gezielt endgültig löschen, einzelne Plätze auch freigeben.
  Auf Antrag (Löschformular der Website, bestätigt über einen Link an die beim Kauf
  hinterlegte Adresse) werden E-Mail-Adresse und alle Geräteaktivierungen der Lizenz
  gelöscht; die Lizenz wird gesperrt und bleibt nur noch mit Schlüssel und Bestellnummer
  bis zum Ende der Regelverjährung (31.12. des dritten Jahres nach dem Jahr der
  Löschung) gespeichert, danach wird sie automatisch gelöscht. Roh-Aufrufe und
  Ereignis-Kennungen zu dieser Adresse bzw. den Bestellnummern der Lizenz werden dabei
  sofort mit gelöscht. Ohne Lizenzschlüssel gibt es den Weg „nur E-Mail“: Der
  Bestätigungslink geht an genau die eingegebene Adresse; nach Bestätigung werden
  Tester-Eintrag, Wunsch-Einsendungen und Roh-Aufrufe des Zahlungsanbieters zu dieser
  Adresse gelöscht und bei Aktionen Anzeigename und E-Mail-Adresse entfernt. Eine
  Beta-Tester-Lizenz dieser Adresse wird wie oben gesperrt; gekaufte Lizenzen bleiben auf
  diesem Weg unberührt (dafür gilt der Weg mit Schlüssel oder Bestellnummer). Das Antragsprotokoll
  (Datum, Ergebnis, zufällige Kennung) wird nach 3 Jahren gelöscht. Die
  Lizenzsoftware führt keine eigenen Protokolle mit E-Mail-Adressen (gemessen am
  01.10.2026: Anfrage- und Ereignisprotokoll leer, keine Adressen in den
  Betriebsprotokollen der Dienste).

besonderheiten: >-
  Der Lizenzserver ist ein Hintergrunddienst, kein Programm für Endnutzer.
  Die Lizenzierung kommt ohne Benutzerkonto aus: Es genügen ein
  Lizenzschlüssel und eine Gerätekennung, Namen sind nicht erforderlich. Für den
  Betrieb ohne Netz gibt der Dienst ein signiertes Offline-Zeugnis an die App zurück,
  das Lizenzschlüssel, Gerätekennung, Status und Platzanzahl enthält und auf dem Gerät
  verbleibt. Angaben aus dem Kontakt- und Supportformular werden nicht in der Datenbank
  gespeichert, sondern ausschließlich per E-Mail weitergeleitet; lediglich die
  IP-Adresse fließt kurzzeitig in die Missbrauchsbremse ein. Der Zugriff auf die
  Verwaltungsschnittstelle ist durch ein Zugangsgeheimnis geschützt, das nur auf dem
  Server liegt. Einsendungen aus dem Wunscherfüller werden vom Server niemals im Wortlaut
  herausgegeben: Öffentlich abrufbar ist allein das Eingangsdatum, damit die Seite einen
  verdeckten Platzhalter anzeigen kann. Im Wortlaut sind Einsendungen ausschließlich über
  die durch ein Zugangsgeheimnis geschützte Verwaltung abrufbar. Ob ein Wunsch veröffentlicht wird, entscheidet ein
  Mensch, und der Text wird dafür von Hand übertragen — der Server veröffentlicht nichts
  selbsttätig. Wichtig zur Einordnung der Fristen: Die Pseudonymisierung nach 90 Tagen
  betrifft die Tester-Registrierung. E-Mail-Adresse und Bestellnummer, die als
  Metadaten an der Lizenz selbst hängen, bleiben davon unberührt, solange die Lizenz
  besteht — Lizenzdaten sind von der Fristenlöschung ausdrücklich ausgenommen. Auf
  Antrag werden sie dagegen gelöscht bzw. gesperrt (siehe oben unter Löschung). Ohne Bestätigung
  über den Link (an die hinterlegte bzw. beim Weg „nur E-Mail“ an die eingegebene Adresse)
  wird nichts gelöscht; eine gesperrte Lizenz
  wird nie wieder entsperrt, auch nicht durch eine spätere Zahlungsmeldung.

