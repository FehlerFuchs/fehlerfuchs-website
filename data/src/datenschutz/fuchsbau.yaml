slug: fuchsbau
name: FuchsBau Passwortmanager
stand: "2026-09-25"
geprueft_von: 25_FuchsBau
fassung: "0.6.2+17 (Entwicklungsstand, noch nicht veröffentlicht)"

# Die App fordert in der Veröffentlichungsfassung keine Internet-Berechtigung an
# und ruft im Code nirgends Netzwerkfunktionen auf.
lokal_only: true

auf_dem_geraet:
  - was: Tresor-Einträge (Titel und Passwort, optional Benutzername, URL, Kategorie, Notiz)
    wo: verschlüsselt im geschützten Speicher des Geräts
    beleg: lib/data/secure_vault_repository.dart (flutter_secure_storage,
      Schluessel "fuchsbau_vault_v1")
  - was: Prüfsummen von Tresor-PIN, Tresor-Passwort und Offline-Sicherheitsschlüssel;
      die eingegebenen Werte selbst werden nicht gespeichert
    wo: verschlüsselt im geschützten Speicher des Geräts
    beleg: lib/core/security/pin_service.dart; lib/core/security/password_service.dart;
      lib/core/security/security_key_service.dart (Argon2id-Hash + Salt)
  - was: Auswahl der aktiven Entsperr-Faktoren
    wo: verschlüsselt im geschützten Speicher des Geräts
    beleg: lib/core/security/unlock_config.dart (Schluessel "fuchsbau_unlock_cfg")
  - was: Einstellungen (Hell/Dunkel/System, Merker für die Einführung beim ersten Start,
      selbst ergänzte Wörter für den Passphrasen-Generator)
    wo: verschlüsselt im geschützten Speicher des Geräts
    beleg: lib/core/theme/theme_controller.dart; lib/core/onboarding/onboarding_controller.dart;
      lib/domain/wordlist/custom_words_controller.dart
  - was: Mitgelieferte deutsche Wortliste für Passphrasen (7855 Wörter, keine Nutzerdaten)
    wo: Bestandteil der App
    beleg: assets/wordlists/de_words.txt

berechtigungen:
  - name: Biometrie
    wofuer: Entsperren per Fingerabdruck oder Gesicht, wenn der Nutzer diesen Faktor
      aktiviert; die App fordert dabei ausschließlich Biometrie an, keinen Ersatz durch
      Geräte-PIN oder Systemmuster. Ohne Biometrie sind zwei andere Faktoren erforderlich.
    pflicht: false
    beleg: android/app/src/main/AndroidManifest.xml (USE_BIOMETRIC)
  - name: Internet
    wofuer: wird in der Veröffentlichungsfassung nicht angefordert und nicht genutzt.
      Die App kann von sich aus nichts senden und nichts abrufen.
    pflicht: false
    beleg: android/app/src/main/AndroidManifest.xml enthaelt kein INTERNET; der Eintrag
      steht nur in android/app/src/debug/AndroidManifest.xml und
      android/app/src/profile/AndroidManifest.xml (Flutter-Standardvorlage fuer
      Entwicklerwerkzeuge, nicht Teil des Release-Builds)

# Die App baut selbst KEINE Netzwerkverbindungen auf. Aufgeführt sind Übergaben an
# das System bzw. an andere Apps, die der Nutzer ausdrücklich selbst auslöst.
uebertragungen:
  - wohin: vom Nutzer gewählter Android-Druckdienst
    was: PDF mit dem Offline-Sicherheitsschlüssel
    wann: nur wenn der Nutzer den Sicherheitsschlüssel drucken bzw. als PDF sichern wählt
    freiwillig: true
    beleg: lib/features/security_key/security_key_show_screen.dart (Printing.layoutPdf)
  - wohin: Zwischenablage des Geräts (systemweit, grundsätzlich für andere Apps lesbar)
    was: ein einzelnes Passwort oder der verschlüsselte Backup-Text
    wann: nur wenn der Nutzer "Kopieren" wählt; Passwörter werden nach 30 Sekunden,
      Backup-Texte nach 2 Minuten gelöscht. Inzwischen veränderter fremder Inhalt bleibt erhalten.
    freiwillig: true
    beleg: lib/core/security/clipboard_service.dart; lib/features/backup/backup_screen.dart

# Keine fremden Dienste eingebunden: keine Analyse-, Werbe- oder Absturzdienste,
# kein Google Play Billing, keine Inhalte oder Schriften aus dem Netz.
fremde_dienste: []

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false
daten_an_dritte_verkauft: false

loeschung: >-
  Alle Daten liegen im verschlüsselten Speicher des Geräts. Sie verschwinden beim
  Deinstallieren der App oder beim Löschen der App-Daten. Einzelne Einträge lassen sich
  in der App löschen. Eine vom Nutzer selbst erzeugte Sicherung liegt dort, wohin er sie
  gelegt hat, und muss dort selbst gelöscht werden.

besonderheiten: >-
  FuchsBau arbeitet ausschließlich auf dem Gerät: kein Konto, keine Anmeldung, keine
  Verbindung nach draußen. Passwörter und Notizen liegen verschlüsselt im geschützten
  Speicher des Geräts. PIN, Tresor-Passwort und Sicherheitsschlüssel werden nie im
  Klartext gespeichert, sondern nur als Prüfsumme, aus der sich der eingegebene Wert
  nicht zurückrechnen lässt. Der Tresor verlangt mindestens zwei Faktoren; einzelne
  Einträge lassen sich zusätzlich mit einem Offline-Sicherheitsschlüssel schützen, der
  genau einmal angezeigt wird und danach nicht wiederherstellbar ist. In der
  Veröffentlichungsfassung sind Bildschirmfotos und das Vorschaubild in der
  App-Übersicht unterbunden. Eine Sicherung ist ein Text, den der Nutzer mit einer
  selbst gewählten Passphrase verschlüsselt; ohne diese Passphrase ist sie für
  niemanden lesbar, auch nicht für FehlerFuchs.

vorhandener_text: >-
  Noch keiner. In der App gibt es bislang weder einen Datenschutz- noch einen
  Impressumstext; eine Muster-Vorlage liegt projektintern bereit, ist aber nicht eingebunden.

offene_fragen: >-
  1) Ob der verschlüsselte Speicher auf einem konkreten Gerät hardwaregestützt
  abgesichert ist, hängt vom Gerät und der Android-Fassung ab und lässt sich aus der
  App heraus nicht zusichern.
  2) Was der vom Nutzer gewählte Android-Druckdienst mit dem PDF des Sicherheitsschlüssels
  macht, liegt außerhalb der App - es kann auch ein Netzwerk- oder Cloud-Druckdienst sein.
  3) Die App ist noch nicht veröffentlicht; eine Verteilung über Google Play ist geplant.
  Was Google im Zuge der Verteilung selbst erhebt, ist hier nicht abgebildet und muss vor
  der Veröffentlichung ergänzt werden.
  4) Ein In-App-Datenschutz- und Impressumstext fehlt noch und muss vor der
  Veröffentlichung ergänzt werden.
