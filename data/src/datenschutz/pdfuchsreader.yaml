slug: pdfuchsreader
name: PDFuchs Reader
stand: "2026-11-06"
geprueft_von: >-
  26_PDFuchs (Slug-Eigentümer seit 18.08.2026). Windows-Teil am 06.11.2026
  entfernt (Auftrag [FF_00], Befund 2 der Webseiten-Sichtung, LogBuch #9228):
  Unter Windows gibt es seit 20.10.2026 kein eigenes Reader-Programm mehr, die
  Nutzungsbedingungen nennen nur Android. Der Steckbrief beschreibt jetzt allein
  die Android-App.
fassung: >-
  Android-Fassung 1.3.1 (versionCode 7, Paket eu.fehlerfuchs.pdfuchsreader):
  seit 20.10.2026 21:31 in Google Play veröffentlicht, voller Rollout (Meldung
  [FF_13] nach P5). Vorher im Emulator, auf einem Fire HD 10 und einem
  Galaxy S8+ geprüft. Geprüft am aktuellen Code und Manifest. 1.3.1 ändert am
  Datenfluss und an den Berechtigungen nichts: Das Manifest ist gegenüber 1.3.0
  unverändert (nur INTERNET). Neu sind zwei Fehlerbehebungen (E-Book-Kapiteltext
  ohne den Titel aus dem HTML-Kopf; „Seiten bearbeiten“ setzt die Kopie aus den
  gewählten Seiten zusammen, gelöschte Seiten fehlen jetzt zuverlässig) und die
  aktualisierte PDF-Bibliothek pdfrx 2.6.5 mit PDFium (lokal, ohne Netz). Der
  Datenschutztext in der App ist unverändert (nach den sechs Fragen, A-11.6,
  von Matthias bestätigt, P10, 30.09.2026; Stand September 2026).

# Ohne Zutun des Nutzers verlässt kein Datum das Gerät. Die App ist offline voll
# benutzbar; jede Verbindung nach draußen ist nutzerinitiiert.
# Es gibt genau einen nutzerinitiierten Weg nach draußen:
# das Support-/Kontaktformular (nur beim Absenden) + das Öffnen externer Links.
# Deshalb lokal_only: false (Haus-Konvention, analog DateiWächter/HaushaltsManager) -
# die einzige Außenverbindung ist nutzerinitiiert; ohne Absenden passiert nichts.
lokal_only: false

auf_dem_geraet:
  - was: Liste „Zuletzt geöffnet“ (Dateipfad, Dateiname, Öffnungsdatum)
    wo: im Einstellungsspeicher der App auf dem Gerät
    beleg: 05_App/pdfuchsreader_mobile/lib/core/recent/recent_store.dart
  - was: Einstellung Anzeigemodus (Hell/Dunkel/System)
    wo: im Einstellungsspeicher der App auf dem Gerät
    beleg: 05_App/pdfuchsreader_mobile/lib/features/settings/settings_controller.dart
  - was: Kopie des mitgelieferten Handbuch-PDFs + einmaliges Onboarding-Kennzeichen
    wo: Dokumentenordner der App
    beleg: 05_App/pdfuchsreader_mobile/lib/core/onboarding/handbook_seeder.dart
  - was: Vom Nutzer erzeugte bearbeitete PDF-Kopien (<name>_bearbeitet[_N].pdf)
    wo: Dokumentenordner der App; Originale und vorhandene Kopien werden nie überschrieben
    beleg: 05_App/pdfuchsreader_mobile/lib/features/editor/seiten_editor_screen.dart; lib/features/editor/seiten_zusammenstellen.dart
  - was: Per „Öffnen mit“/Teilen hereingereichte PDFs und EPUBs (größenbegrenzte Arbeitskopie)
    wo: Zwischenspeicher (Cache) der App
    beleg: 05_App/pdfuchsreader_mobile/android/app/src/main/kotlin/eu/fehlerfuchs/pdfuchsreader/MainActivity.kt (kopiereNachCache)
  - was: Eigene Lesezeichen (Seite beziehungsweise Kapitel je Dokument) und Wiederleseposition
    wo: im Einstellungsspeicher der App auf dem Gerät
    beleg: 05_App/pdfuchsreader_mobile/lib/core/marken/marken_store.dart; lib/core/recent/recent_store.dart

berechtigungen:
  - name: INTERNET (Android)
    wofuer: Ausschließlich nutzerinitiierter Versand des Support-/Kontaktformulars und Öffnen externer Links
    pflicht: false
    beleg: 05_App/pdfuchsreader_mobile/android/app/src/main/AndroidManifest.xml (Zeile 5); im gemergten Manifest des Release-AAB bestätigt
  - name: App-interne Systemberechtigung (Android)
    wofuer: >-
      Eine rein app-interne Berechtigung, die das System beim Erstellen der App
      automatisch anlegt. Sie erlaubt keinen Zugriff auf Daten des Nutzers.
    pflicht: true
    beleg: >-
      Technischer Name eu.fehlerfuchs.pdfuchsreader.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION,
      von AndroidX erzeugt; ausgelesen aus
      build/app/intermediates/bundle_manifest/release/.../AndroidManifest.xml
  - name: (Android – keine weiteren)
    wofuer: >-
      Die App fordert keine weiteren Berechtigungen an – insbesondere keinen
      Zugriff auf Speicher, Kamera, Standort, Kontakte oder Mikrofon.
    pflicht: false
    beleg: >-
      Release-Manifest von 1.0.0 vollständig ausgelesen; aktuelles Manifest und
      Abhängigkeiten statisch geprüft. Für 1.3.1 gegen 1.3.0 verglichen
      (22.10.2026): Manifest unverändert; [FF_13] bestätigte im AAB 1.3.1 (7)
      dieselben zwei Einträge (INTERNET und die AndroidX-Schutzberechtigung). Sie enthalten weiterhin keine fachliche
      Berechtigung außer INTERNET. Das ungenutzte Paket permission_handler ist
      seit 07.08.2026 entfernt.

uebertragungen:
  - wohin: license.fehlerfuchs.eu
    was: >-
      Nachrichtentext, freiwillig Name und E-Mail-Adresse, Ziel (Support/Kontakt),
      Betreff, Thema, App-Name, Edition „Free“, App-Version, Android-Version,
      Gerätehersteller und Modell. Keine Dateianhänge – das dafür vorgesehene
      Feld wird vom Support-Formular nicht befüllt.
    wann: Nur wenn der Nutzer das Support-/Kontaktformular ausfüllt und „Senden“ drückt
    freiwillig: true
    beleg: 05_App/pdfuchsreader_mobile/lib/core/kontakt/kontakt_service.dart (Zeile 19, 37-56) und lib/core/kontakt/kontext.dart
  - wohin: E-Mail-App des Nutzers (mailto an support@ bzw. info@fehlerfuchs.eu)
    was: Betreff und Nachrichtentext als vorausgefüllte E-Mail
    wann: Nur als Ausweichweg, wenn der Versand oben fehlschlägt; der Nutzer muss die Mail selbst abschicken
    freiwillig: true
    beleg: 05_App/pdfuchsreader_mobile/lib/features/support/support_screen.dart (Zeile 95)
  - wohin: fehlerfuchs.eu (Seiten /unterstuetzen/, /impressum/, /kontakt/, /datenschutz/)
    was: Normaler Seitenaufruf im externen Browser; die App selbst sendet dabei keine Inhalte
    wann: Nur wenn der Nutzer den jeweiligen Verweis antippt
    freiwillig: true
    beleg: lib/features/home/support_dialog.dart (Zeile 7), lib/features/legal/impressum_screen.dart (Zeile 65, 71), lib/features/legal/datenschutz_screen.dart (Zeile 136)
  - wohin: Vom Nutzer gewählte fremde App bzw. Android-Druckdienst
    was: Die geöffnete PDF-Datei
    wann: Nur wenn der Nutzer „Teilen“ oder „Drucken“ auslöst; wohin sie geht, bestimmt der Nutzer
    freiwillig: true
    beleg: 05_App/pdfuchsreader_mobile/lib/features/viewer/viewer_screen.dart (Zeile 53, 62)

fremde_dienste:
  - name: PDFium (über die Bibliothek pdfrx)
    wofuer: Darstellung, Textsuche und verlustfreies Speichern der PDF-Seiten
    wann: Ausschließlich lokal auf dem Gerät, ohne Netzverbindung
  - name: Android-Teilen- und Druck-Framework
    wofuer: Weitergabe bzw. Ausdruck einer PDF-Datei
    wann: Nur auf Auslösung durch den Nutzer

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false
daten_an_dritte_verkauft: false

loeschung: >-
  Alle Daten liegen auf dem Gerät. Einträge der Liste „Zuletzt
  geöffnet“ lassen sich einzeln entfernen oder komplett leeren. Beim
  Deinstallieren verschwinden App-Einstellungen, Zuletzt-Liste, Handbuch-Kopie,
  Lesezeichen, Wiederlesepositionen, im App-Ordner erzeugte bearbeitete Kopien
  und der Zwischenspeicher. Die eigenen Dokumente des Nutzers bleiben
  unangetastet – Originale werden nie überschrieben.

besonderheiten: >-
  Die App ist offline voll benutzbar; ohne Zutun des Nutzers entsteht
  keine Verbindung nach draußen und keine automatische Update-Prüfung. Es gibt
  kein Konto, keine Anmeldung, keine Werbung, keine Nutzungsmessung und keine
  In-App-Käufe. Eine Verbindung entsteht nur, wenn der
  Nutzer sie selbst auslöst – vor allem beim Absenden des
  Support-/Kontaktformulars (an license.fehlerfuchs.eu) sowie beim Öffnen externer Links.
  Bearbeitete PDF-Dateien werden immer als neue Kopie gespeichert, die
  Ursprungsdatei bleibt unverändert. Die App wird über Google Play
  vertrieben; Google erhält dabei die üblichen Installations- und Kontodaten des
  Store-Vorgangs, worauf die App selbst keinen Einfluss hat.

vorhandener_text: >-
  Android: 05_App/pdfuchsreader_mobile/lib/features/legal/datenschutz_screen.dart
  (Datenschutztext in der App nach den sechs Fragen, verweist auf
  https://fehlerfuchs.eu/datenschutz/).

offene_fragen: >-
  1. (erledigt) Der Slug „pdfuchsreader“ gehört [26] PDFuchs. Die frühere
  Windows-Fassung ist seit 20.10.2026 entfallen, der Slug beschreibt nur noch
  die Android-App.
  2. (geklärt, Beleg [11] Lizenzserver via [26-1], 23.08.2026) Der Kontakt-Endpunkt
  /v1/contact auf license.fehlerfuchs.eu speichert den Nachrichteninhalt NICHT in der
  Datenbank; die IP dient nur als kurzlebiger Redis-Schlüssel der Missbrauchsbremse
  (Stunde/Tag), es wird kein User-Agent übernommen, und bei Erfolg protokolliert der
  Dienst weder Anfrageinhalt noch IP. Offen bleibt allein die Aufbewahrung im
  E-Mail-Postfach, an das der Supportinhalt weitergeleitet wird – sie richtet sich
  nach dem Postfach.
  3. (erledigt) Das ungenutzte Paket permission_handler wurde mit Version 1.0.1
  (07.08.2026) entfernt; es hatte ohnehin keine Datenschutzwirkung.
  4. (entfallen am 06.11.2026) Die früheren Fragen zur Windows-Fassung
  (Netzverhalten der mitgelieferten Tesseract-Binary, Zähler in
  license_state.json) betrafen nur die Windows-Fassung und gelten nicht mehr.
