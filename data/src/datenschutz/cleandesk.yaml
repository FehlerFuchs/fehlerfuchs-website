slug: cleandesk
name: FehlerFuchs CleanDesk
stand: "2026-09-25"
geprueft_von: 24_CleanDesk (Codex-Reparatur)
fassung: "0.2.0 (csproj) – Entwicklungsstand, noch nicht veröffentlicht"

# Windows-Desktop-Anwendung (.NET 8 / WPF, net8.0-windows). Im gesamten
# Quellcode gibt es keinen einzigen Netzwerkaufruf; die csproj enthaelt
# keinen einzigen PackageReference (keine Fremdpakete).
lokal_only: true

auf_dem_geraet:
  - was: Einstellungen (zu prüfende Ordner, Grenzwerte für groß und alt, max. Hash-Größe)
    wo: '%LOCALAPPDATA%\FehlerFuchs\CleanDesk\settings.json'
    beleg: src/CleanDesk/Services/Settings.cs (DataDir, SettingsPath)
  - was: eigene Sortier-Regeln (Dateiendung -> Zielordner)
    wo: '%LOCALAPPDATA%\FehlerFuchs\CleanDesk\sortierregeln.json'
    beleg: src/CleanDesk/Services/RulesStore.cs
  - was: Berichte über die Funde; enthalten Dateinamen, vollständige Pfade,
      Größen, Änderungsdaten und SHA-256-Prüfsummen der Dateien des Nutzers
    wo: '%LOCALAPPDATA%\FehlerFuchs\CleanDesk\berichte\ (TXT, CSV, JSON)'
    beleg: src/CleanDesk/Services/ReportWriter.cs
  - was: Protokoll der ausgeführten Aktionen (Quell- und Zielpfade beim Sortieren,
      Papierkorb-Aktionen)
    wo: '%LOCALAPPDATA%\FehlerFuchs\CleanDesk\logs\ (JSONL und TXT)'
    beleg: src/CleanDesk/Safety/Protocol.cs
  - was: beim Sortieren erzeugte Kopien der Dateien; die Originale wandern in den
      Windows-Papierkorb
    wo: vom Nutzer gewählter Zielordner bzw. Windows-Papierkorb
    beleg: src/CleanDesk/Safety/SafeMover.cs, src/CleanDesk/Safety/RecycleBin.cs

# Windows-Desktop-Anwendung ohne Manifest-Berechtigungen (kein Android-Manifest).
# Kein <ApplicationManifest> mit Elevation in der csproj; laeuft ohne Administratorrechte.
berechtigungen:
  - name: Lesezugriff auf die vom Nutzer gewählten Ordner
    wofuer: Scan nach echten Duplikaten (Größen-Vorfilter, dann SHA-256), großen
      und alten Dateien sowie leeren Ordnern
    pflicht: true
    beleg: src/CleanDesk/Core/Scanner.cs, src/CleanDesk/Core/DuplicateFinder.cs
  - name: Schreiben und Verschieben in den Papierkorb in den gewählten Ordnern
    wofuer: Sortieren (kopieren) und Duplikate in den Papierkorb – ausschließlich
      nach ausdrücklicher Bestätigung im Dialog
    pflicht: false
    beleg: src/CleanDesk/Safety/SafeMover.cs, src/CleanDesk/Safety/RecycleBin.cs

# Keine Uebertragung nach draussen.
# Beleg: kein HttpClient/WebClient/WebRequest/Socket/System.Net und keine URL im
# gesamten Quellcode (geprueft ueber src/CleanDesk/**/*.cs und *.xaml).
# Process.Start wird nur lokal verwendet: explorer.exe auf den Berichtsordner und
# Oeffnen einer lokalen Berichtsdatei (Beleg: src/CleanDesk/Views/ReportsView.xaml.cs).
uebertragungen: []

# Keine fremden Dienste oder Bibliotheken.
# Beleg: csproj ohne PackageReference; genutzt wird nur die .NET-8-Windows-Desktop-
# Laufzeit inkl. Microsoft.VisualBasic.FileIO fuer den Windows-Papierkorb
# (src/CleanDesk/Safety/RecycleBin.cs).
fremde_dienste: []

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false
daten_an_dritte_verkauft: false

loeschung: >-
  Alle Daten liegen auf dem Gerät. Berichte und Protokolle lassen sich einzeln
  löschen; der gesamte App-Datenordner %LOCALAPPDATA%\FehlerFuchs\CleanDesk kann
  jederzeit von Hand entfernt werden. Dateien, die CleanDesk in den Papierkorb
  verschoben hat, lassen sich über den Windows-Papierkorb wiederherstellen oder
  dort endgültig löschen.

besonderheiten: >-
  Der Scan ist reine Analyse und verändert nichts. Verändernde Aktionen laufen nur
  nach Bestätigung und ausschließlich über den Papierkorb; endgültiges Löschen
  gibt es in diesem Stand nicht. Verschoben wird immer in drei Schritten: Die Datei
  wird zuerst an den Zielort kopiert, die Kopie wird über Größe und Prüfsumme mit
  dem Original verglichen, und erst danach wandert das Original in den Papierkorb.
  Bei Namensgleichheit wird umbenannt, nie überschrieben. Geschützte Bereiche des
  Betriebssystems und der Programme sowie versteckte Anwendungsdaten werden nicht
  gelesen; Laufwerkswurzeln und Verknüpfungen auf andere Orte werden nicht verfolgt.
  Eigene Sortierregeln können nur einzelne Unterordnernamen erzeugen. Vor dem
  Papierkorb prüft CleanDesk Kandidat und Behalten-Datei erneut gegen denselben
  SHA-256 aus dem Scan; fehlt oder ändert sich eine der Dateien, wird abgebrochen.
  Schreibende Dateiaktionen werden auch abgebrochen, wenn ihr vorheriger
  Protokolleintrag nicht geschrieben werden kann.
  Datenschutzrelevant: Berichte und Protokolle enthalten vollständige Dateipfade und
  Dateinamen des Nutzers und können dadurch personenbezogene Angaben in Pfadnamen
  enthalten; sie verbleiben lokal und werden nicht versendet.

vorhandener_text: src/CleanDesk/Views/InfoView.xaml (Seite „Info / Datenschutz“ in der App)

offene_fragen: >-
  1) Die Anwendung ist nicht veröffentlicht und besitzt keine Installations- oder
  Update-Funktion. Ob eine spätere Verteilung (Installer, Signierung, Update-Prüfung)
  Verbindungen nach draußen mit sich bringt, ist heute offen.
  2) Beim Öffnen eines Berichts oder des Berichtsordners übergibt CleanDesk den
  Vorgang an Windows. Was die dort registrierte
  Standardanwendung anschließend tut, liegt außerhalb von CleanDesk und ist von hier
  aus nicht bewertbar.
