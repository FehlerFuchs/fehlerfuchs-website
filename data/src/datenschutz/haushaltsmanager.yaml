slug: haushaltsmanager
slug_vorschlag: false
name: HaushaltsManager
stand: "2026-10-07"
geprueft_von: 36_HaushaltsManager Markt
fassung: >-
  Am gebauten und veröffentlichten Produkt 1.1.0 geprüft (Produktfassung ohne private Daten,
  sauberer Vermarktungs-Fork). Windows-Desktop-Tool (Flutter/Dart), lokal. Installer, Programmdatei
  und Deinstaller sind mit der FehlerFuchs-Signatur versehen (zweistufig signiert). Neu ggü. 1.0.0:
  vollständiger lesbarer JSON-Export, Lizenzvereinbarung und erweiterte Datenschutzhinweise in der
  App, Deinstaller fragt nach dem Entfernen der lokalen Daten.

lokal_only: false   # optionale, standardmäßig ausgeschaltete Datenverbindungen + eine minimale Lizenzprüfung, siehe uebertragungen

auf_dem_geraet:
- was: Vollständige Haushaltsdaten in einer lokalen SQLite-Datenbank – Zählerstände (Strom/Gas/Wasser),
    Verträge inkl. Kündigungsfristen, Haushaltsbuch, Vorhaben/Projekte, Solar & Speicher, Anwendungsprotokoll
  wo: lokal, %APPDATA%\eu.fehlerfuchs.privat\HaushaltsManager\HaushaltsManager\ (oder ein vom Nutzer gewählter
    Speicherort)
- was: Erzeugte PDF-Dokumente (Vertrags-/Kündigungsschreiben, Monats-/Jahresberichte) und lesbare
    JSON-Exporte aller Fachdaten
  wo: lokal, dort wo der Nutzer sie speichert
- was: Datenbank-Sicherungen (SQLite-Kopie, zum Wiederherstellen)
  wo: lokal, vom Nutzer angelegt
- was: Optionale anonyme Beispieldaten zum Ausprobieren
  wo: lokal, in der Datenbank; sie werden wie eigene Einträge einzeln in der App gelöscht
- was: Support-Paket (Protokoll und Systemangaben, ohne Zugangsdaten)
  wo: lokal, nur wenn der Nutzer es erzeugt; versendet wird es nur durch den Nutzer selbst

berechtigungen:
- name: Lesen/Schreiben der eigenen SQLite-Datenbank und der vom Nutzer gewählten Export-/PDF-/Backup-Ordner
    (lokal)
- name: Optionaler per-user Autostart-Eintrag (HKCU\...\Run, ohne Administratorrechte), nur wenn der Nutzer
    ihn bei der Installation („Im Hintergrund mit Windows starten“, standardmäßig aus) oder in der App
    (Hintergrunddienst) einschaltet
  wofuer: startet die App versteckt im Tray

  # Ausdrücklich NICHT: Kamera/Mikro/Kontakte; keine Administratorrechte für die App selbst. Der Installer
  # lädt bei Bedarf die Microsoft Visual C++ Laufzeit nach; nur dafür fragt Windows einmal nach (UAC).
  # Standortkoordinaten nur, wenn der Nutzer die optionale Wetterfunktion einschaltet und einen Standort wählt.

uebertragungen:
- wohin: Open-Meteo (api.open-meteo.com, archive-api.open-meteo.com)
  was: 'Wetterdaten zur wetterbereinigten Erklärung von Heizperioden: Nur die vom Nutzer gewählten Koordinaten
    (Standort) und der abgefragte Zeitraum. Kein Schlüssel, kein Konto. Sonst werden keine Nutzerdaten gesendet;
    IP-Adresse und Zeitpunkt fallen wie bei jedem Web-Abruf technisch an.'
  wann: nur bei aktivierter Wetterfunktion, beim Abruf durch den Nutzer oder – wenn er es einschaltet – automatisch
    beim Start bzw. im Hintergrunddienst
  freiwillig: true
  beleg: Standardmäßig aus (weather_auto_sync = 0), opt-in; einzeln abschaltbar
- wohin: PowerFox Cloud-API (backend.powerfox.energy, offizielle Kunden-API 2.0, HTTPS, HTTP Basic Auth)
  was: 'Abruf eigener Zähler-/Verbrauchsdaten aus dem PowerFox-Konto des Nutzers: Nutzt die EIGENEN Zugangsdaten
    des Nutzers (E-Mail + Passwort seines PowerFox-Kontos). Das Passwort liegt ausschließlich im Windows-Anmeldespeicher.
    Abgerufen werden die Verbrauchsdaten des eigenen Kontos.'
  wann: nur bei aktivierter PowerFox-Anbindung, beim Abruf/Sync durch den Nutzer oder im eingestellten Intervall
  freiwillig: true
  beleg: Standardmäßig aus (powerfox_cloud_auto_sync = 0), opt-in; vom Nutzer selbst beauftragte Verbindung zu seinem
    eigenen Konto
- wohin: ENPAL / InfluxDB unter der vom Nutzer eingetragenen Adresse (gewöhnlich im eigenen Heimnetz, IP + Token)
  was: 'Abruf von Solar-/Speicherdaten aus der ENPAL-/InfluxDB-Instanz: Verbindung nur zu der vom Nutzer eingetragenen
    Adresse, gewöhnlich im eigenen Netz. Der Token liegt ausschließlich im Windows-Anmeldespeicher; übertragen wird er
    verschlüsselt nur, wenn die Adresse mit https:// beginnt, sonst unverschlüsselt im Heimnetz (die App weist bei
    der Eingabe darauf hin).'
  wann: nur bei aktivierter Anbindung, beim Abruf/Sync durch den Nutzer oder im eingestellten Intervall
  freiwillig: true
  beleg: Standardmäßig aus (enpal_auto_sync = 0), opt-in; keine Verbindung zu Enpal-Servern
- wohin: FehlerFuchs-Lizenzserver (license.fehlerfuchs.eu, EU/Deutschland, HTTPS)
  was: 'Lizenzaktivierung, -prüfung und Freigabe eines Geräts (Kaufschutz nach der kostenlosen Testphase): Übertragen
    werden der Lizenzschlüssel, eine anonyme, zufällig erzeugte Geräte-Kennung, die Produktkennung „HaushaltsManager“
    und bei der Aktivierung die Plattform „Windows“. KEINE Haushalts-, Zähler-, Vertrags- oder sonstigen Nutzerdaten.
    Nach der Aktivierung läuft die App offline weiter; nur in größeren Abständen ist eine kurze Online-Prüfung nötig.
    IP-Adresse und Zeitpunkt fallen wie bei jedem Web-Abruf technisch an.'
  wann: bei der Aktivierung, bei der Freigabe eines Geräts sowie in größeren Abständen zur Gültigkeitsprüfung
  freiwillig: false
  beleg: Notwendige Kaufabsicherung nach der Testphase; minimaler Datenumfang
- wohin: Öffentliche Versionsliste auf fehlerfuchs.eu (versions.json, HTTPS)
  was: 'Freiwillige Suche nach einer neueren App-Version: Nur ein lesender Abruf einer öffentlichen Datei;
    es werden KEINE Nutzerdaten gesendet. Kein automatischer Download/Install – die App meldet nur, ob
    eine neuere Version vorliegt.'
  wann: nur wenn der Nutzer „Nach App-Updates suchen“ anklickt
  freiwillig: true
  beleg: Nutzerinitiiert; reiner Lesezugriff auf eine öffentliche Liste, keine Telemetrie
- wohin: Microsoft (aka.ms, Download der Visual C++ Laufzeit) – nur durch den Installer
  was: 'Einmaliger Download des Microsoft Visual C++ Redistributable, falls es auf dem Rechner fehlt. Der Installer
    prüft vor dem Start die Microsoft-Signatur der Datei. Es werden keine Nutzerdaten gesendet; IP-Adresse und
    Zeitpunkt fallen technisch an.'
  wann: nur während der Installation und nur, wenn die Laufzeit fehlt
  freiwillig: false
  beleg: Voraussetzung für den Programmstart; Bestandteil von Windows-Programmen dieser Art

fremde_dienste:
  - "Open-Meteo – genutzter Wetterdienst (nur bei aktivierter Wetterfunktion; ohne Schlüssel/Konto, es werden nur die gewählten Koordinaten und der Zeitraum gesendet)"
  - "PowerFox Cloud – vom Nutzer beauftragte Verbindung zu seinem EIGENEN PowerFox-Konto (offizielle Kunden-API 2.0, mit den eigenen Zugangsdaten des Nutzers)"
  - "FehlerFuchs-Lizenzserver (license.fehlerfuchs.eu, EU) – Lizenzaktivierung/-prüfung/-freigabe; überträgt nur Lizenzschlüssel, anonyme Geräte-Kennung, Produktkennung und Plattform, keine Nutzerdaten"
  - "Digistore24 – Wiederverkäufer beim Kauf der Lizenz (Merchant of Record); die App selbst spricht nicht mit Digistore, sondern nur mit dem Lizenzserver"
  - "Microsoft – Download der Visual C++ Laufzeit durch den Installer, nur wenn sie fehlt"
