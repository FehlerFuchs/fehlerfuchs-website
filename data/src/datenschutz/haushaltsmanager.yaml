  Lizenzserver oder IAP genutzt wird, sind NOCH NICHT entschieden. 3) Code-Signing
  (Azure Trusted Signing) und der Vertriebskanal (GitHub-Releases/Digistore) stehen ebenfalls
  noch aus.
