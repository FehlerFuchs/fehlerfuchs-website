  # Komponenten-Update erfolgt rein lokal aus einer vom Nutzer gewählten JSON-Datei – KEINE Netzverbindung.

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false
daten_an_dritte_verkauft: false

loeschung: >-
  Alle Daten liegen ausschließlich lokal in der SQLite-Datenbank unter
  %APPDATA%\eu.fehlerfuchs.privat\HaushaltsManager\HaushaltsManager\ (sofern du in der App keinen anderen Speicherort
  gewählt hast). Es werden keine Haushaltsdaten an FehlerFuchs oder Dritte übertragen. Einträge (auch die optionalen
  Beispieldaten) lassen sich in der App einzeln löschen; die Datenbank sowie erzeugte PDFs, Exporte und Sicherungen
  kann der Nutzer jederzeit selbst löschen. Der Deinstaller entfernt das Programm und fragt, ob auch der Datenordner
  (und eine vom Nutzer verlegte Datenbank) entfernt werden soll – Standard ist „behalten“. Zugangsdaten (PowerFox,
  ENPAL) und Lizenzangaben stehen nur im Windows-Anmeldespeicher und werden dort vom Nutzer entfernt. Die Löschung
  der beim Lizenzserver gespeicherten Lizenzdaten (E-Mail-Adresse und Geräteaktivierungen) kann unter
  https://fehlerfuchs.eu/datenschutz/loeschantrag/ beantragt werden.

besonderheiten: >-
  Kernversprechen: „Alle Daten bleiben auf diesem Gerät.“ HaushaltsManager ist privacy-first
  und offline-first – kein Konto, kein Tracking, keine Werbung, keine Telemetrie, keine
  automatischen Absturzberichte. Alle drei Außenverbindungen (Open-Meteo, PowerFox-Cloud,
  ENPAL/InfluxDB) sind standardmäßig AUS und einzeln zuschalt- bzw. abschaltbar.
  Ein optionaler Hintergrunddienst (Tray-Symbol, standardmäßig aus) hält – nur wenn der Nutzer
  ihn und die jeweilige Verbindung aktiviert – die aktivierten Abrufe (PowerFox/Wetter/ENPAL)
  auch bei geschlossenem Fenster und auf Wunsch ab Windows-Start am Laufen; ohne Aktivierung
  bestehen keinerlei Hintergrundverbindungen.
  Das Komponenten-Update läuft ausschließlich über eine lokal vom Nutzer ausgewählte
  JSON-Datei ohne jede Netzverbindung; es ändert nur ausdrücklich erlaubte Einstellungen in geprüften
  Wertebereichen, Zugangsdaten in solchen Paketen sind verboten. Zugangsdaten (PowerFox-Passwort,
  ENPAL-Token, Lizenzschlüssel und Offline-Token) liegen ausschließlich im Windows-Anmeldespeicher;
  der Lizenzschlüssel wird nicht protokolliert.
  Kaufabsicherung: Nach einer kostenlosen Testphase von 30 Tagen wird die App mit einem Lizenzschlüssel
  aktiviert. Dabei verlassen nur Schlüssel, eine anonyme, zufällige Geräte-Kennung, Produktkennung und
  Plattform das Gerät (Ziel: license.fehlerfuchs.eu, EU); es werden keinerlei Haushaltsdaten übertragen. Der
  Server stellt ein Ed25519-signiertes Offline-Token aus, sodass die App anschließend offline
  läuft und nur in größeren Abständen kurz online prüft. Eine Lizenz gilt für bis zu fünf
  Geräte; ein Gerät kann in der App wieder freigegeben werden. Der App-Update-Check ist
  nutzerinitiiert und liest nur eine öffentliche Versionsliste (keine Telemetrie).
  Die Lizenzvereinbarung (EULA) und die Datenschutzhinweise sind offline in der App nachlesbar
  („Hilfe & Recht“). Anbieterkennzeichnung in der App (Impressum): FehlerFuchs,
  Geschäftsbezeichnung/Marke von Matthias Schacht, Susanne-Bohl-Straße 8, 07747 Jena,
  E-Mail admin@fehlerfuchs.eu.

