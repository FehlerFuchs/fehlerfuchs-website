fassung: >-
  Gilt für 1.1.6. Am gebauten Produkt 1.1.6+47 geprüft (Quellstand 7ede3b3); 1.1.6 ändert das Setup und einen Lizenzhinweis in der App,
  der Programmablauf ist unverändert (Produktfassung ohne private Daten,
  sauberer Vermarktungs-Fork). Windows-Desktop-Tool (Flutter/Dart), lokal. Installer, Programmdatei,
  Deinstaller und alle mitgelieferten Programmbibliotheken sind mit der FehlerFuchs-Signatur versehen
  (zweistufig signiert). Neu ggü. 1.1.1: eigener Datenordner (%APPDATA%\FehlerFuchs\HaushaltsManager\)
  mit eigenem verschlüsselten Speicher, Knopf „Alle Lizenzen anzeigen“ in der App, Tray-Symbol mit
  Menü und Schließen-Kreuz arbeiten wieder wie vorgesehen, nur eine Programminstanz je Benutzer,
  automatische Neuanmeldung des Geräts beim Online-Prüfen der Lizenz (keine zusätzlichen Angaben).
  Neu ggü. 1.1.2: Lässt sich der verschlüsselte Speicher nicht lesen, zeigt die App einen Hinweis; die
  beschädigte Datei bleibt als Kopie im Datenordner erhalten (keine neuen Datenarten, keine Übermittlung).
  Neu ggü. 1.1.3: Beim Lizenzabgleich wird die Programmversion mitgesendet. Findet die App im früheren
  Datenordner noch Daten, zeigt sie einen Hinweis; sie liest diese Daten nicht aus und überträgt nichts.
  Neu ggü. 1.1.4: Das Setup erklärt vorher, was bei fehlender Laufzeitbibliothek und bei der Abfrage nach
  Administratorrechten geschieht (keine neue Verarbeitung, keine Übermittlung). Drei Texte in der App nennen
  die Ablage der Zugangsdaten jetzt richtig: verschlüsselt in einer geschützten Datei im Programmdatenordner.
  Neu ggü. 1.1.5: Das Setup liefert die drei Dateien der Microsoft-Visual-C++-Laufzeit (unverändert, von Microsoft signiert) im Programmordner mit
  und lädt nichts mehr von Microsoft nach; damit entfällt auch die Abfrage von Windows nach Administratorrechten. Die Dateien stehen unter
  „Alle Lizenzen anzeigen“. Keine neue Verarbeitung von Nutzerdaten; eine Datenverbindung (Download der Laufzeit) weniger.

lokal_only: false   # optionale, standardmäßig ausgeschaltete Datenverbindungen + eine minimale Lizenzprüfung, siehe uebertragungen

auf_dem_geraet:
- was: Vollständige Haushaltsdaten in einer lokalen SQLite-Datenbank – Zählerstände (Strom/Gas/Wasser),
    Verträge inkl. Kündigungsfristen, Haushaltsbuch, Vorhaben/Projekte, Solar & Speicher, Anwendungsprotokoll
  wo: lokal, %APPDATA%\FehlerFuchs\HaushaltsManager\HaushaltsManager\ (oder ein vom Nutzer gewählter
    Speicherort)
- was: Erzeugte PDF-Dokumente (Vertrags-/Kündigungsschreiben, Monats-/Jahresberichte) und lesbare
    JSON-Exporte aller Fachdaten
  wo: lokal, dort wo der Nutzer sie speichert
- was: Datenbank-Sicherungen (SQLite-Kopie, zum Wiederherstellen)
  wo: lokal, vom Nutzer angelegt
- was: Optionale anonyme Beispieldaten zum Ausprobieren
  wo: lokal, in der Datenbank; sie werden wie eigene Einträge einzeln in der App gelöscht
- was: Support-Paket (Protokoll und Systemangaben, ohne Zugangsdaten)
  wo: lokal, nur wenn der Nutzer es erzeugt; versendet wird es nur durch den Nutzer selbst
