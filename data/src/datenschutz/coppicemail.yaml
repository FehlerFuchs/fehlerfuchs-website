slug: coppicemail
name: CoppiceMail
stand: "2026-07-24"
geprueft_von: FehlerFuchs_CoppiceMail
fassung: "0.1.0-dev (Flutter/Dart-Neuaufbau) - nicht veroeffentlicht"

# Heute verlaesst kein Datum das Geraet.
lokal_only: true

auf_dem_geraet:
  - was: E-Mail-Daten (Ordner, Nachrichten, Angaben zu Anhaengen, Vorlagen, Regeln)
    wo: lokale Datenbank auf dem Geraet
    beleg: app/data/repo.py (default_db_path, connect, init_db); app/data/schema_email.sql; Datei Daten/coppicemail.sqlite3
  - was: Beispieldaten, die beim ersten Start angelegt werden (frei erfundene Absender und Betreffe, keine echten Nachrichten)
    wo: dieselbe lokale Datenbank
    beleg: app/data/repo.py (seed_demo)
  - was: Lesestatus und Ordnerzuordnung der Nachrichten
    wo: dieselbe lokale Datenbank
    beleg: app/data/repo.py (mark_read, move_message)

# Desktop-Anwendung fuer Windows; es werden keine Systemberechtigungen angefordert.
berechtigungen: []

uebertragungen: []

fremde_dienste: []

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false
daten_an_dritte_verkauft: false

loeschung: >-
  Alle Daten liegen ausschliesslich lokal in einer einzigen Datenbankdatei im
  Programmordner. Wird diese Datei oder der Programmordner geloescht, sind saemtliche
  Daten vollstaendig entfernt. Es gibt keine Kopien auf Servern, und es bleibt nach
  dem Loeschen nichts zurueck.

besonderheiten: >-
  Die Anwendung wurde nie veroeffentlicht. Seit dem 24.07.2026 wird sie als reine
  Flutter/Dart-App neu aufgebaut (vorheriger Stand archiviert). Der aktuelle Stand ist ein
  Grundgeruest und stellt heute keine Verbindung ins Internet her: Es werden keine Nachrichten
  abgerufen oder versendet und keine Daten an andere Programme oder Dienste uebergeben. Was
  angezeigt wird, sind Beispieldaten in der Oberflaeche. Ein Konto wird nicht benoetigt.

vorhandener_text: ""

offene_fragen: >-
  1) Der Abruf/Versand von E-Mails wird ueber das Dart-Paket enough_mail (IMAP/SMTP) umgesetzt;
  welche Serververbindungen dann konkret entstehen, ergibt sich aus den vom Nutzer angelegten
  Konten. Heute besteht keine solche Verbindung.
  2) Zugangsdaten werden kuenftig ueber den OS-Schluesselbund (flutter_secure_storage) abgelegt
  (Modi: merken / bei jedem Start abfragen / aus Konfig-Datei); im Grundgeruest noch nicht aktiv.
  3) Belege werden ueber offene Schnittstellen angebunden (Paperless-REST, PDFuchs-Handoff,
  E-Rechnung); dabei entstehende Verbindungen werden ergaenzt, sobald umgesetzt.
