slug: coppicemail
name: CoppiceMail
stand: "2026-09-24"
geprueft_von: 21_CoppiceMail + Codex_Umzugsreparatur
fassung: "1.0.2-rc.1+6 (Flutter/Dart, Windows-Desktop) – pausierter interner technischer Release-Kandidat, nicht veröffentlicht"

# WICHTIG: CoppiceMail ist ein E-Mail-Programm. "Lokal" heißt hier NICHT, dass keine
# Daten das Gerät verlassen. Für Abruf und Versand verbindet sich die Anwendung mit
# den Mailservern, die der Nutzer selbst einrichtet. Alles Weitere entsteht nur durch
# Funktionen, die der Nutzer aktiv einschaltet oder auslöst.
#
# Diese Fassung 2 ersetzt den Steckbrief zum Stand 0.1.0-dev vom 24.07.2026. Jener
# beschrieb ein Grundgerüst ohne Netzverbindung (lokal_only: true). Das trifft auf den
# heutigen Funktionsstand nicht mehr zu.
lokal_only: false

auf_dem_geraet:
  - was: Arbeitskopie der Nachrichten (Betreff, Absender und Empfänger, Text und HTML, Ordner, Lesestatus, Angaben zu Anhängen), Kontakte, Stammdaten, Sende- und Textvorlagen, Regeln, Kategorien, Einstellungen
    wo: SQLite-Datenbank im App-Datenordner des angemeldeten Windows-Benutzers; nicht anwendungsseitig verschlüsselt
    beleg: 21_App_Flutter/coppicemail_desktop/lib/data/db.dart
  - was: Zugangsdaten der Postfächer (Passwörter und Token)
    wo: NICHT in der Datenbank. Die Windows-Umsetzung von flutter_secure_storage legt sie in einer mit DPAPI verschlüsselten Datei im App-Datenbereich des angemeldeten Windows-Benutzers ab
    beleg: 21_App_Flutter/coppicemail_desktop/lib/data/secrets.dart
  - was: Prozess- und Fehlerprotokoll (Zeitpunkt, Vorgang, Ergebnis). E-Mail-Adressen werden maskiert, Nachrichteninhalte nicht protokolliert. Konten erscheinen nur als lokale Nummer der Form "Konto#3", nicht mit Name oder Adresse
    wo: rotierende Protokolldatei im App-Datenordner
    beleg: 21_App_Flutter/coppicemail_desktop/lib/services/log.dart, lib/mail/mail_service.dart
  - was: Sicherheitsjournal der Automatik und Sperrprotokoll der Abwesenheitsantwort (Ziel nur als HMAC-SHA-256-Pseudonym, Postfachkennung, Aktion, Zustand, Zeitpunkt; keine Nachrichteninhalte)
    wo: dieselbe SQLite-Datenbank; automatische Löschung nach 30 Tagen, beim Start und im laufenden Betrieb. Der Schlüssel für das Pseudonym liegt im DPAPI-geschützten Speicher, nicht in der Datenbank
    beleg: 21_App_Flutter/coppicemail_desktop/lib/data/db.dart (automation_actions, autoreply_log, purgeAutomationHistory)
  - was: Konfigurationssicherung (JSON) mit Postfächern ohne Passwörter, Kontakten, Stammdaten, Regeln, Abwesenheitstexten, Vorlagen und Ordnerzuordnungen. Ohne Nachrichten, Anhänge, Zugangsdaten und Automatikprotokolle
    wo: an dem Ort, den der Nutzer beim Export auswählt
    beleg: 21_App_Flutter/coppicemail_desktop/lib/data/db.dart (exportData)
  - was: Übergabe- und Zwischendateien für Anhänge, die an andere Programme weitergereicht werden
    wo: Dokumente-Ordner des Nutzers bzw. Windows-Temp
    beleg: 21_App_Flutter/coppicemail_desktop/lib/mail/uebergabe.dart
  - was: Sicherheitskopie der Datenbank unmittelbar vor einer notwendigen Schemaänderung; bei fehlgeschlagener Änderung zusätzlich der fehlgeschlagene Zwischenstand zur Fehlersuche
    wo: neben der Datenbank im App-Datenordner; höchstens zwei Sicherungen und ein fehlgeschlagener Zwischenstand; nicht anwendungsseitig verschlüsselt
    beleg: 21_App_Flutter/coppicemail_desktop/lib/data/database_upgrade_guard.dart

berechtigungen:
  - name: Netzwerkzugriff
    wofuer: Abruf und Versand über die vom Nutzer eingerichteten Mailserver; je nach Einstellung zusätzlich Update-Prüfung und Belegübergabe
    pflicht: true
    beleg: 21_App_Flutter/coppicemail_desktop/lib/mail/mail_service.dart
  - name: Automatischer Start mit Windows
    wofuer: Hintergrundabgleich neuer Nachrichten. Eintrag im Benutzerbereich der Registrierung, per Einstellung an- und abschaltbar
    pflicht: false
    beleg: 21_App_Flutter/coppicemail_desktop/lib/ui/home_screen.dart
  - name: Windows-Benachrichtigungen
    wofuer: Hinweis auf neu eingegangene Nachrichten
    pflicht: false
    beleg: 21_App_Flutter/coppicemail_desktop/lib/main.dart, lib/ui/home_screen.dart
  - name: Lesezugriff auf ein vorhandenes Thunderbird-Profil
    wofuer: einmaliger Import bestehender Konteneinstellungen, nur auf ausdrückliche Nutzeraktion
    pflicht: false
    beleg: 21_App_Flutter/coppicemail_desktop/lib/mail/thunderbird_import.dart
  - name: Nutzung der Microsoft-WebView2-Laufzeit
    wofuer: Anzeige formatierter Nachrichten. JavaScript ist abgeschaltet und der Inhalt wird vorher bereinigt. Fehlt die Laufzeit, bleibt die Textansicht nutzbar
    pflicht: false
    beleg: 21_App_Flutter/coppicemail_desktop/lib/services/webview_runtime.dart, lib/ui/mail_html_view.dart

uebertragungen:
  - wohin: die vom Nutzer eingerichteten Mailserver (IMAP und SMTP)
    was: Zugangsdaten sowie Nachrichten und Anhänge
    wann: bei Abruf, automatischem Abgleich und Versand
    freiwillig: false
    beleg: 21_App_Flutter/coppicemail_desktop/lib/mail/mail_service.dart
  - wohin: Server Dritter, die der Absender einer HTML-Nachricht angegeben hat
    was: Abruf externer Bilder. Standardmäßig blockiert; eine Freigabe gilt jeweils nur für die geöffnete Nachricht
    wann: nur nach Klick auf "Bilder laden"
    freiwillig: true
    beleg: 21_App_Flutter/coppicemail_desktop/lib/ui/mail_html_view.dart, lib/mail/html_sanitizer.dart
  - wohin: die Website, auf die ein Link in einer Nachricht verweist
    was: Aufruf im Standardbrowser des Nutzers
    wann: nur nach Klick auf den Link
    freiwillig: true
  - wohin: fehlerfuchs.eu
    was: Abruf einer festen Versionsdatei, um auf eine neuere Fassung hinzuweisen. Kein Herunterladen und kein Ausführen eines Installationsprogramms aus der Anwendung heraus
    wann: beim Start (abschaltbar) oder manuell
    freiwillig: true
    beleg: 21_App_Flutter/coppicemail_desktop/lib/services/update_check.dart
  - wohin: die vom Nutzer eingetragene Paperless-Instanz
    was: der ausgewählte Anhang und das Zugangstoken
    wann: nur nach Klick auf "An Paperless"
    freiwillig: true
    beleg: 21_App_Flutter/coppicemail_desktop/lib/mail/uebergabe.dart
  - wohin: lokales Programm oder lokaler Eingangsordner (PDFuchs, E-Rechnung, BelegWerk)
    was: die Anhangdatei. Kein Empfänger im Netz, solange der eingestellte Zielpfad lokal ist
    wann: nur nach Nutzeraktion
    freiwillig: true
    beleg: 21_App_Flutter/coppicemail_desktop/lib/mail/belegwerk_service.dart
  - wohin: FehlerFuchs (Support- bzw. Info-Adresse)
    was: die vom Nutzer verfasste Nachricht, auf Wunsch mit Diagnosetext oder Anhängen. Der Inhalt wird vor dem Senden angezeigt
    wann: nur wenn der Nutzer die Nachricht selbst absendet
    freiwillig: true
    beleg: 21_App_Flutter/coppicemail_desktop/lib/ui/info_support.dart

fremde_dienste:
  - name: Mailanbieter des Nutzers
    wofuer: Abruf und Versand der Nachrichten
    wann: bei jedem Abruf und Versand
  - name: Microsoft WebView2-Laufzeit
    wofuer: Anzeige von HTML-Nachrichten auf dem Gerät
    wann: beim Öffnen einer HTML-Nachricht. Die Anzeige selbst baut keine eigene Netzverbindung auf, solange externe Bilder blockiert bleiben
  - name: Paperless-Instanz des Nutzers
    wofuer: Ablage von Belegen
    wann: nur nach ausdrücklicher Übergabe
  - name: Bild- und Linkserver Dritter
    wofuer: Inhalte, die in einer Nachricht verlinkt sind
    wann: nur nach Nutzeraktion

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false
daten_an_dritte_verkauft: false

loeschung: >-
  In der Anwendung entfernt "Lokale App-Daten zurücksetzen" die Datenbankinhalte
  (SQLite mit secure_delete und anschließendem VACUUM), den DPAPI-geschützten Speicher
  der Zugangsdaten und die Protokolle. Erfolg wird erst nach technischer Prüfung
  gemeldet; schlägt sie fehl, bleibt die Anwendung geöffnet.
  Der Deinstaller fragt getrennt "Daten behalten" oder "Daten entfernen".
  "Daten behalten" ist die Vorgabe; eine unbeaufsichtigte Deinstallation fragt nicht und
  behält den Profilordner immer. Nur ein ausdrücklich bestätigtes "Daten entfernen"
  löscht den Profilordner einschließlich der unverschlüsselten Sicherungen vor
  Schemaänderungen. Das wurde in einer vollständigen Deinstallations-Testreihe geprüft.
  Wird ein einzelnes Postfach entfernt, verschwinden auch dessen Automatik- und
  Antwortprotokolle. Nachrichten, die auf dem Server des Mailanbieters liegen, sowie
  exportierte oder bereits an andere Programme übergebene Dateien bleiben erhalten.

besonderheiten: >-
  Die lokale Datenbank ist nicht anwendungsseitig verschlüsselt; als Grundschutz wird
  BitLocker oder eine gleichwertige Laufwerksverschlüsselung empfohlen. Externe Bilder
  sind standardmäßig blockiert, JavaScript in Nachrichten ist abgeschaltet und der
  HTML-Inhalt wird vor der Anzeige bereinigt. Eine automatische Update-Installation gibt
  es nicht: Die Anwendung prüft nur eine feste Versionsdatei und verweist auf die
  Produktseite. Die Übergabe an Paperless lässt unverschlüsseltes HTTP ausschließlich
  zum eigenen Rechner zu; jede andere Adresse muss HTTPS verwenden. Die
  Konfigurationssicherung enthält keine Zugangsdaten und keine Nachrichten; nach dem
  Einlesen bleiben Regeln und Abwesenheitsantworten vorsichtshalber abgeschaltet. Für
  Gmail und Outlook werden derzeit App-Passwörter benötigt, da moderne Anmeldeverfahren
  noch nicht unterstützt werden.

vorhandener_text: In der Anwendung unter "Info & Hilfe" sowie im Impressum; eine eigenständige Datenschutzdatei im Projekt gibt es bisher nicht.

offene_fragen: >-
  1) Impressum, Datenschutzerklärung und Haftungshinweise sind noch nicht juristisch
  abgenommen.
  2) Eine verschlüsselte lokale Ablage und eine verschlüsselte Sicherung sind
  vorgesehen, aber noch nicht umgesetzt.
  3) Die Auslieferung ist derzeit nicht signiert; signierte Verteilung und signierte
  Update-Informationen sind vorbereitet, aber noch nicht wirksam.
  4) Ob und wie lange der Mailanbieter Verbindungsdaten wie die IP-Adresse
  protokolliert, hängt vom Anbieter ab und nicht von CoppiceMail.
