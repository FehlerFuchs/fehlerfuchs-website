besonderheiten: >-
  EinsatzFuchs ist eine offline-fähige App für die Freiwillige Feuerwehr,
  nicht-kommerziell und ohne Konto. Sie ist in der Konzeptphase, es gibt
  noch keinen Code.
  Stand 26.07.2026 geprüft: seit dem 24.07. hat sich datenschutzrechtlich
  nichts geändert. Der MVP-Schnitt v0.1 ist am 25.07. abgenommen und die
  Formel-Verifikation (Block 0.5) läuft - beides betrifft nur den fachlichen
  Inhalt der Rechner, nicht die Datenverarbeitung. v0.1 bleibt ausdrücklich
  ohne jeden Netzzugriff.
  Stand 05.08.2026 geprüft: seit dem 26.07. hat sich datenschutzrechtlich
  nichts geändert. Geändert wurde nur der Fachinhalt der Formelbank
  (FORMELN_EinsatzFuchs.md, Fassung 4) - Rechenwege und Quellenbelege, keine
  Datenverarbeitung. Es gibt weiterhin keinen Code.

offene_fragen: >-
  Die Anwendung ist in Entwicklung; Angaben folgen, sobald der Funktionsumfang
  steht. Laut Konzept ist der einzige geplante Netzzugriff die Versionsprüfung
  und der Paket-Download von fehlerfuchs.eu (Inhaltsaktualisierung, vom Nutzer
  ausgelöst); außerdem ruft die Lagekarte OSM-/Overpass-Kartendaten ab, wenn
  der Nutzer sie öffnet. Beides ist noch nicht gebaut und daher hier nur als
  geplant vermerkt, nicht als Tatsache.
  Erledigt am 05.08.2026: Der früher hier vermerkte offene Punkt zum Slug ist
  gegenstandslos. Der Slug "einsatzfuchs" steht seit 24.07.2026 in
  _SLUG-EIGENTUEMER.md (Eigentümer 33_EinsatzFuchs); eine Slug-Liste
  im Datenschutz-Prompt gibt es nicht - der Prompt führt keine.
