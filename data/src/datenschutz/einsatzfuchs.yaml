loeschung: >-
  Alle Inhalte und Einstellungen liegen auf dem Geraet. Sie verschwinden,
  wenn man die App deinstalliert.

besonderheiten: >-
  EinsatzFuchs ist eine offline-faehige App fuer die Freiwillige Feuerwehr,
  nicht-kommerziell und ohne Konto. Sie ist in der Konzeptphase, es gibt
  noch keinen Code.
  Stand 26.07.2026 geprueft: seit dem 24.07. hat sich datenschutzrechtlich
  nichts geaendert. Der MVP-Schnitt v0.1 ist am 25.07. abgenommen und die
  Formel-Verifikation (Block 0.5) laeuft - beides betrifft nur den fachlichen
  Inhalt der Rechner, nicht die Datenverarbeitung. v0.1 bleibt ausdruecklich
  ohne jeden Netzzugriff.
  Stand 05.08.2026 geprueft: seit dem 26.07. hat sich datenschutzrechtlich
  nichts geaendert. Geaendert wurde nur der Fachinhalt der Formelbank
  (FORMELN_EinsatzFuchs.md, Fassung 4) - Rechenwege und Quellenbelege, keine
  Datenverarbeitung. Es gibt weiterhin keinen Code.

offene_fragen: >-
  Die Anwendung ist in Entwicklung; Angaben folgen, sobald der Funktionsumfang
  steht. Laut Konzept ist der einzige geplante Netzzugriff die Versionspruefung
  und der Paket-Download von fehlerfuchs.eu (Inhaltsaktualisierung, vom Nutzer
  ausgeloest); ausserdem ruft die Lagekarte OSM-/Overpass-Kartendaten ab, wenn
  der Nutzer sie oeffnet. Beides ist noch nicht gebaut und daher hier nur als
  geplant vermerkt, nicht als Tatsache.
  Erledigt am 05.08.2026: Der frueher hier vermerkte offene Punkt zum Slug ist
  gegenstandslos. Der Slug "einsatzfuchs" steht seit 24.07.2026 in
  _SLUG-EIGENTUEMER.md (Eigentuemer FehlerFuchs_EinsatzFuchs); eine Slug-Liste
  im Datenschutz-Prompt gibt es nicht - der Prompt fuehrt keine.
