# Von sich aus baut die Anwendung KEINE Verbindung auf. Es gibt drei nutzerinitiierte
# Übertragungen: das Support-/Kontaktformular (nur beim Absenden), „Webseite in PDF“ (Edge lädt
# die eingegebene Adresse) und der optionale Zeitstempel beim Signieren (nur mit eingetragener Stelle).
# (Korrigiert 2026-08-07: die frühere Fassung "uebertragungen: []" prüfte nur
#  den Python-Programmkern und übersah die später ergänzte Support-Anbindung
#  in der Flutter-Oberfläche.)
uebertragungen:
  - was: Werkzeug „Webseite in PDF“ – der auf dem Rechner vorhandene Microsoft Edge lädt die vom Nutzer eingegebene Adresse und druckt sie in eine PDF; PDFuchs sendet nichts an FehlerFuchs
    wohin: die vom Nutzer eingegebene Webadresse (http/https), durch Microsoft Edge
    wann: ausschließlich, wenn der Nutzer das Werkzeug mit einer Adresse startet
    beleg: 05_Engine/pdfuchs_core/pdfuchs_core/werkzeuge_mehr.py (webseite_in_pdf)
  - was: Zeitstempelanfrage beim Signieren – nur ein Prüfwert (Hash) der Signatur, kein Dokument
    wohin: die vom Nutzer eingetragene Zeitstempelstelle (http/https)
    wann: ausschließlich, wenn der Nutzer beim Werkzeug „Mit Zertifikat signieren“ eine Zeitstempelstelle einträgt
    beleg: 05_Engine/pdfuchs_core/pdfuchs_core/werkzeuge_signatur.py (signieren_zertifikat)
  - was: Nutzerinitiierte Support-/Kontaktnachricht – Nachricht, freiwillig Name
      und E-Mail, dazu App-Version, Ausgabe und Windows-Version. Keine
      Dateianhänge, kein Gerätename
    wohin: license.fehlerfuchs.eu (FehlerFuchs-Kontakt-Bridge, EU/IONOS), per HTTPS
    wann: ausschließlich beim ausdrücklichen Absenden des Support-Formulars,
      sonst besteht keine Verbindung. Bei einer Netzstörung öffnet PDFuchs das
      lokale E-Mail-Programm mit der vorbereiteten Nachricht; gesendet wird erst
      dort durch den Nutzer
    beleg: 11_App_Flutter/pdfuchs_desktop/lib/support/kontakt_service.dart:20-58 und lib/support/kontakt_dialog.dart (Kontakt als Fenster, ersetzt support_screen.dart)
  # 0.2.0, Wortlaut freigegeben von Matthias am 15.10.2026, 21:42 (Vorlage „Datenschutz-Satz PDF per E-Mail“, A)
  - was: PDF per E-Mail – die gewählte Datei wird an das eigene E-Mail-Programm des
      Nutzers übergeben, das einen Entwurf mit der Datei als Anhang öffnet. PDFuchs
      selbst sendet nichts
    wohin: lokales E-Mail-Programm des Nutzers; gesendet wird erst dort, über den
      E-Mail-Anbieter des Nutzers
    wann: ausschließlich, wenn der Nutzer „Per E-Mail“ wählt und im E-Mail-Programm
      selbst auf Senden klickt
    beleg: 05_Engine/pdfuchs_core/pdfuchs_core/mail.py (Simple MAPI, sonst Ordner und Zwischenablage), 11_App_Flutter/pdfuchs_desktop/lib/reader/mail_dialog.dart

# Laufen alle lokal auf dem Gerät. Sie sehen den Dokumentinhalt, weil sie ihn
# verarbeiten; sie geben nichts weiter.
fremde_dienste:
  - name: LibreOffice (mitgeliefert)
    wofuer: Umwandlung von Office-Dateien nach PDF und PDF/A-Export
    wann: lokal, nur wenn der Nutzer eine solche Umwandlung auslöst
  - name: Tesseract OCR (mitgeliefert)
    wofuer: Texterkennung auf gescannten Seiten
    wann: lokal, nur wenn der Nutzer die Texterkennung auslöst
  - name: PDFium (Bibliothek zur Anzeige)
    wofuer: Darstellung der PDF-Seiten
    wann: lokal, bei jeder Vorschau
  - name: veraPDF (mitgeliefert, inkl. schlanker OpenJDK-Laufzeit)
    wofuer: optionale Prüfung, ob eine PDF-Datei den PDF/A-Standard einhält
    wann: lokal, nur wenn der Nutzer die PDF/A-Prüfung auslöst; keine Verbindung nach draußen
    beleg: 92_Tools/bundle/verapdf (Wrapper + app + jre), Anbindung 05_Engine/pdfuchs_core/pdfuchs_core/pdfa.py:87

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false
daten_an_dritte_verkauft: false

loeschung: >-
  Alle Daten liegen auf dem Gerät. Selbst erzeugte oder bearbeitete PDFs liegen
  dort, wo der Nutzer sie gespeichert hat, und lassen sich wie jede andere Datei
  löschen. Beim Deinstallieren wird das Programm entfernt; eigene Dokumente
  bleiben erhalten. Eine von früheren Fassungen angelegte Datei license_state.json
  im Anwendungsdatenordner des Benutzers (Testphase) wird von PDFuchs 1.0.0 nicht
  mehr geschrieben oder gelesen; sie bleibt beim Deinstallieren liegen und kann
  jederzeit von Hand gelöscht werden. Das gilt auch für die lokale Einstellungsdatei unter
  %APPDATA%\PDFuchs; erkennt PDFuchs dort unlesbares JSON, wird diese Fassung
  vor dem nächsten Speichern als Datei mit dem Zusatz „.defekt-…“ bewahrt
  (höchstens drei). Ebenso bleiben die verschlüsselte Stammdaten-Datei
  %LOCALAPPDATA%\PDFuchs\stammdaten.dat (unlesbar: ebenso als „.defekt-…“,
  höchstens drei), der Ordner %APPDATA%\PDFuchs\scanner mit Scannerangaben
  und Scanprofilen sowie der Ordner Dokumente\PDFuchs mit den Ergebnissen nach
  dem Deinstallieren erhalten und können von Hand gelöscht werden
  (Wortlaut Datenschutzhinweis: Matthias 16.10.2026, Antwort vor 17:02:51 „A“). Der Zwischenspeicher unter
  %LOCALAPPDATA%\PDFuchs\Umwandlung bleibt beim
  Deinstallieren ebenfalls erhalten; Einträge, die älter als sieben Tage sind,
  löscht PDFuchs selbst, der Rest lässt sich jederzeit von Hand löschen.
  Ebenso bleiben die Ordner %APPDATA%\PDFuchs\stempel und
  %APPDATA%\PDFuchs\sticker mit den eigenen Stempeln und Stickern erhalten.

besonderheiten: >-
  PDFuchs verarbeitet Dokumente vollständig auf dem eigenen Rechner. Die
  Anwendung stellt von sich aus keine Verbindung ins Internet her. Eine
  Übertragung erfolgt nur, wenn der Nutzer das Support-/Kontaktformular
  ausdrücklich absendet; dann gehen die Nachricht, die dort eingegebenen
  freiwilligen Angaben sowie App-Version und Windows-Version per HTTPS an die
  FehlerFuchs-Kontakt-Bridge
  (license.fehlerfuchs.eu, EU/IONOS). Ein Konto oder eine Anmeldung gibt es
  nicht. PDFuchs ist kostenlos und zählt nichts. Die Links „Unterstützen“ und
  „Per PayPal unterstützen“ sowie die Quell-Links der Open-Source-Seite öffnen
  erst auf Klick den Browser; PDFuchs sendet dabei nichts.
  Wird ein Scanner benutzt, werden Angaben zum
  angeschlossenen Gerät lokal gespeichert, damit die Scanprofile dazu passen.
  Der beschriebene Stand ist die veröffentlichte Fassung 1.0.0. Für die Anzeige „Offline-Status“ prüft PDFuchs nur auf dem Rechner
  mit dem Windows-Befehl netstat, ob PDFuchs selbst Verbindungen offen hat;
  dabei wird nichts übertragen.

