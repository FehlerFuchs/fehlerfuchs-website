slug: up2date
name: Up2Date – FehlerFuchs Update-Helfer
stand: "2026-07-26"
geprueft_von: FehlerFuchs_Up2Date
fassung: "1.0.0 (MVP: Tray, App-Erkennung, Versionsabgleich, Autostart, Feedback; noch nicht veroeffentlicht)"

# Geprueft wurde der Quellstand in 05_App/up2date (lib/), nicht die Beschreibung.

# Ohne Zutun nimmt die Anwendung beim Start EINE Verbindung nach draussen auf:
# den Abruf der oeffentlichen Fassungsliste. Dabei werden keine Nutzerdaten
# gesendet, der Server sieht aber die Anfrage. Deshalb nicht rein lokal.
lokal_only: false

auf_dem_geraet:
  - was: Einstellungen (Schalter "Beta-Fassungen anbieten")
    wo: lokaler App-Einstellungsspeicher (shared_preferences)
    beleg: lib/settings.dart
  - was: Autostart-Eintrag, nur wenn der Nutzer ihn einschaltet
    wo: Windows-Registry des eigenen Benutzers (HKCU, Autostart)
    beleg: lib/settings.dart (Paket launch_at_startup)
  - was: keine persoenlichen oder inhaltlichen Nutzerdaten
    wo: es gibt keine Datenbank, keine Dokumente, keine Konten
    beleg: keine Datei-/DB-Schreibzugriffe ausser den Einstellungen oben

# Windows-Desktop: kein Berechtigungsmanifest wie unter Android. Aufgefuehrt sind
# die Faehigkeiten, die die Anwendung nutzt (bzw. mitbringt, aber nicht nutzt).
berechtigungen:
  - name: Lesen der Liste installierter Programme
    wofuer: Erkennen, welche FehlerFuchs-Programme installiert sind (Name + Fassung)
    pflicht: false
    beleg: lib/app_scan.dart (Paket win32_registry), nur lesend, Uninstall-Eintraege
  - name: Automatischer Start mit Windows
    wofuer: optionaler Start im Infobereich – nur nach Zustimmung, jederzeit abschaltbar
    pflicht: false
    beleg: lib/settings.dart (Paket launch_at_startup, HKCU); kein Eintrag durch den Installer
  - name: Zugriff auf das Internet
    wofuer: Abruf der Fassungsliste (automatisch beim Start) und Senden von Feedback
      (nur nutzerausgeloest)
    pflicht: false
    beleg: lib/version_check.dart (GET versions.json) und lib/support.dart (POST /v1/contact)
  - name: Windows-Benachrichtigungen
    wofuer: geplant – Hinweis, wenn eine neue Fassung vorliegt
    pflicht: false
    beleg: pubspec.yaml – Paket local_notifier deklariert, 0 Verwendungen in lib/
  - name: Speichern von Einstellungen
    wofuer: Merken des Beta-Schalters
    pflicht: false
    beleg: lib/settings.dart (Paket shared_preferences)

uebertragungen:
  - wohin: fehlerfuchs.eu
    was: nichts vom Nutzer – es wird nur die oeffentliche Datei versions.json
      abgerufen (lesend). Der Server sieht die Anfrage und damit die IP-Adresse.
    wann: automatisch beim Start und beim Klick auf "Erneut suchen"
    freiwillig: false
    beleg: lib/version_check.dart – GET https://fehlerfuchs.eu/versions.json (Paket http)
  - wohin: Server von FehlerFuchs (EU, IONOS)
    was: die eingegebene Nachricht sowie – nur wenn angegeben – Name und E-Mail;
      auf ausdruecklichen Wunsch zusaetzlich eine technische Diagnose
      (App-Version, Betriebssystem, Spracheinstellung), keine persoenlichen Daten
    wann: nur wenn der Nutzer im Feedback-Fenster aktiv auf "Senden" tippt
    freiwillig: true
    beleg: lib/support.dart – POST an license.fehlerfuchs.eu/v1/contact (Paket http)

fremde_dienste: []

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false
daten_an_dritte_verkauft: false

loeschung: >-
  Die Anwendung speichert nur die eigenen Einstellungen und – wenn eingeschaltet –
  einen Autostart-Eintrag. Beim Entfernen des Programms verschwinden diese; der
  Autostart-Schalter laesst sich jederzeit in den Einstellungen ausschalten. Eine
  gesendete Feedback-Nachricht wird bei uns als E-Mail bearbeitet und nicht
  dauerhaft in einer Datenbank abgelegt.

besonderheiten: >-
  Up2Date ist der zentrale Update-Helfer fuer FehlerFuchs-Anwendungen und laeuft
  als Symbol im Windows-Infobereich. Es erkennt installierte FehlerFuchs-Programme
  ueber die Windows-Registry (nur lesend) und vergleicht deren Fassung mit einer
  oeffentlich abrufbaren Liste auf fehlerfuchs.eu. Der Abruf dieser Liste ist der
  einzige automatische Kontakt nach draussen und uebertraegt keine Nutzerdaten.
  Kein Konto, keine Telemetrie, keine Werbung. Der Autostart ist ausdrueckliches
  Opt-in und wird nicht vom Installer gesetzt.

vorhandener_text: ""

offene_fragen: >-
  1) Ob der Server beim Abruf der Fassungsliste IP-Adressen protokolliert, haengt
  vom Server ab und ist von der App aus nicht feststellbar. 2) Es existiert noch
  kein Installer; ob dieser spaeter Eintraege ausserhalb des Programmordners
  anlegt, ist offen. 3) Der Download und Start von Update-Installern ist noch
  nicht gebaut – wenn er kommt, laedt die App ausfuehrbare Dateien von
  fehlerfuchs.eu bzw. dem GitHub-Release-Repo; das wird dann hier ergaenzt.
