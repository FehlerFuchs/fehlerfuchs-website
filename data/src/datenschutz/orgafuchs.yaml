fassung: "1.9.3 (versionCode 22), Release-Kandidat vom 25.09.2026; im Feld bis zur Auslieferung 1.9.2 (versionCode 21). Gegenüber der früheren Fassung 1.6.1 neu bzw. geändert: optionale Anzeige der Dienste und Termine in einem eigenen, rein lokalen Gerätekalender (nur Android, Kalender-Berechtigung, nichts verlässt das Gerät); der frühere Abgleich direkt im Heimnetz und das Gruppen-Passwort sind entfernt - Geräte werden nur noch per QR-Einladung gekoppelt und gleichen Ende-zu-Ende-verschlüsselt über das Relais ab. Kein neues Übertragungsziel, keine Weitergabe an Dritte. Frühere Fassung: 1.6.1 (versionCode 15): Windows signiert+veröffentlicht (Release orgafuchs-v1.6.1), Android 1.6.1 im Play-Rollout. Enthält Firebase Cloud Messaging (Google) als inhaltslosen Weck-Push (seit 1.5.0; nur Android, nur bei eingeschalteten Benachrichtigungen), Windows-Update-Prüfung (github.com) sowie NEU 'Nachricht an alle' + Postfach: kurze Klartext-Nachrichten an die Gruppe reisen Ende-zu-Ende über den Relais-Kanal (NICHT über Google), Postfach zeigt sie lokal im Nachgang. KEIN neues Übertragungsziel/keine neue Datenkategorie ggü. 1.5.0. Play-Data-Safety unverändert (Firebase/Gerätekennungen bereits deklariert)."
# Pruefvermerk 01.08.2026: Steckbrief weiterhin gueltig fuer den veroeffentlichungsreifen
# Stand 1.0.0. Interne Weiterentwicklung (Host-Uebergabe, geplanter Notfall-Recovery) laeuft
# ueber die bereits gelisteten Kanaele (Relais bleibt Ende-zu-Ende-verschluesselt/inhaltsblind)
# und fuehrt KEINE neue Datenkategorie und KEIN neues Uebertragungsziel ein. Der ergaenzte
# Vorlagen-Export/-Import nutzt die System-Dateiauswahl (file_picker/ACTION_GET_CONTENT), also
# KEINE neue Berechtigung und kein Speicher-Vollzugriff. Vor einer neuen Veroeffentlichung ist
# die Fassung hier auf die dann gebaute Versionsnummer zu heben.
#
# NACHTRAG 1.3.0 (geplant, Umsetzung via Codex; Belege nach Bau finalisieren): Die
# 1.3.0-Ergaenzungen fuehren KEIN neues Uebertragungsziel und KEINE Weitergabe an Dritte ein.
# Relevante Aenderung fuer die Datenschutz-Sicht:
#  - Home-Screen-Widgets (Android, Paket home_widget): zeigen LOKALE Plandaten (Tag/Woche/Monat)
#    ausserhalb der App auf dem Startbildschirm. Datenkategorie unveraendert (bereits lokal
#    vorhanden), aber NEUE ANZEIGEFLAECHE: Inhalte sind fuer andere am Geraet sichtbar und liegen
#    im lokalen App-/Widget-Speicher (kein Netz, keine Cloud). -> unter auf_dem_geraet + besonder-
#    heiten aufnehmen.
#  - Kiosk "Bildschirm eingeschaltet lassen" (Paket wakelock_plus): haelt nur das Display wach;
#    bereits vorhandene WAKE_LOCK-Berechtigung, jetzt aktiv genutzt (wofuer bei "Geraet wachhalten"
#    ergaenzen). Keine Datenuebertragung.
#  - Windows-Hintergrundbetrieb (Tray, Pakete window_manager/tray_manager): reine Desktop-UI,
#    keine Android-Berechtigung, keine neue Uebertragung.
#  - Benachrichtigungen nennen den Geraetealias / eigenes Statusicon: kosmetisch, keine neue
