    wann: beim App-Start automatisch, höchstens etwa einmal im Monat, sobald ein Bundesland eingestellt ist; zusätzlich manuell über "Feiertage & Ferien aktualisieren"
    freiwillig: false
    beleg: lib/services/schulferien.dart:29+85-96, lib/providers.dart:172-183, lib/features/home/home_shell.dart:32
  - wohin: orgafuchs.relais.fehlerfuchs.eu (fest eingestellt, von FehlerFuchs betrieben)
    was: Ende-zu-Ende-verschlüsselte Sync-Nachrichten (Plan-, Personen- und Termindaten sowie kurze Klartext-Nachrichten an die Gruppe - "Nachricht an alle" - im verschlüsselten Umschlag) samt Gruppen- und Gerätekennung zur Adressierung; das Relais kann die Inhalte nicht lesen
    wann: nur wenn der Nutzer Geräte zu einem gemeinsamen Familienplan verbindet (ab Werk aus)
    freiwillig: true
    beleg: orgafuchs_kern/lib/sync/protocol/ofsp_transport.dart:28-31 (productionEndpoint), lib/providers.dart:42, lib/features/sync/ofsp_pairing_page.dart:75
  - wohin: ntfy.relais.fehlerfuchs.eu (Vorbelegung), wahlweise ntfy.sh oder eine selbst eingetragene Adresse
    was: Benachrichtigungssignal "es gibt Änderungen" samt Themenkennung; keine Planinhalte
    wann: nur wenn der Nutzer Push einschaltet (ab Werk aus)
    freiwillig: true
    beleg: lib/services/push_ntfy.dart, lib/core/server_dropdown.dart:107-108, lib/services/push_controller.dart:30-31
  - wohin: license.fehlerfuchs.eu
    was: Support-/Kontaktformular - eingegebene Nachricht, optional Name und E-Mail, dazu App-Name, Version, Betriebssystem, Gerätebezeichnung und optional angehängte Diagnose-/Protokolldateien
    wann: nur wenn der Nutzer das Formular absendet
    freiwillig: true
    beleg: lib/services/kontakt_service.dart:20-58, lib/features/info/kontakt_page.dart
  - wohin: fehlerfuchs.eu (im externen Browser des Nutzers)
    was: Aufruf von Impressum, Datenschutz, Kontakt, Unterstützen und der Windows-Produktseite; die App sendet dabei selbst keine Daten
    wann: nur bei Antippen des jeweiligen Verweises
    freiwillig: true
    beleg: lib/features/info/info_page.dart:13-17
  - wohin: github.com / api.github.com (nur Windows-Fassung)
    was: Abruf der öffentlichen Versionsliste der FehlerFuchs-Downloads und - auf Nutzerwunsch - Download der signierten Setup-Datei; gesendet wird nur die Anfrage, keine Nutzerinhalte (GitHub sieht technisch die IP-Adresse)
    wann: nur in der Windows-Fassung; beim App-Start höchstens einmal täglich sowie manuell über "Nach Updates suchen". Die Android-Fassung aktualisiert über den Play Store und baut dafür keine eigene Verbindung auf
    freiwillig: false
    beleg: lib/services/update_service.dart, lib/services/update_ui.dart, lib/features/info/info_page.dart, lib/features/home/home_screen.dart
  - wohin: Firebase Cloud Messaging / Google (nur Android)
    was: Registrierung des Geräts mit einer Push-Kennung bei Google und Empfang reiner Weck-Nachrichten; KEINE Termine/Namen/Planinhalte (nur Signal "es gibt Änderungen"). Google sieht technisch die Push-Kennung, die IP-Adresse und den Zeitpunkt
    wann: nur wenn Benachrichtigungen eingeschaltet sind; die Wecknachricht löst das Relais aus, nicht die App
    freiwillig: true
    beleg: lib/services/fcm_dienst.dart, android/app/google-services.json, android/app/src/main/AndroidManifest.xml

fremde_dienste:
  - name: Google ML Kit - Barcode Scanning (mitgeliefertes Modell, über die Bibliothek mobile_scanner)
    wofuer: Erkennung des Beitritts-QR-Codes; die Erkennung läuft auf dem Gerät
    wann: nur solange der QR-Scanner geöffnet ist
  - name: ntfy (quelloffener Benachrichtigungsdienst)
    wofuer: Push-Signal bei Änderungen; vorbelegt ist ein selbst betriebener Server, alternativ ntfy.sh oder ein eigener
    wann: nur bei eingeschaltetem Push
  - name: GitHub (Microsoft) - Auslieferung der Windows-Aktualisierungen
    wofuer: stellt die öffentliche Versionsliste und die signierte Setup-Datei für die Selbst-Aktualisierung der Windows-Fassung bereit; kein Konto, keine Anmeldung, keine Nutzerinhalte
    wann: nur bei der Windows-Update-Prüfung (automatisch höchstens täglich beim Start oder manuell)
  - name: Firebase Cloud Messaging (Google) - zuverlässiger Weck-Push (nur Android)
    wofuer: weckt die App aus Doze/geschlossenem Zustand für den Empfang von Änderungen; das Gerät registriert sich mit einer Push-Kennung bei Google. In der Nachricht KEINE Termine/Namen/Planinhalte (nur Wecksignal) - der eigentliche Abgleich bleibt Ende-zu-Ende-verschlüsselt über das Relais
    wann: nur bei eingeschalteten Benachrichtigungen (Android)
  - name: Kein Google-Konto, kein Analytics, kein Play Billing, keine Karten, keine Schriften aus dem Netz
    wofuer: nicht eingebunden (App ist kostenlos, keine In-App-Käufe). Firebase wird ausschließlich für den Weck-Push genutzt (s. o.), NICHT für Analytics/Werbung/Tracking
    wann: entfällt

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false
daten_an_dritte_verkauft: false

loeschung: >-
  Alle Inhalte liegen auf dem Gerät. Einzelne Einträge, Personen und Dienste
  lassen sich in der App löschen; der Einrichtungsassistent kann im Modus
  "Komplett neu" den gesamten Bestand zurücksetzen. Mit der Deinstallation
  verschwinden Datenbank, Protokolle, PDF-Ablage und Sicherungen im App-Ordner.
  Beim Abgleich über das Relais liegen dort nur verschlüsselte, kurzlebige Nachrichten;
  ohne die Schlüssel der Familiengruppe sind sie nicht lesbar. Über das Support-Formular
  gesendete Nachrichten werden auf Anfrage per E-Mail gelöscht.

besonderheiten: >-
  Der Abgleich zwischen mehreren Geräten kommt ohne Konto und ohne
  Registrierung aus: Ein Gerät ist "Hauptgerät", weitere treten über eine
  QR-Einladung des Hauptgeräts bei, die mit einem Kurzcode bestätigt wird. Die
  Einladung überträgt die Schlüssel für die Ende-zu-Ende-Verschlüsselung; das
  Relais sieht daher nur verschlüsselte Daten sowie Gruppen- und Gerätekennungen
  für die Zustellung - weder Namen noch Inhalte. Das Relais ist fest eingestellt
  und wird von FehlerFuchs betrieben; der Benachrichtigungsserver ist frei
  wählbar und lässt sich auch selbst betreiben. Einen Abgleich direkt im
  Heimnetz ohne Server gibt es nicht mehr. Die App zeigt eine Übersicht der verwendeten
  Open-Source-Bausteine und Datenquellen. Da Dienstpläne mittelbar
  Rückschlüsse auf Arbeits- und Abwesenheitszeiten mehrerer Personen zulassen,
  können die lokal gespeicherten Inhalte sensibel sein.

vorhandener_text: >-
  Vollständige Offline-Datenschutzerklärung in
  lib/features/info/datenschutz_page.dart, erreichbar über Einstellungen ->
  Info & Rechtliches; zusätzlicher Link auf die kanonische Online-Fassung
  https://fehlerfuchs.eu/datenschutz/. In-App-Impressum mit Anschrift und E-Mail,
  ohne Telefonnummer,
  Transparenzseite lib/features/info/open_source_page.dart und Offline-Changelog.

offene_fragen: >-
  1) Unklar, ob und wie lange die angefragten Server (fehlerfuchs.eu für die
  Schulferien, das Relais, der ntfy-Server, license.fehlerfuchs.eu sowie
  github.com für die Windows-Update-Prüfung) IP-Adressen oder Zugriffe
  protokollieren - das hängt vom Serverbetrieb ab, nicht von der App.
  2) Unklar, ob das mitgelieferte Google-ML-Kit-Barcodemodul eigene Verbindungen
  zu Google aufbaut (etwa Modell- oder Telemetriezugriffe); aus dem App-Code ist
  keine solche Verbindung ersichtlich, die Bibliothek wurde nicht im
  Netzwerkmitschnitt geprüft.
  3) Unklar, welche Daten der Endpunkt license.fehlerfuchs.eu nach Empfang einer
  Support-Anfrage speichert und wie lange.
  4) Nicht geprüft, ob die dem Support-Formular optional angehängte
  Diagnosedatei in Einzelfällen Inhalte aus Dienstplänen enthalten kann; sie ist
  als rein technische Zusammenfassung angelegt (lib/core/diagnose/diagnose.dart).
