fassung: "Android 1.9.7 (versionCode 29), bei Google Play seit 01.10.2026 (14:26); sie ersetzt 1.9.6 (versionCode 28), deren Veröffentlichung angehalten und verworfen wurde – 1.9.6 hat keine Nutzer erreicht. Mit 1.9.7: Firebase meldet sich erst nach der Einwilligung bei Google an; ein neu angelegtes Hauptgerät weckt die anderen Geräte sofort; ist das Hauptgerät nicht erreichbar, fragen die anderen Geräte seltener nach. Keine neue Datenart, kein neues Übertragungsziel. Ausgeliefert: Android 1.9.5 (versionCode 26), bei Google Play seit 30.09.2026; Windows 1.9.3 (versionCode 24) seit 25.09.2026. Android 1.9.4 und 1.9.5 bringen Korrekturen an Abgleich, Startbildschirm-Widgets und lokalem Gerätekalender – kein neues Übertragungsziel. Am 01.10.2026 neu erfasst und gemessen: Beim ersten Start meldet sich die App einmal bei Google Firebase an, auch ohne eingeschaltete Benachrichtigungen (siehe Übertragungen); die Anmeldung des Geräts beim Relais für den Weckruf ist jetzt eigens aufgeführt. Frühere Fassung: 1.9.3 (versionCode 24), ausgeliefert am 25.09.2026 für Windows und Google Play. Gegenüber der früheren Fassung 1.6.1 neu bzw. geändert: optionale Anzeige der Dienste und Termine in einem eigenen, rein lokalen Gerätekalender (nur Android, Kalender-Berechtigung, nichts verlässt das Gerät); der frühere Abgleich direkt im Heimnetz und das Gruppen-Passwort sind entfernt – Geräte werden nur noch per QR-Einladung gekoppelt und gleichen Ende-zu-Ende-verschlüsselt über das Relais ab. Kein neues Übertragungsziel, keine Weitergabe an Dritte. Frühere Fassung: 1.6.1 (versionCode 15): Windows signiert+veröffentlicht (Release orgafuchs-v1.6.1), Android 1.6.1 im Play-Rollout. Enthält Firebase Cloud Messaging (Google) als inhaltslosen Weck-Push (seit 1.5.0; nur Android, nur bei eingeschalteten Benachrichtigungen), Windows-Update-Prüfung (github.com) sowie NEU „Nachricht an alle“ + Postfach: kurze Klartext-Nachrichten an die Gruppe reisen Ende-zu-Ende über den Relais-Kanal (NICHT über Google), Postfach zeigt sie lokal im Nachgang. KEIN neues Übertragungsziel/keine neue Datenkategorie ggü. 1.5.0. Play-Data-Safety unverändert (Firebase/Gerätekennungen bereits deklariert)."
# Pruefvermerk 01.08.2026: Steckbrief weiterhin gueltig fuer den veroeffentlichungsreifen
# Stand 1.0.0. Interne Weiterentwicklung (Host-Uebergabe, geplanter Notfall-Recovery) laeuft
# ueber die bereits gelisteten Kanaele (Relais bleibt Ende-zu-Ende-verschluesselt/inhaltsblind)
# und fuehrt KEINE neue Datenkategorie und KEIN neues Uebertragungsziel ein. Der ergaenzte
# Vorlagen-Export/-Import nutzt die System-Dateiauswahl (file_picker/ACTION_GET_CONTENT), also
# KEINE neue Berechtigung und kein Speicher-Vollzugriff. Vor einer neuen Veroeffentlichung ist
# die Fassung hier auf die dann gebaute Versionsnummer zu heben.
#
# NACHTRAG 1.3.0 (geplant, Umsetzung via Codex; Belege nach Bau finalisieren): Die
# 1.3.0-Ergaenzungen fuehren KEIN neues Uebertragungsziel und KEINE Weitergabe an Dritte ein.
# Relevante Aenderung fuer die Datenschutz-Sicht:
#  - Home-Screen-Widgets (Android, Paket home_widget): zeigen LOKALE Plandaten (Tag/Woche/Monat)
#    ausserhalb der App auf dem Startbildschirm. Datenkategorie unveraendert (bereits lokal
#    vorhanden), aber NEUE ANZEIGEFLAECHE: Inhalte sind fuer andere am Geraet sichtbar und liegen
#    im lokalen App-/Widget-Speicher (kein Netz, keine Cloud). -> unter auf_dem_geraet + besonder-
#    heiten aufnehmen.
#  - Kiosk "Bildschirm eingeschaltet lassen" (Paket wakelock_plus): haelt nur das Display wach;
#    bereits vorhandene WAKE_LOCK-Berechtigung, jetzt aktiv genutzt (wofuer bei "Geraet wachhalten"
#    ergaenzen). Keine Datenuebertragung.
#  - Windows-Hintergrundbetrieb (Tray, Pakete window_manager/tray_manager): reine Desktop-UI,
#    keine Android-Berechtigung, keine neue Uebertragung.
#  - Benachrichtigungen nennen den Geraetealias / eigenes Statusicon: kosmetisch, keine neue
#    Datenkategorie (Alias bereits Teil des verschluesselten Sync).
# Zusaetzlich 1.3.0: vollstaendige Datenschutzerklaerung nun AUCH in der App (offline), Impressum
# um Anschrift ergaenzt, In-App-Changelog. -> vorhandener_text nach Bau aktualisieren.
# Fassung/Version + Belege (Dateizeilen der neuen Widgets/Seiten) beim Finalisieren auf 1.3.0
# (versionCode 5) heben.

# Verlaesst IRGENDEIN Datum das Geraet, wenn man nichts weiter einstellt?
# Nein -> false: Sobald im Einrichtungsassistenten ein Bundesland gesetzt ist
# (Vorbelegung TH), ruft die App beim Start automatisch die Schulferien von
# fehlerfuchs.eu ab, hoechstens etwa einmal im Monat. Dabei werden keine
# Nutzerinhalte gesendet, es entsteht aber eine Verbindung (IP-Adresse und
# angefragtes Bundesland sind fuer den Server sichtbar). Alle uebrigen
# Verbindungen sind ab Werk aus und muessen erst eingeschaltet werden.
lokal_only: false

auf_dem_geraet:
  - was: Personen, Dienste und Kategorien, Dienstplan-Einträge, Termine, Notizen, Sondertage, Einstellungen und die Sync-Konfiguration
    wo: in der lokalen Datenbank der App auf dem Gerät
    beleg: lib/data/database.dart:1134-1135
  - was: Änderungsprotokoll der App (wer hat wann was geändert)
    wo: in einer lokalen Protokolldatei der App auf dem Gerät
    beleg: lib/data/logbuch_store.dart:75-76
  - was: Jahresarchiv des Änderungsprotokolls
    wo: in lokalen Archivdateien der App auf dem Gerät
    beleg: lib/services/logbuch_archiv.dart:21-44
  - was: Fehlerprotokoll der App (technische Meldungen zum Betrieb)
    wo: in einer lokalen Protokolldatei der App auf dem Gerät
    beleg: lib/core/diagnose/fehlerlog.dart:26-27
  - was: erzeugte PDF-Pläne (Monat und Jahr)
    wo: in einer lokalen Ablage der App auf dem Gerät
    beleg: lib/services/pdf_archiv.dart:11-21
  - was: Sicherungen des Datenbestands und ausgelagerte Vorlagen
    wo: in lokalen Dateien der App auf dem Gerät; sie werden nur weitergegeben, wenn der Nutzer sie selbst teilt
    beleg: lib/features/settings/backup_page.dart:34-36, lib/features/settings/vorlagen_editor_page.dart:107-108
  - was: bearbeitete Kategorie-Vorlagen
    wo: in einer lokalen Datei der App auf dem Gerät
    beleg: lib/data/vorlagen.dart:81-82
  - was: zwischengespeicherte Schulferien des eingestellten Bundeslandes
    wo: in einer lokalen Datei der App auf dem Gerät
    beleg: lib/services/schulferien.dart:39-40
  - was: technische Einstellungen (Erscheinungsbild sowie die Adresse des gewählten Benachrichtigungsservers)
    wo: in den Geräteeinstellungen der App
    beleg: lib/app.dart:106, lib/services/push_controller.dart:42-43
  - was: für Android-Home-Screen-Widgets ausgewählte lokale Plandaten (Tag, Woche oder Monat)
    wo: im lokalen App-/Widget-Speicher des Geräts; für andere Personen am sichtbaren Startbildschirm lesbar, ohne Netzübertragung
    beleg: lib/services/home_widgets.dart; android/app/src/main/kotlin/eu/fehlerfuchs/orgafuchs/OrgaFuchsWidgetProvider.kt
  - was: die Schlüssel und Gerätekennungen der Familiengruppe für den Ende-zu-Ende-verschlüsselten Abgleich (aus der QR-Einladung) sowie die Liste der gekoppelten Geräte
    wo: im geschützten Schlüsselspeicher des Geräts und in der lokalen Datenbank der App
    beleg: lib/sync/platform_vault.dart; orgafuchs_kern/lib/data/database.dart (Tabellen sync_meta, sync_actors)
  - was: auf Wunsch (nur Android) Dienste und Termine als Einträge in einem eigenen, rein lokalen Kalender „OrgaFuchs (nur Ansicht)“
    wo: im Kalenderspeicher des Geräts unter einem lokalen Konto, nie in einem Kalender-Sync-Konto; für Kalender-Apps auf dem Gerät sichtbar; Abschalten entfernt den Kalender wieder
    beleg: lib/services/kalender_spiegel.dart; android/app/src/main/kotlin/eu/fehlerfuchs/orgafuchs/KalenderSpiegel.kt (ACCOUNT_TYPE_LOCAL)

berechtigungen:
  - name: Internet
    wofuer: Schulferien-Abruf, Update-Prüfung der Windows-Fassung, optionaler Sync, optionaler Push, nutzerinitiiertes Support-Formular, Öffnen von Weblinks
    pflicht: false
    beleg: android/app/src/main/AndroidManifest.xml (INTERNET)
  - name: Netzwerkstatus
    wofuer: prüfen, ob eine Verbindung besteht, damit Abgleich und Hintergrundarbeiten nur mit Netz laufen
    pflicht: false
    beleg: zusammengefuehrtes AndroidManifest (ACCESS_NETWORK_STATE, Baustein connectivity_plus) – steht nicht in der App-eigenen Manifestdatei; ACCESS_WIFI_STATE wird seit dem Wegfall des Heimnetz-Syncs nicht mehr angefordert
  - name: Kalender (lesen und schreiben)
    wofuer: nur wenn „OrgaFuchs im Geräte-Kalender zeigen“ eingeschaltet ist (nur Android) – einen eigenen, rein lokalen Kalender anlegen und die Dienste und Termine hineinschreiben, damit sie in der Kalender-App erscheinen; fremde Kalender werden nicht ausgewertet, nichts verlässt das Gerät
    pflicht: false
    beleg: android/app/src/main/AndroidManifest.xml (READ_CALENDAR, WRITE_CALENDAR); android/app/src/main/kotlin/eu/fehlerfuchs/orgafuchs/KalenderSpiegel.kt; lib/features/info/datenschutz_page.dart:125-129
  - name: Kamera
    wofuer: QR-Code scannen beim Beitritt zu einer Sync-Gruppe
    pflicht: false
    beleg: android/app/src/main/AndroidManifest.xml (CAMERA, uses-feature required=false); lib/features/sync/qr_scan_page.dart
  - name: Benachrichtigungen
    wofuer: Hinweis, wenn ein anderes Gerät der Gruppe etwas geändert hat
    pflicht: false
    beleg: android/app/src/main/AndroidManifest.xml (POST_NOTIFICATIONS)
  - name: Vordergrunddienst (Typ Datenabgleich und Kurzdienst)
    wofuer: hält bei eingeschalteten Hinweisen die Verbindung zum gewählten Benachrichtigungsserver, damit Änderungen auch bei geschlossener App ankommen; der Kurzdienst wird vom mitgelieferten Baustein für geplante Hintergrundarbeiten angefordert, mit dem OrgaFuchs bei bestehender Verbindung etwa alle 30 Minuten einen vom System beendeten Empfang wieder anstößt
    pflicht: false
    beleg: android/app/src/main/AndroidManifest.xml (FOREGROUND_SERVICE, FOREGROUND_SERVICE_DATA_SYNC); zusammengefuehrtes AndroidManifest (FOREGROUND_SERVICE_SHORT_SERVICE, Baustein workmanager_android); lib/services/hintergrund_push.dart; lib/services/hintergrund_wartung.dart:118-122
  - name: Autostart nach Geräteneustart
    wofuer: wird von den mitgelieferten Bausteinen für Hintergrundbetrieb und Benachrichtigungen angefordert; solange die Hinweise ausgeschaltet sind, baut die App von sich aus keine Verbindung auf
    pflicht: false
    beleg: zusammengefuehrtes AndroidManifest (RECEIVE_BOOT_COMPLETED) – steht nicht in der App-eigenen Manifestdatei
  - name: Gerät wachhalten
    wofuer: hält auf Wunsch den Bildschirm nur während der geöffneten Kiosk-/Küchenansicht eingeschaltet; wird beim Verlassen freigegeben
    pflicht: false
    beleg: zusammengefuehrtes AndroidManifest (WAKE_LOCK) – steht nicht in der App-eigenen Manifestdatei
  - name: Vibration
    wofuer: kurze Rückmeldung beim Schnelleintrag sowie Benachrichtigungen
    pflicht: false
    beleg: zusammengefuehrtes AndroidManifest (VIBRATE)
  - name: Keine Standort-, Kontakt-, Mikrofon-, Speicher- oder Medienberechtigung
    wofuer: wird nicht angefordert; die Dateiauswahl läuft über den System-Dialog ohne Speicherzugriffsrecht
    pflicht: false
    beleg: zusammengefuehrtes AndroidManifest enthaelt kein READ_MEDIA_*, kein READ/WRITE_EXTERNAL_STORAGE; file_picker nutzt ACTION_GET_CONTENT

uebertragungen:
  - wohin: fehlerfuchs.eu
    was: Abruf der Schulferien des eingestellten Bundeslandes (Download einer öffentlichen JSON-Datei); gesendet wird nur die Anfrage selbst, keine Nutzerinhalte
    wann: beim App-Start automatisch, höchstens etwa einmal im Monat, sobald ein Bundesland eingestellt ist; zusätzlich manuell über „Feiertage & Ferien aktualisieren“
    freiwillig: false
    beleg: lib/services/schulferien.dart:29+85-96, lib/providers.dart:172-183, lib/features/home/home_shell.dart:32
  - wohin: orgafuchs.relais.fehlerfuchs.eu (fest eingestellt, von FehlerFuchs betrieben)
    was: Ende-zu-Ende-verschlüsselte Sync-Nachrichten (Plan-, Personen- und Termindaten sowie kurze Klartext-Nachrichten an die Gruppe – „Nachricht an alle“ – im verschlüsselten Umschlag) samt Gruppen- und Gerätekennung zur Adressierung; das Relais kann die Inhalte nicht lesen
    wann: nur wenn der Nutzer Geräte zu einem gemeinsamen Familienplan verbindet (ab Werk aus)
    freiwillig: true
    beleg: orgafuchs_kern/lib/sync/protocol/ofsp_transport.dart:28-31 (productionEndpoint), lib/providers.dart:42, lib/features/sync/ofsp_pairing_page.dart:75
  - wohin: ein selbst eingetragener ntfy-Server – ab Werk keiner; in der Auswahl vorgeschlagen ntfy.relais.fehlerfuchs.eu, wahlweise ntfy.sh oder eine eigene Adresse
    was: Benachrichtigungssignal „es gibt Änderungen“ samt Themenkennung; keine Planinhalte
    wann: 'nur wenn Benachrichtigungen eingeschaltet sind UND unter „Erweitert: Fallback-Dienst“ ein ntfy-Server eingetragen ist (gedacht für Geräte ohne Google-Dienste und für Windows)'
    freiwillig: true
    beleg: 'lib/services/push_ntfy.dart, lib/core/server_dropdown.dart:110-116 (Vorschlagsliste), lib/features/settings/settings_page.dart:88 (Feld leer) und 781-795 (Erweitert: Fallback-Dienst), lib/services/push_controller.dart (abonniert nur bei eingetragener Adresse)'
  - wohin: license.fehlerfuchs.eu
    was: Support-/Kontaktformular – eingegebene Nachricht, optional Name und E-Mail, dazu App-Name, Version und Betriebssystem. Nur wenn der Schalter „Technische Diagnose anhängen“ eingeschaltet ist (ab Werk aus), zusätzlich eine Diagnosedatei mit Gerätemodell, Android-Version, Prozessorarchitektur, Sprache, Zeitzone, Bildschirmgröße, Sync-Rolle, Push an/aus, Design und die letzten Einträge des Fehlerprotokolls der App; keine Namen, keine Planinhalte, kein Standort
    wann: nur wenn der Nutzer das Formular absendet
    freiwillig: true
    beleg: lib/services/kontakt_service.dart:20-58, lib/features/info/kontakt_page.dart
  - wohin: fehlerfuchs.eu (im externen Browser des Nutzers)
    was: Aufruf von Impressum, Datenschutz, Kontakt, Unterstützen und der Windows-Produktseite; die App sendet dabei selbst keine Daten
    wann: nur bei Antippen des jeweiligen Verweises
    freiwillig: true
    beleg: lib/features/info/info_page.dart:13-17
  - wohin: github.com / api.github.com (nur Windows-Fassung)
    was: Abruf der öffentlichen Versionsliste der FehlerFuchs-Downloads und – auf Nutzerwunsch – Download der signierten Setup-Datei; gesendet wird nur die Anfrage, keine Nutzerinhalte (GitHub sieht technisch die IP-Adresse)
    wann: nur in der Windows-Fassung; beim App-Start höchstens einmal täglich sowie manuell über „Nach Updates suchen“. Die Android-Fassung aktualisiert über den Play Store und baut dafür keine eigene Verbindung auf
    freiwillig: false
    beleg: lib/services/update_service.dart, lib/services/update_ui.dart, lib/features/info/info_page.dart, lib/features/home/home_screen.dart
  - wohin: Firebase Cloud Messaging / Google (nur Android)
    was: Registrierung des Geräts mit einer Push-Kennung bei Google und Empfang reiner Weck-Nachrichten; KEINE Termine/Namen/Planinhalte (nur Signal „es gibt Änderungen“). Google sieht technisch die Push-Kennung, die IP-Adresse und den Zeitpunkt
    wann: nur wenn Benachrichtigungen eingeschaltet sind; die Wecknachricht löst das Relais aus, nicht die App
    freiwillig: true
    beleg: lib/services/fcm_dienst.dart, android/app/google-services.json, android/app/src/main/AndroidManifest.xml
  - wohin: orgafuchs.relais.fehlerfuchs.eu – Weckdienst (nur Android, von FehlerFuchs betrieben)
    was: Anmeldung des Geräts für den Weckruf – eine in der App erzeugte Gerätekennung, die Push-Kennung von Google, ein Prüfwert (Hash) der Gruppenkennung und die Kennung des Geräteschlüssels (damit das auslösende Gerät sich nicht selbst weckt); keine Namen, keine Inhalte. Beim Ausschalten der Benachrichtigungen meldet sich das Gerät ab, der Eintrag wird gelöscht
    wann: nur wenn Benachrichtigungen eingeschaltet sind und das Gerät mit anderen verbunden ist; erneut, wenn Google die Push-Kennung wechselt
    freiwillig: true
    beleg: lib/services/fcm_dienst.dart:147-203 (Anmelden/Abmelden), Dienst-Steckbrief relaisserver.yaml (FCM-Weck-Registry)
  - wohin: Google Firebase (firebaseinstallations.googleapis.com, nur Android)
    was: Anmeldung der App-Installation bei Firebase – eine zufällig erzeugte Installationskennung zusammen mit der Kennung der App; keine Termine, Namen oder Planinhalte. Google sieht technisch die IP-Adresse und den Zeitpunkt
    wann: ab Version 1.9.6 erst, wenn Benachrichtigungen eingeschaltet werden (Einwilligung); vorher keine Verbindung zu Google. Bis einschließlich 1.9.5 geschah die Anmeldung einmalig beim ersten Start, auch ohne Einwilligung
    freiwillig: true
    beleg: Messung 01.10.2026 auf Emulator, Erststart ohne Einwilligung - 1.9.5+26 eine Verbindung zu firebaseinstallations.googleapis.com 2 s nach dem Start; 1.9.6+28 keine Verbindung der App (Protokoll-Proxy, Socketliste der App). Ab 1.9.6 im Manifest kein FirebaseInitProvider, firebase_messaging_auto_init_enabled=false; Firebase startet nur in lib/services/fcm_dienst.dart (initialisieren, nur mit Einwilligung) bzw. im Hintergrund-Handler einer Wecknachricht

fremde_dienste:
  - name: Google ML Kit – Barcode Scanning (mitgeliefertes Modell, über die Bibliothek mobile_scanner)
    wofuer: Erkennung des Beitritts-QR-Codes; die Erkennung läuft auf dem Gerät
    wann: nur solange der QR-Scanner geöffnet ist
  - name: ntfy (quelloffener Benachrichtigungsdienst)
    wofuer: Ausweichweg für das Push-Signal bei Änderungen (Geräte ohne Google-Dienste, Windows); ab Werk ist kein Server eingetragen, vorgeschlagen wird der von FehlerFuchs betriebene, alternativ ntfy.sh oder ein eigener
    wann: nur bei eingeschalteten Benachrichtigungen und eingetragenem Server
  - name: GitHub (Microsoft) – Auslieferung der Windows-Aktualisierungen
    wofuer: stellt die öffentliche Versionsliste und die signierte Setup-Datei für die Selbst-Aktualisierung der Windows-Fassung bereit; kein Konto, keine Anmeldung, keine Nutzerinhalte
    wann: nur bei der Windows-Update-Prüfung (automatisch höchstens täglich beim Start oder manuell)
  - name: Firebase Cloud Messaging (Google) – zuverlässiger Weck-Push (nur Android)
    wofuer: weckt die App aus Doze/geschlossenem Zustand für den Empfang von Änderungen; das Gerät registriert sich mit einer Push-Kennung bei Google. In der Nachricht KEINE Termine/Namen/Planinhalte (nur Wecksignal) – der eigentliche Abgleich bleibt Ende-zu-Ende-verschlüsselt über das Relais
    wann: nur bei eingeschalteten Benachrichtigungen (Android); ab Version 1.9.6 gilt das auch für die Anmeldung bei Firebase (bis 1.9.5 einmalig beim ersten Start, siehe Übertragungen)
    hinweis: Google verarbeitet Push-Kennung, Installationskennung und Zustelldaten als Auftragsverarbeiter nach Art. 28 DSGVO auf Grundlage der Firebase Data Processing and Security Terms. Die Übermittlung in die USA stützt sich auf das EU-US Data Privacy Framework, Standardvertragsklauseln dienen als Rückfall. Google speichert Firebase-Installationskennungen bis zur Löschung und entfernt sie danach binnen 180 Tagen auch aus Sicherungen. Belegstufe - laut Googles Firebase-Datenschutzseite und Firebase-Bedingungen, übernommen aus dem Dienst-Steckbrief relaisserver.yaml (Stand 30.09.2026); Entscheidung Matthias vom 03.09.2026, bestätigt am 30.09.2026 (keine Rechtsberatung)
  - name: Kein Google-Konto, kein Analytics, kein Play Billing, keine Karten, keine Schriften aus dem Netz
    wofuer: nicht eingebunden (App ist kostenlos, keine In-App-Käufe). Firebase wird ausschließlich für den Weck-Push genutzt (s. o.), NICHT für Analytics/Werbung/Tracking
    wann: entfällt

konto_noetig: false
tracking: false
werbung: false
absturzberichte: false
daten_an_dritte_verkauft: false

loeschung: >-
  Alle Inhalte liegen auf dem Gerät. Einzelne Einträge, Personen und Dienste
  lassen sich in der App löschen; der Einrichtungsassistent kann im Modus
  „Komplett neu“ den gesamten Bestand zurücksetzen. Mit der Deinstallation
  verschwinden Datenbank, Protokolle, PDF-Ablage und Sicherungen im App-Ordner.
  Beim Abgleich über das Relais liegen dort nur verschlüsselte, kurzlebige Nachrichten;
  ohne die Schlüssel der Familiengruppe sind sie nicht lesbar. Über das Support-Formular
  gesendete Nachrichten werden auf Anfrage per E-Mail gelöscht. Die Anmeldung für den
  Weckruf beim Relais wird beim Ausschalten der Benachrichtigungen gelöscht; ungültige
  Push-Kennungen entfernt das Relais selbst. Firebase-Installationskennungen speichert
  Google bis zur Löschung und entfernt sie danach binnen 180 Tagen auch aus Sicherungen.

besonderheiten: >-
  Der Abgleich zwischen mehreren Geräten kommt ohne Konto und ohne
  Registrierung aus: Ein Gerät ist „Hauptgerät“, weitere treten über eine
  QR-Einladung des Hauptgeräts bei, die mit einem Kurzcode bestätigt wird. Die
  Einladung überträgt die Schlüssel für die Ende-zu-Ende-Verschlüsselung; das
  Relais sieht daher nur verschlüsselte Daten sowie Gruppen- und Gerätekennungen
  für die Zustellung – weder Namen noch Inhalte. Das Relais ist fest eingestellt
  und wird von FehlerFuchs betrieben; der Benachrichtigungsserver ist frei
  wählbar und lässt sich auch selbst betreiben. Einen Abgleich direkt im
  Heimnetz ohne Server gibt es nicht mehr. Die App zeigt eine Übersicht der verwendeten
  Open-Source-Bausteine und Datenquellen. Da Dienstpläne mittelbar
  Rückschlüsse auf Arbeits- und Abwesenheitszeiten mehrerer Personen zulassen,
  können die lokal gespeicherten Inhalte sensibel sein.

vorhandener_text: >-
  Vollständige Offline-Datenschutzerklärung in
  lib/features/info/datenschutz_page.dart, erreichbar über Einstellungen ->
  Info & Rechtliches; zusätzlicher Link auf die kanonische Online-Fassung
  https://fehlerfuchs.eu/datenschutz/. In-App-Impressum mit Anschrift und E-Mail,
  ohne Telefonnummer,
  Transparenzseite lib/features/info/open_source_page.dart und Offline-Changelog.

offene_fragen: >-
  1) Unklar, ob und wie lange die angefragten Server (fehlerfuchs.eu für die
  Schulferien, das Relais, der ntfy-Server, license.fehlerfuchs.eu sowie
  github.com für die Windows-Update-Prüfung) IP-Adressen oder Zugriffe
  protokollieren – das hängt vom Serverbetrieb ab, nicht von der App.
  2) Unklar, ob das mitgelieferte Google-ML-Kit-Barcodemodul eigene Verbindungen
  zu Google aufbaut (etwa Modell- oder Telemetriezugriffe); aus dem App-Code ist
  keine solche Verbindung ersichtlich, die Bibliothek wurde nicht im
  Netzwerkmitschnitt geprüft.
  3) Unklar, welche Daten der Endpunkt license.fehlerfuchs.eu nach Empfang einer
  Support-Anfrage speichert und wie lange.
  4) Nicht geprüft, ob die dem Support-Formular optional angehängte
  Diagnosedatei in Einzelfällen Inhalte aus Dienstplänen enthalten kann; sie ist
  als rein technische Zusammenfassung angelegt (lib/core/diagnose/diagnose.dart).
  5) Bis 1.9.5 bereits angelegte Firebase-Installationskennungen bleiben bei
  Google, bis Google sie nach seinen Regeln löscht; die App löscht sie nicht
  von sich aus. Ab 1.9.6 entsteht ohne Einwilligung keine neue Kennung
  (gemessen 01.10.2026).
